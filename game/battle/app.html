<title>戦闘画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   射的の杖・試作版 — 戦闘画面（案E「二段」）
   見た目だけ。機能は入っていない。

   いちばん大事な決めごと：
   画面ぜんぶを「仮想 640×360 のドット」で組んで、最後に整数倍で拡大する。
   盤の裏画面が 300×250 なので、仮想画面ではそれが等倍で置ける。
   こうすると、盤のドット・人物のドット・枠線・文字が
   <b>ぜんぶ同じ大きさの升目に乗る</b>。素人くさく見える最大の原因は、
   ここが揃っていないこと（＝解像度の違うものを貼り合わせて見える）。
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* 影は下＋右。光は左上から。全部の凹凸をこの向きにそろえる */
  --u: 2px;                       /* 仮想 1 ドットの実寸 */
}
*{box-sizing:border-box}
html,body{margin:0;background:#07090b}
body{color:#d2c8b2;font-family:"DotGothic16",ui-monospace,monospace;
  -webkit-font-smoothing:none;image-rendering:pixelated}

.hold{position:relative;width:100%;overflow:hidden;background:#07090b}
/* 仮想画面。ここに 640×360 で描いて、整数倍で拡大する */
#scr{position:absolute;left:0;top:0;width:640px;height:360px;
  transform-origin:0 0;overflow:hidden;image-rendering:pixelated}
#scr *{image-rendering:pixelated}

/* 文字。DotGothic16 は 16px 設計なので、仮想 8（＝実寸 16）で焼くと崩れない */
.t{font-size:8px;line-height:10px}
/* 絵の上に乗る文字は 1 ドットの硬い影を付ける。ぼかさない */
.t.sh,.lbl.sh{text-shadow:1px 1px 0 #07090b}
.t2{font-size:16px;line-height:18px}

/* 面。光は左上：上と左が明るく、下と右が暗い */
.plate{position:absolute}
.plate>.f{position:absolute;inset:0}
.plate>.hi{position:absolute;left:0;top:0;right:1px;height:1px}
.plate>.hl{position:absolute;left:0;top:0;bottom:1px;width:1px}
.plate>.lo{position:absolute;left:1px;right:0;bottom:0;height:1px}
.plate>.lr{position:absolute;top:1px;right:0;bottom:0;width:1px}
.plate.sunk>.hi,.plate.sunk>.hl{opacity:0}
.plate.sunk>.dk{position:absolute;left:0;top:0;right:1px;height:1px}

.lbl{font-size:8px;line-height:10px;letter-spacing:0;color:#7a7264}

/* 画面は縦横とも真ん中に置く。まわりは余白（整数倍で入りきらないぶん） */
#wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
/* 3 層。#whl だけは組み直さない（組み直すと canvas の絵が消える） */
#bg,#fg,#dim{position:absolute;left:0;top:0;width:640px;height:360px}
#bg{z-index:1} #dim{z-index:2;background:#07090b;opacity:0;pointer-events:none;
  transition:opacity .14s linear}
#whl{position:absolute;z-index:3;transform-origin:0 0;transition:transform .17s ease-out}
#frm{position:absolute;left:0;top:0}
#fg{z-index:5}
#wheel{position:absolute;display:block;image-rendering:pixelated}
.hit:hover{filter:brightness(1.2)}
.throwhit:active{filter:brightness(1.3)}
</style>


<div id="wrap"><div class="hold" id="hold"><div id="scr">
  <div id="bg"></div>
  <div id="dim"></div>
  <div id="whl"><div id="frm"></div><canvas id="wheel"></canvas></div>
  <div id="fg"></div>
</div></div></div>

/* ═══════════════════════════════════════════════════════════════════
   2. ディザ。グラデーションを使わない
   にじんだ階調はドット絵の見た目を一発で壊す。
   2 色を升目で混ぜて、段の途中を作る（順序ディザ・4×4 のベイヤー）。
   ═══════════════════════════════════════════════════════════════════ */
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
/** c0 の上に c1 を level/16 の密度で撒いた 4×4 の模様を返す */
function dither(c0, c1, level){
  let r = `<rect width="4" height="4" fill="${c0}"/>`;
  for (let y=0;y<4;y++) for (let x=0;x<4;x++)
    if (BAYER[y][x] < level) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c1}"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" shape-rendering="crispEdges">${r}</svg>`;
  /* ★ 引用符は必ずシングルにする。
     この値は style="..." の中に入る。ダブルにすると url(" のところで
     style 属性が閉じてしまい、background-image が丸ごと消える。
     消えても何のエラーも出ないので、ディザが 1 つも効いていないことに
     ずっと気づかなかった。encodeURIComponent はシングルクォートを
     encode しないが、この SVG の中に ' は無い（属性は全部ダブル＝%22）。 */
  return `url('data:image/svg+xml;utf8,${encodeURIComponent(svg)}')`;
}
const ditherCSS = (c0,c1,lv) => `background-image:${dither(c0,c1,lv)};background-size:4px 4px`;

/* ═══════════════════════════════════════════════════════════════════
   3. ドット絵。升目を手で塗らず、形から起こして自動で陰と縁を付ける
   ここが本格的なドット絵との差がいちばん出るところ。
   ・光の向きを 1 つに決める（左上）
   ・当たっている辺は 1 段明るく、影の辺は 1 段暗く
   ・輪郭は黒ではなく、その色の いちばん暗い段（＝色付きの輪郭）
   手で 1 マスずつ塗る代わりに、形を置いてから機械的に付ける。
   ═══════════════════════════════════════════════════════════════════ */
function raster(w, h, ops){
  const g = Array.from({length:h}, ()=>new Array(w).fill(null));
  const put = (x,y,c) => { if (x>=0&&y>=0&&x<w&&y<h) g[y][x] = c; };
  for (const o of ops){
    if (o.k === "r"){
      for (let y=o.y;y<o.y+o.h;y++) for (let x=o.x;x<o.x+o.w;x++) put(x,y,o.c);
    } else if (o.k === "e"){                       // 升目の楕円
      const rx = o.w/2, ry = o.h/2, cx = o.x+rx-0.5, cy = o.y+ry-0.5;
      for (let y=o.y;y<o.y+o.h;y++) for (let x=o.x;x<o.x+o.w;x++){
        const dx = (x-cx)/rx, dy = (y-cy)/ry;
        if (dx*dx + dy*dy <= 1.02) put(x,y,o.c);
      }
    } else if (o.k === "p"){ put(o.x,o.y,o.c); }
    else if (o.k === "l"){                          // 太さ 1 の線
      const n = Math.max(Math.abs(o.x2-o.x), Math.abs(o.y2-o.y));
      for (let i=0;i<=n;i++)
        put(Math.round(o.x + (o.x2-o.x)*i/n), Math.round(o.y + (o.y2-o.y)*i/n), o.c);
    }
  }
  return g;
}
/** 左上から光を当てる。上か左が空いていれば 1 段明るく、下か右が空いていれば 1 段暗く */
function shade(g){
  const h = g.length, w = g[0].length;
  const at = (x,y) => (x<0||y<0||x>=w||y>=h) ? null : g[y][x];
  const out = g.map(r=>r.slice());
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const c = g[y][x]; if (!c || c.fix) continue;
    const lit  = !at(x,y-1) || !at(x-1,y);
    const dark = !at(x,y+1) || !at(x+1,y);
    if (lit && !dark) out[y][x] = {r:c.r, s:c.s+1};
    else if (dark && !lit) out[y][x] = {r:c.r, s:c.s-1};
  }
  return out;
}
/** 輪郭。塗った升目の外側に、その色のいちばん暗い段を置く */
function outline(g){
  const h = g.length, w = g[0].length;
  const at = (x,y) => (x<0||y<0||x>=w||y>=h) ? null : g[y][x];
  const out = g.map(r=>r.slice());
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    if (g[y][x]) continue;
    const n = at(x-1,y) || at(x+1,y) || at(x,y-1) || at(x,y+1);
    if (n) out[y][x] = {r:n.r, s:0, fix:true};
  }
  return out;
}
/** 升目 → SVG。横に同じ色が続くところは 1 本の矩形にまとめる */
function toSVG(g, cls){
  const h = g.length, w = g[0].length;
  let r = "";
  for (let y=0;y<h;y++){
    let x = 0;
    while (x < w){
      const c = g[y][x];
      if (!c){ x++; continue; }
      const col = C(c.r, c.s);
      let n = 1;
      while (x+n < w){ const d = g[y][x+n]; if (!d || C(d.r,d.s) !== col) break; n++; }
      r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${col}"/>`;
      x += n;
    }
  }
  return `<svg class="${cls||""}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
    shape-rendering="crispEdges">${r}</svg>`;
}
/** 形の座標ごと k 倍する。SVG を引き伸ばすと格子が壊れるので、
    升目に起こす前に大きくする。こうすれば 1 マスは画面の 1 ドットのまま。 */
function scaleOps(ops, k){
  const r = v => Math.round(v*k);
  return ops.map(o => o.k === "l"
    ? {...o, x:r(o.x), y:r(o.y), x2:r(o.x2), y2:r(o.y2)}
    : {...o, x:r(o.x), y:r(o.y), w:o.w!==undefined?Math.max(1,r(o.w)):undefined,
             h:o.h!==undefined?Math.max(1,r(o.h)):undefined});
}
const SPRITE_CACHE = {};
const kOf = (n,k) => k === undefined ? (SHAPES[n].k || 1) : k;
const spriteW = (n,k) => Math.round(SHAPES[n].w * kOf(n,k));
const spriteH = (n,k) => Math.round(SHAPES[n].h * kOf(n,k));
/** 同じ絵を大きさ違いで使う。SVG を引き伸ばさず、升目に起こす段階で倍率を変える */
function sprite(name, k){
  const kk = kOf(name, k), key = name + "@" + kk;
  if (!SPRITE_CACHE[key]){
    const d = SHAPES[name];
    SPRITE_CACHE[key] = toSVG(outline(shade(
      raster(spriteW(name,kk), spriteH(name,kk), kk === 1 ? d.ops : scaleOps(d.ops, kk)))));
  }
  return SPRITE_CACHE[key];
}
const S = (r,s) => ({r, s});

/* ═══════════════════════════════════════════════════════════════════
   A. 盤の中身
   区画は「ラベルと色」の並び。数も中身も色も走らせたまま変えられる。
   数が変わると回るもの（角度・フレット・帯の絵・統計の器）は、
   ぜんぶ rebuild() から呼ぶ。ここを通さずに N を書き換えると必ず壊れる。
   ═══════════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, G = 9.81;
const norm = a => ((a % TAU) + TAU) % TAU;

/** 区画の並び。{label, colour} の配列。これが唯一の中身。 */
let POCKETS = [];
let N = 0, SLOT = 0;

/* 色の見本。丸め先の表（PAL）に入っている色から選んであるので、
   ドットに丸めても選んだ色のまま出る。 */
const BALL_D = 0.0105 * 2;
const MIN_W_RATIO = 1.25;                 // これを割ると玉が収まらない
const SAFE_W_RATIO = 1.45;               // これを割ると詰まりやすくなる（注意だけ）
const innerArc = n => TAU * 0.196 / n;
const MAX_N = Math.floor(TAU * 0.196 / (BALL_D * MIN_W_RATIO));
const SAFE_N = Math.floor(TAU * 0.196 / (BALL_D * SAFE_W_RATIO));
const MIN_N = 2;

/** 色を、ドットに丸めたあとの色そのものへ寄せる。
    絵は決めた色数へ丸めてから出すので、丸めて別の色になる色を持たせると
    「選んだ色」と「出ている色」が食い違う。持つ前に寄せておけば食い違わない。 */
function snapColour(hex){
  if (!/^#[0-9a-f]{6}$/i.test(hex||"")) return "#1c1c22";
  if (typeof LUT === "undefined") return hex;          // 起動前は素通し
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return PAL[LUT[((r>>3)<<10) | ((g>>3)<<5) | (b>>3)]];
}

/** 色を、ドットに丸めたあとの色そのものへ寄せる。
    絵は 44 色へ丸めてから引き伸ばすので、丸めて別の色になる色を持たせると
    「選んだ色」と「出ている色」が食い違う。持つ前に寄せておけば食い違わない。
    見本に入れた色でも起きる：#101013 は丸めると #171310 になる
    （32 段に落とした升目の中心が、そちらに近い）。 */
function setPockets(list){
  const a = list.slice(0, MAX_N).map(p => ({
    label: String(p.label == null ? "" : p.label).slice(0, 6),
    colour: snapColour(p.colour),
  }));
  while (a.length < MIN_N) a.push({label:String(a.length+1), colour:"#1c1c22"});
  POCKETS = a;
  N = POCKETS.length;
  SLOT = TAU / N;
  rebuild();
}

/* ═══════════════════════════════════════════════════════════════════
   B. 盤の断面（SI・メートル）
   2D 版は (角度, 半径) しか持たず、離脱条件を式で書いていた。
   こちらは玉を 3 次元の質点として扱い、面との接触だけを解く。
   「いつトラックを離れるか」は条件文ではなく、接触が切れた結果として出る。
   ═══════════════════════════════════════════════════════════════════ */
const W = {
  rTurret:  0.038,   // 中央の真鍮ハンドル
  rCone:    0.098,   // 円錐の外縁
  rPocketIn:0.196,   // ポケット帯の内側
  rRotor:   0.250,   // ロータ外縁
  rTrack:   0.300,   // すり鉢とトラックの境
  rRim:     0.330,   // トラックの上端
  rWall:    0.340,   // 垂直の壁。速い玉はここに押しつけられて走る
  rBowl:    0.4065,  // 32 インチ盤の外周
  rDefl:    0.290,   // ディフレクタの輪
  nDefl:    8,
  aCone:    18*Math.PI/180,
  aSlope:   19*Math.PI/180,
  aTrack:   32*Math.PI/180,
  ball:     0.0105,  // 玉の半径（直径 21mm）
  hFret:    0.008,   // フレット（仕切り）の高さ
  rDeflR:   0.014,   // ディフレクタを球で近似した半径
  hDefl:    0.009,   // 面からの出っぱり
};
const TAN_C = Math.tan(W.aCone), TAN_S = Math.tan(W.aSlope), TAN_T = Math.tan(W.aTrack);
const Z_SLOPE = (W.rTrack - W.rRotor) * TAN_S;      // すり鉢の上端の高さ
const Z_TRACK = Z_SLOPE + (W.rRim - W.rTrack) * TAN_T;
const Z_CONE  = W.rPocketIn * TAN_C;                 // 円錐の頂点の高さ

/** ポケット帯の外の縁を z=0 とした、半径 r における面の高さ。
    帯はわずかに外下がり（3 mm）にしてある。実物のポケットも底が外へ傾いていて、
    玉は外側の壁に寄りかかって止まる。ここを真っ平らにすると、玉が帯の内の縁に
    たまり、後から降りてきた玉が円錐の上で行き場を失って収まらなくなる。 */
const POCKET_DROP = 0.003;
const BAND_W = W.rRotor - W.rPocketIn;
const TAN_B = POCKET_DROP / BAND_W;            // 帯の傾き（約 3.2°）
function surfZ(r){
  if (r <= W.rPocketIn) return POCKET_DROP + (W.rPocketIn - r) * TAN_C;
  if (r <= W.rRotor)    return POCKET_DROP * (W.rRotor - r) / BAND_W;
  if (r <= W.rTrack)    return (r - W.rRotor) * TAN_S;
  return Z_SLOPE + (r - W.rTrack) * TAN_T;
}
/** dz/dr */
function surfSlope(r){
  if (r <= W.rPocketIn) return -TAN_C;
  if (r <= W.rRotor)    return -TAN_B;
  if (r <= W.rTrack)    return TAN_S;
  return TAN_T;
}
/** 参考値：点として滑る玉がトラックを離れる角速度（Small & Tse の式）。
    この実装では条件として使っていない。接触が切れれば勝手に落ちる。 */
const OMEGA_REF = Math.sqrt(G * TAN_T / W.rRim);

/* 乱数 */
let rngState = (Math.random()*4294967296)>>>0;
function rnd(){
  rngState |= 0; rngState = (rngState + 0x6D2B79F5) | 0;
  let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a,b) => a + rnd()*(b-a);
const band = (a,b,k) => { const m=(a+b)/2, h=(b-a)/2*k; return rr(m-h, m+h); };

/* ═══════════════════════════════════════════════════════════════════
   C. 投げ方。ここだけが乱数で、以降は接触と重力が決める
   ═══════════════════════════════════════════════════════════════════ */
function launch(tight, nBalls){
  const k = tight ? 0.02 : 1;
  const n = Math.max(1, nBalls || 1);
  // 玉ごとの初速と投げ始めの角度。まとめて投げるので、
  // 同じ場所に重ねないよう円周に散らして、速さも少しずつ変える。
  const each = [];
  for (let i=0;i<n;i++){
    each.push({
      w0:  band(18, 26, k) * (1 + (i - (n-1)/2) * 0.035),
      ph0: (tight ? 0 : rnd()*TAU) + i * TAU / n,
    });
  }
  return {
    each,
    ab:  band(1.05, 1.40, k),    // トラック上の角減速（転がり摩擦）
    wr0: band(1.15, 2.35, k),    // ロータ
    ar:  band(0.010, 0.018, k),
    tr0: tight ? 0 : rnd()*TAU,
  };
}

function newSpin(ic, tr){
  const r = W.rWall - W.ball;
  const z = surfZ(r) + W.ball / Math.cos(Math.atan(surfSlope(r)));
  return {
    ic, phase:"track", t:0,
    tr: tr === undefined ? ic.tr0 : tr, wr: ic.wr0, ar: ic.ar, ab: ic.ab,
    balls: ic.each.map(e => ({
      p:[Math.cos(e.ph0)*r, Math.sin(e.ph0)*r, z],
      v:[-Math.sin(e.ph0)*e.w0*r, Math.cos(e.ph0)*e.w0*r, 0],
      phase:"track", done:false,
      defHits:0, fretHits:0, air:0, rev:0, settleT:0, deflCool:0, inRotor:0,
      pocket:-1, number:-1,
    })),
    hold:undefined,
  };
}

const DT = 1/1500;                             // 衝突を取りこぼさない刻み
const len3 = v => Math.hypot(v[0],v[1],v[2]);

/** 収まった玉を、その瞬間の位置のままロータに固定する。
    ロータと一緒に回る座標（角度差・半径・高さ）だけを覚えておき、
    以降はそれを回して描く。ポケットの中心へ寄せ直さない。
    寄せると、決まった瞬間に玉が数センチ跳ぶ。ここを覚えておく角度は
    区画を決めたときと同じ `ph - tr` なので、描く場所は必ず発表と同じ区画に入る。 */
function fixRest(s, b){
  b.restA = norm(Math.atan2(b.p[1], b.p[0]) - s.tr);
  b.restR = Math.hypot(b.p[0], b.p[1]);
  b.restZ = b.p[2];
  b.v = [0,0,0];
}

/** 収まった玉の置き場所。ロータの向き tr を与えると、玉ごとの座標を返す。
    描画も物理もここだけを通す。ここを 2 か所に書くと、必ずどちらかがずれる。 */
function restPositions(rest, tr){
  return rest.map(x => {
    const a = norm(tr + x.a);
    return [Math.cos(a)*x.r, Math.sin(a)*x.r, x.z];
  });
}

/** 玉が休む場所の記録（ロータに固定した座標）。玉ごとに 1 つ。 */
const restOf = b => ({a:b.restA, r:b.restR, z:b.restZ, pocket:b.pocket});

/** 1 玉ぶんを 1 ステップ進める */
function stepBall(s, b){
  const p = b.p, v = b.v;
  v[2] -= G*DT;                                // 重力
  p[0] += v[0]*DT; p[1] += v[1]*DT; p[2] += v[2]*DT;

  let r = Math.hypot(p[0], p[1]);
  const ph = Math.atan2(p[1], p[0]);
  const er = [Math.cos(ph), Math.sin(ph), 0];
  const et = [-Math.sin(ph), Math.cos(ph), 0];
  if (r > W.rTrack) b.rev += Math.abs(v[0]*et[0]+v[1]*et[1]) * DT / (TAU*r);
  let touched = false;

  /* ① 垂直の壁。速い玉はここに押しつけられて走る */
  const rMax = W.rWall - W.ball;
  if (r > rMax){
    const vr = v[0]*er[0] + v[1]*er[1];
    p[0] = er[0]*rMax; p[1] = er[1]*rMax;
    if (vr > 0){ v[0] -= er[0]*vr*1.35; v[1] -= er[1]*vr*1.35; }
    r = rMax; touched = true;
  }

  /* ② 回転面（トラック・すり鉢・ポケットの床・円錐） */
  const sl = surfSlope(r), inv = 1/Math.sqrt(1+sl*sl);
  const n = [-sl*er[0]*inv, -sl*er[1]*inv, inv];
  const gap = (p[2] - surfZ(r))*inv - W.ball;
  if (gap < 0){
    p[0] -= n[0]*gap; p[1] -= n[1]*gap; p[2] -= n[2]*gap;
    const vn = v[0]*n[0] + v[1]*n[1] + v[2]*n[2];
    const hard = Math.abs(vn) > 0.25;          // 叩きつけか、載っているだけか
    if (vn < 0){
      const e = hard ? 0.42 : 0.05;
      const dvn = -(1+e)*vn;
      v[0] += n[0]*dvn; v[1] += n[1]*dvn; v[2] += n[2]*dvn;
      // 叩きつけ（滑る）はクーロン摩擦、載っているだけ（転がる）はほぼ効かない。
      // 転がっている玉に滑り摩擦を毎ステップかけると 3 秒で止まる。実物は 10 秒以上走る。
      const mu = hard ? 0.25 : 0.010;
      const vd = v[0]*n[0]+v[1]*n[1]+v[2]*n[2];
      const vt = [v[0]-n[0]*vd, v[1]-n[1]*vd, v[2]-n[2]*vd];
      const vtl = len3(vt);
      if (vtl > 1e-9){
        const drop = Math.min(vtl, mu*dvn);
        v[0] -= vt[0]/vtl*drop; v[1] -= vt[1]/vtl*drop; v[2] -= vt[2]/vtl*drop;
      }
    }
    touched = true;
    // 転がり抵抗。角減速が ab 一定になるよう接線方向に効かせる
    if (r > 1e-6){
      const vtan = v[0]*et[0] + v[1]*et[1];
      const dec = (r > W.rTrack ? s.ab : 2.6) * r * DT;
      const nv = Math.abs(vtan) <= dec ? 0 : vtan - Math.sign(vtan)*dec;
      v[0] += et[0]*(nv - vtan); v[1] += et[1]*(nv - vtan);
    }
  }
  if (!touched) b.air += DT;

  /* ③ ディフレクタ。盤に固定された 8 個の突起。散らばりの主因 */
  if (b.deflCool > 0) b.deflCool -= DT;
  if (r > W.rRotor && r < W.rTrack + 0.02 && b.deflCool <= 0){
    for (let k=0;k<W.nDefl;k++){
      const a = k*TAU/W.nDefl, dz = surfZ(W.rDefl) + W.hDefl;
      const dx = p[0]-Math.cos(a)*W.rDefl, dy = p[1]-Math.sin(a)*W.rDefl, dzz = p[2]-dz;
      const d = Math.hypot(dx,dy,dzz), R = W.rDeflR + W.ball;
      if (d < R && d > 1e-9){
        const nn = [dx/d, dy/d, dzz/d], push = R - d;
        p[0] += nn[0]*push; p[1] += nn[1]*push; p[2] += nn[2]*push;
        const vn = v[0]*nn[0]+v[1]*nn[1]+v[2]*nn[2];
        if (vn < 0){
          const dvn = -(1+0.45)*vn;
          v[0] += nn[0]*dvn; v[1] += nn[1]*dvn; v[2] += nn[2]*dvn;
          v[0] *= 0.72; v[1] *= 0.72;
          b.defHits++; b.deflCool = 0.06;
        }
        break;
      }
    }
  }

  /* ④ フレット。ロータと一緒に回る仕切り壁。
     仕切りの位置は pocketStart と同じ位相（ROTOR_PHASE 込み）で取る。
     ここを norm(ph - s.tr) だけで取ると、玉がぶつかる壁と、絵に描いてある
     仕切りが SLOT の端数ぶんずれる。37 区画では 1/4 区画ぶん離れた
     見えない壁に玉が寄りかかって止まっていた（出目は判定が一貫していたので
     合っていたが、絵として嘘）。 */
  if (r > W.rPocketIn - 0.01 && r < W.rRotor + 0.01 && p[2] < W.hFret + W.ball){
    const rel = norm(ph - s.tr - ROTOR_PHASE);
    const k = Math.round(rel/SLOT);
    const dist = (rel - k*SLOT) * r;
    if (Math.abs(dist) < W.ball){
      const sgn = Math.sign(dist) || 1;
      const push = (W.ball - Math.abs(dist)) * sgn;
      p[0] += et[0]*push; p[1] += et[1]*push;
      const vw = [-Math.sin(ph)*s.wr*r, Math.cos(ph)*s.wr*r, 0];
      const relT = (v[0]-vw[0])*et[0] + (v[1]-vw[1])*et[1];
      if (relT*sgn < 0){
        const dv = -(1+0.32)*relT;
        v[0] += et[0]*dv; v[1] += et[1]*dv;
        b.fretHits++;
      }
    }
  }

  /* ⑤ 収まり判定。ロータに対して止まったら、その区画 */
  if (r > W.rPocketIn - 0.005 && r < W.rRotor + 0.005 && p[2] < W.ball*1.6){
    const vw = [-Math.sin(ph)*s.wr*r, Math.cos(ph)*s.wr*r, 0];
    if (Math.hypot(v[0]-vw[0], v[1]-vw[1], v[2]) < 0.22){
      b.settleT += DT;
      if (b.settleT > 0.12){
        b.phase = "done"; b.done = true;
        b.pocket = pocketAt(ph, s.tr);
        b.number = POCKETS[b.pocket].label;
        fixRest(s, b);
      }
    } else b.settleT = 0;
  } else b.settleT = 0;

  if (!b.done)
    b.phase = r > W.rTrack ? "track" : (r > W.rRotor ? "fall" : "scatter");

  // トラックを降りてから長く収まらない玉は、少しずつ勢いを抜く。
  // 玉が複数あると互いに突き合って永久に収まらないことがあるため。
  // 押し戻されて段階が fall に戻ることがあるので、この時計は巻き戻さない
  //（巻き戻すと 6 玉で 600 回に 4 回、打ち切りに落ちた）。
  if (r < W.rTrack){
    b.inRotor += DT;
    if (b.inRotor > 5){
      const k = 1 - Math.min(0.9, (b.inRotor - 5) * 0.6) * DT * 6;
      const vw = [-Math.sin(ph)*s.wr*r, Math.cos(ph)*s.wr*r, 0];
      b.v[0] = vw[0] + (b.v[0]-vw[0])*k;
      b.v[1] = vw[1] + (b.v[1]-vw[1])*k;
      b.v[2] *= k;
    }
  }
}

/** 玉どうしの当たり。等質量の球なので、法線方向の速度を反発係数で入れ替える */
function ballCollide(s){
  const B = s.balls, D = W.ball*2;
  for (let i=0;i<B.length;i++) for (let j=i+1;j<B.length;j++){
    const a = B[i], c = B[j];
    if (a.done && c.done) continue;
    const dx = c.p[0]-a.p[0], dy = c.p[1]-a.p[1], dz = c.p[2]-a.p[2];
    const d = Math.hypot(dx,dy,dz);
    if (d >= D || d < 1e-9) continue;
    // 収まった玉に転がっている玉が重なったら、収まったほうを起こす。
    // 収まった玉を「動かない壁」のままにすると、そこへ押しつけられた玉が
    // 円錐の上（帯のすぐ内側）で釣り合ってしまい、永久に収まらない。
    // 実測：30 秒たっても決まらない回が 6 玉 400 回中 29 → 5 に減る。
    // 同じ場所に 2 つは居られない、というだけのことなので物理としても素直。
    if (a.done !== c.done){
      const st = a.done ? a : c, rl = a.done ? c : a;
      // 転がっているほうが円錐（帯より内側）へ押し込まれているときだけ起こす。
      // 触れたら必ず起こすことにすると、区画が少なくて 1 区画に何個も入る盤で、
      // 並んで止まっている玉を延々と起こし続けて決まらなくなる
      //（6 玉・2 区画で 250 回中 111 回が 30 秒たっても未決）。
      if (Math.hypot(rl.p[0], rl.p[1]) < W.rPocketIn){
        st.done = false; st.phase = "fall"; st.settleT = 0;
      }
    }
    const n = [dx/d, dy/d, dz/d];
    // めり込みを半分ずつ押し戻す（止まっている玉は動かさない）
    const push = D - d;
    if (a.done)      { c.p[0]+=n[0]*push; c.p[1]+=n[1]*push; c.p[2]+=n[2]*push; }
    else if (c.done) { a.p[0]-=n[0]*push; a.p[1]-=n[1]*push; a.p[2]-=n[2]*push; }
    else {
      a.p[0]-=n[0]*push/2; a.p[1]-=n[1]*push/2; a.p[2]-=n[2]*push/2;
      c.p[0]+=n[0]*push/2; c.p[1]+=n[1]*push/2; c.p[2]+=n[2]*push/2;
    }
    const va = a.v[0]*n[0]+a.v[1]*n[1]+a.v[2]*n[2];
    const vc = c.v[0]*n[0]+c.v[1]*n[1]+c.v[2]*n[2];
    const rel = vc - va;
    // 近づいていない（触れているだけの）ペアは弾かない。押し合ったまま
    // 微振動する 2 玉が永久に収まらなくなる（6 玉で 600 回に 3 回、打ち切りに落ちていた）。
    if (rel > -0.02) continue;
    const e = 0.55;
    // 止まっている玉は動かない壁として扱う（無限質量）
    const ja = c.done ? -(1+e)*rel : -(1+e)*rel/2;
    const jc = a.done ?  (1+e)*rel :  (1+e)*rel/2;
    // settleT はここでは触らない。収まり判定が「ロータに対する速さ」を見ていて、
    // 本当に弾かれれば判定側が自分で 0 に戻す。
    if (!a.done){ a.v[0]-=n[0]*ja; a.v[1]-=n[1]*ja; a.v[2]-=n[2]*ja; }
    if (!c.done){ c.v[0]-=n[0]*jc; c.v[1]-=n[1]*jc; c.v[2]-=n[2]*jc; }
  }
}

/** 1 ステップ。画面にも統計にも同じものを使う。 */
function step(s){
  if (s.phase === "done") return;
  s.t += DT;
  s.wr = Math.max(0.18, s.wr - s.ar*DT);
  s.tr = norm(s.tr + s.wr*DT);
  for (const b of s.balls) if (!b.done) stepBall(s, b);
  // 収まった玉はロータに乗って一緒に回る。置き去りにすると、盤だけが下で回って
  // 別の区画に乗っているように見え、最後の玉が決まった瞬間に追いつくため跳ぶ。
  // 速度もロータのぶんを持たせる。位置だけ動かして速度を 0 にしておくと、
  // 玉どうしの当たりが「止まっている壁」として計算され、ロータと一緒に流れている
  // だけの転がり玉にも毎回はじき返しが入る。6 玉の 8.5% が永久に収まらなかった。
  for (const b of s.balls) if (b.done){
    b.p = restPositions([restOf(b)], s.tr)[0];
    const a = Math.atan2(b.p[1], b.p[0]);
    b.v = [-Math.sin(a)*s.wr*b.restR, Math.cos(a)*s.wr*b.restR, 0];
  }
  if (s.balls.length > 1) ballCollide(s);

  // 打ち切り。玉が多いと稀に押し合って何十秒も収まらないので、
  // 18 秒で残りをその場の区画に落とす。実測では 6 玉で 1000 回に数回。
  if (s.t > 18){
    for (const b of s.balls) if (!b.done){
      const r = Math.min(W.rRotor - 0.002,
                Math.max(W.rPocketIn + 0.002, Math.hypot(b.p[0], b.p[1])));
      const ph = Math.atan2(b.p[1], b.p[0]);
      b.p = [Math.cos(ph)*r, Math.sin(ph)*r, surfZ(r) + W.ball];
      b.v = [0,0,0];
      b.pocket = pocketAt(ph, s.tr); b.number = POCKETS[b.pocket].label;
      b.done = true; b.phase = "done"; s.forced = (s.forced||0) + 1;
      fixRest(s, b);
    }
  }

  if (s.balls.every(b => b.done)) s.phase = "done";
  else {
    // 表示用に、いちばん外にいる玉の段階を代表にする
    const order = {track:3, fall:2, scatter:1, done:0};
    let best = "scatter";
    for (const b of s.balls) if (!b.done && order[b.phase] > order[best]) best = b.phase;
    s.phase = best;
  }
}

/* ── 区画の位置は、ここだけで決める ──
   描画と物理がそれぞれ計算すると必ず食い違う。2D 版で実際にそれをやって
   9 区画ずれた。角度→区画 と 区画→角度 を 1 組にして両方から通す。 */
const ROTOR_PHASE = -Math.PI/2;                 // 区画 0 を真上に置く
/* SLOT と N は差し替えのたびに変わる。だから区画の位置は const に焼かず、
   毎回この 3 つを通して読む。焼くと、区画の数を変えた瞬間に
   「玉が乗っている区画」と「発表」がずれる。 */
const pocketStart  = i => i*SLOT + ROTOR_PHASE;
const pocketAt     = (a, tr) => ((Math.floor(norm(a - tr - ROTOR_PHASE)/SLOT) % N) + N) % N;
const pocketCentre = (i, tr) => norm(tr + ROTOR_PHASE + (i + 0.5)*SLOT);

/** 画面を使わずに 1 回転を最後まで解く。統計用。 */
function runSpin(tight, nBalls){
  const s = newSpin(launch(tight, nBalls));
  let g = 0;
  while (s.phase !== "done" && g++ < 1500*60) step(s);
  if (s.phase !== "done"){                    // 保険（実測では発生しない）
    for (const b of s.balls) if (!b.done){
      b.pocket = pocketAt(Math.atan2(b.p[1], b.p[0]), s.tr);
      b.number = POCKETS[b.pocket].label; b.done = true; b.phase = "done";
      fixRest(s, b);
    }
    s.phase = "done"; s.stuck = true;
  }
  return s;
}
/* ═══════════════════════════════════════════════════════════════════
   I. 描画 — 物理は 3 次元、絵は低解像度に落として色を絞ったドット
   仕組みは俯瞰版と同じ斜投影。違うのは仕上げの 2 手。
     ① 小さい裏画面に描いてから、補間なしで引き伸ばす（＝画素が四角く出る）
     ② 引き伸ばす前に、決めた色数に丸める（＝階調が段になる）
   数字だけは丸めた後に等倍で書く。ドットにすると読めないので。
   ═══════════════════════════════════════════════════════════════════ */
const cv = $("wheel"), cx = cv.getContext("2d");
let CXp = 0, CYp = 0, SCL = 1;

/** 視線の仰角。90°＝真上。固定。 */
const ELEV = 56 * Math.PI/180;
const SIN_E = Math.sin(ELEV), COS_E = Math.cos(ELEV);

/** 裏画面の横幅（ドットの数）。ここが粗さを決める */
/* 裏画面の横幅（＝盤のドット数）。ふだんは 168、拡大したときは 336 に切り替える。
   拡大を CSS の scale(2) だけでやると、168 ドットの絵が 2 倍に太るだけで
   情報量は増えない。裏画面ごと焼き直せば、拡大したぶんだけ実際に細かくなる。
   縮尺 SCL も枠も BW から出しているので、ここを変えるだけで全部ついてくる。 */
let DOTS_W = 168;

/* 裏画面。ここに描いてから引き伸ばす */
const bufCv = document.createElement("canvas"), bufCx = bufCv.getContext("2d", {willReadFrequently:true});
let BW = DOTS_W, BH = 280;

/** 世界座標 → 裏画面の座標。
    水平成分は canvas の向きに合わせる（+y が画面下）。反転させると区画の並びが
    左回りになり、回して貼るポケット帯と玉も逆向きに回ってずれる。 */
const px = (x, y, z) => [CXp + x*SCL, CYp + (y*SIN_E - z*COS_E)*SCL];
const ringOf = (r, z) => [CXp, CYp - z*COS_E*SCL, r*SCL, r*SCL*SIN_E];

/** 画面の高さは仰角から決める。傾けるほど縦は詰まり、高さのぶん上へ伸びる。
    手で詰めると ELEV を変えるたびに合わせ直しになるので、幾何から出す。 */
/** 盤の大きさ。戦闘画面では<b>裏画面をそのまま等倍で置く</b>。
    canvas を CSS で伸ばすと画素が割れるので、canvas の画素数＝仮想ドット数にする。
    拡大は画面ぜんぶと同じで整数倍だけ（拡大表示のときは ×2）。 */
function sizeWheel(){
  BW = DOTS_W;
  SCL  = (BW/2 - 2) / W.rBowl;
  CXp = BW/2;
  const zTop = Z_TRACK + 0.052, zBot = Z_TRACK + 0.040;
  const top    = -(zTop*COS_E*SCL) - (W.rBowl-0.020)*SCL*SIN_E;
  const bottom = -(zBot*COS_E*SCL) + W.rBowl*SCL*SIN_E;
  const pad = 3;
  BH  = Math.ceil(bottom - top) + pad*2;
  CYp = pad - top;
  cv.width = BW; cv.height = BH;
  cv.style.width = BW + "px"; cv.style.height = BH + "px";
  bufCv.width = BW; bufCv.height = BH;
  paintRotorFace();
}

/* ═══ 色。ゲーム本体とは別物として、この画面のためだけに選んだ 34 色 ═══
   丸め先をこの表に固定すると、階調が段になってドットらしく見える。 */
const PAL = [
  "#080c0a","#0f1512","#161d19","#1e2622",                  // 地
  "#2a1710","#3d2216","#55311c","#6d3f24","#8a5530",        // 木（暗→明）
  "#a86b3e","#c8874f","#dda06a","#efbe8b",
  "#171310","#22262c","#31363e","#434952","#585f69","#6f7681", // 鉢の底・円錐
  "#5e0f13","#8a1a20","#b8262c","#d94a4a",                  // 赤
  "#050506","#101013","#1c1c22",                            // 黒の区画
  "#0b3a24","#1a7048","#2fa066",                            // 緑
  "#6d5410","#a5851d","#c9a227","#e6c757","#f8ecb8",        // 真鍮
  "#6a707a","#98a0aa","#c6ccd4","#eef2f6",                  // 金具
  "#8e8674","#c3baa2","#f2ece0","#ffffff",                  // 象牙（玉）
];
const PAL_RGB = PAL.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
/** 32×32×32 の引き当て表。毎フレーム全画素で最近色を探すと重いので一度だけ作る */
const LUT = new Uint8Array(32*32*32);
(function(){
  for (let r=0;r<32;r++) for (let g=0;g<32;g++) for (let b=0;b<32;b++){
    const R=r*8+4, G=g*8+4, B=b*8+4;
    let best=0, bd=1e9;
    for (let i=0;i<PAL_RGB.length;i++){
      const p=PAL_RGB[i];
      // 人の目は緑に敏感なので重みを付ける
      const d=(R-p[0])*(R-p[0])*0.30 + (G-p[1])*(G-p[1])*0.59 + (B-p[2])*(B-p[2])*0.11;
      if (d<bd){bd=d;best=i;}
    }
    LUT[(r<<10)|(g<<5)|b] = best;
  }
})();

/** 裏画面の色を、決めた表の色に丸める */
function posterise(){
  const img = bufCx.getImageData(0,0,BW,BH), d = img.data;
  for (let i=0;i<d.length;i+=4){
    if (d[i+3] < 8) continue;
    const k = LUT[((d[i]>>3)<<10) | ((d[i+1]>>3)<<5) | (d[i+2]>>3)];
    const p = PAL_RGB[k];
    d[i]=p[0]; d[i+1]=p[1]; d[i+2]=p[2]; d[i+3]=255;
  }
  bufCx.putImageData(img,0,0);
}

/* ── ポケット帯。z=0 の水平面なので、真上から焼いて潰して回して貼る ──
   数字はここには入れない（丸めた後に等倍で書く） ── */
const faceCv = document.createElement("canvas"), faceCx = faceCv.getContext("2d");

function paintRotorFace(){
  const size = Math.max(8, Math.ceil(W.rRotor*SCL*2) + 4);
  faceCv.width = faceCv.height = size;
  const fs = (size/2 - 2) / W.rRotor, g = faceCx, C = size/2, m = v => v*fs;
  g.clearRect(0,0,size,size);
  for (let i=0;i<N;i++){
    const a0 = pocketStart(i), a1 = a0 + SLOT;
    g.beginPath();
    g.arc(C,C,m(W.rRotor),a0,a1);
    g.arc(C,C,m(W.rPocketIn),a1,a0,true);
    g.closePath();
    g.fillStyle = POCKETS[i].colour;
    g.fill();
  }
  for (let i=0;i<N;i++){
    const a = pocketStart(i);
    g.save(); g.translate(C,C); g.rotate(a);
    g.strokeStyle = "#c6ccd4"; g.lineWidth = Math.max(1.6, m(0.006));
    g.beginPath(); g.moveTo(m(W.rPocketIn-0.003),0); g.lineTo(m(W.rRotor),0); g.stroke();
    g.restore();
  }
  g.strokeStyle = "#050506"; g.lineWidth = Math.max(1, m(0.004));
  g.beginPath(); g.arc(C,C,m(W.rPocketIn),0,TAU); g.stroke();
}

function ell(g, r, z, fill, stroke, lw){
  const [ex, ey, rx, ry] = ringOf(r, z);
  g.beginPath(); g.ellipse(ex, ey, rx, ry, 0, 0, TAU);
  if (fill){ g.fillStyle = fill; g.fill(); }
  if (stroke){ g.strokeStyle = stroke; g.lineWidth = lw||1; g.stroke(); }
}

/** 高さ違いの輪を外から内へ。段差がそのままドットの階調になる */
/* 鉢の木は、ポケットの茶より 1 段暗くしてある。
   同じ明るさだと、無属性（茶）の区画が鉢に溶けて区画の切れ目が読めない。
   区画がいちばん明るい、という関係を崩さない。 */
const BOWL_RINGS = [
  [W.rBowl,       Z_TRACK+0.040, "#2a1710"],
  [W.rBowl-0.020, Z_TRACK+0.052, "#55311c"],
  [W.rWall+0.014, Z_TRACK+0.040, "#3d2216"],
  [W.rWall,       Z_TRACK+0.014, "#6d3f24"],
  [W.rRim,        Z_TRACK,       "#8a5530"],   // ボールトラック
  [W.rTrack,      Z_SLOPE,       "#2a1710"],   // すり鉢
  [W.rRotor,      0,             "#171310"],
];

function drawWheel(tr, balls, showBall){
  const g = bufCx;
  g.clearRect(0,0,BW,BH);
  g.fillStyle = "#0f1512"; g.fillRect(0,0,BW,BH);

  for (const [r,z,c] of BOWL_RINGS) ell(g, r, z, c);
  ell(g, W.rTrack, Z_SLOPE, null, "#2a1710", Math.max(1, 0.004*SCL));
  ell(g, W.rRim,   Z_TRACK, null, "#a86b3e", Math.max(1, 0.002*SCL));

  // ディフレクタ 8 個
  for (let k=0;k<W.nDefl;k++){
    const a = k*TAU/W.nDefl;
    const [dx,dy] = px(Math.cos(a)*W.rDefl, Math.sin(a)*W.rDefl, surfZ(W.rDefl)+W.hDefl);
    const long = (k%2 ? 0.030 : 0.021)*SCL, wide = (k%2 ? 0.012 : 0.016)*SCL;
    g.save(); g.translate(dx, dy); g.scale(1, SIN_E); g.rotate(a + (k%2 ? 0 : Math.PI/2));
    g.fillStyle = "#c6ccd4";
    g.beginPath(); g.moveTo(-long,0); g.lineTo(0,-wide);
    g.lineTo(long,0); g.lineTo(0,wide); g.closePath(); g.fill();
    g.fillStyle = "#6a707a";
    g.beginPath(); g.moveTo(0,0); g.lineTo(0,wide); g.lineTo(long,0); g.closePath(); g.fill();
    g.restore();
  }

  // ポケット帯
  const [fx, fy] = px(0,0,0);
  g.save(); g.translate(fx, fy); g.scale(1, SIN_E); g.rotate(tr);
  g.drawImage(faceCv, -faceCv.width/2, -faceCv.height/2);
  g.restore();

  // 円錐とタレット
  // 円錐。同心に塗ると的に見えるので、内側の輪ほど左上へずらして光の向きを出す
  const CN = 5;
  const CONE = ["#585f69","#434952","#31363e","#22262c","#171310"];
  for (let i=1;i<=CN;i++){
    const t = i/CN;
    const r = W.rPocketIn + (W.rTurret - W.rPocketIn)*t;
    const [ex,ey,rx,ry] = ringOf(r, (W.rPocketIn - r)*TAN_C);
    const off = t * 0.055 * W.rPocketIn * SCL;
    g.beginPath(); g.ellipse(ex - off*0.7, ey - off, rx, ry, 0, 0, TAU);
    g.fillStyle = CONE[CN-i]; g.fill();
  }
  {
    const zt = (W.rPocketIn - W.rTurret)*TAN_C;
    const [tx,ty,trx,try_] = ringOf(W.rTurret, zt);
    const o = 0.055 * W.rPocketIn * SCL;
    const dot = (rf, dx, dy, col) => {
      g.beginPath(); g.ellipse(tx - o*0.7 + dx, ty - o + dy, trx*rf, try_*rf, 0, 0, TAU);
      g.fillStyle = col; g.fill();
    };
    dot(1,    0, 0, "#a5851d");
    dot(0.68, -trx*0.10, -try_*0.14, "#c9a227");
    dot(0.34, -trx*0.16, -try_*0.22, "#e6c757");
  }

  // 玉と影。影を全部先に敷いてから玉を置く（玉が影に隠れないように）
  if (showBall && balls && balls.length){
    for (const ball of balls){
      const r = Math.hypot(ball[0], ball[1]);
      const zs = surfZ(Math.min(r, W.rWall));
      const [sx, sy] = px(ball[0], ball[1], zs + 0.0005);
      const hgt = Math.max(0, ball[2] - zs - W.ball);
      const soft = 1 + hgt*14;
      g.fillStyle = "#080c0a";
      g.beginPath();
      g.ellipse(sx, sy, W.ball*SCL*soft, Math.max(0.6, W.ball*SCL*SIN_E*soft), 0, 0, TAU);
      g.fill();
    }
    // 画面の上（＝奥）にある玉から順に置くと、手前の玉が上に重なる
    const order = balls.map((b,i)=>[i, px(b[0],b[1],b[2])[1]]).sort((a,c)=>a[1]-c[1]);
    for (const [i] of order){
      const ball = balls[i];
      const [bx, by] = px(ball[0], ball[1], ball[2]);
      const R = Math.max(1.6, W.ball*SCL);
      g.fillStyle = "#c3baa2";
      g.beginPath(); g.arc(bx,by,R,0,TAU); g.fill();
      g.fillStyle = "#f2ece0";
      g.beginPath(); g.arc(bx - R*0.25, by - R*0.25, R*0.62, 0, TAU); g.fill();
    }
  }

  // ── 色を丸めてから、補間なしで引き伸ばす ──
  posterise();
  cx.imageSmoothingEnabled = false;
  cx.clearRect(0,0,BW,BH);
  cx.drawImage(bufCv, 0, 0);
}

/** 下地の明るさで、文字を白と黒のどちらにするか決める。
    金色や薄い灰色の区画に白で書くと読めない。 */
function textOn(hex){
  const r = parseInt(hex.slice(1,3),16), g2 = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return (0.30*r + 0.59*g2 + 0.11*b) > 140 ? "#0b0f0d" : "#f2ece0";
}

/* ═══════════════════════════════════════════════════════════════════
   D. 中身。札と、盤の区画の割り当て

   杖（引いた順が呪文になる）の要素は無い。札は 1 枚ずつ独立して効く。
   区画に札を何個置くかが、そのまま出る確率になる（区画の数で重みを付ける）。

   ── 区画の色は「属性」で決める ──────────────────────────────
   盤は 168 ドットしかないので、区画に字は入らない。色だけが手がかりになる。
   だから色は 1 枚ずつ勝手に選ばず、<b>属性ごとの色の帯</b>から取る。
     無属性（ただの武器） … 茶。同じ属性の中で明るさを変えて見分ける
     火                   … 赤〜橙
     氷                   … 青灰
     毒                   … 緑
   こうしておけば、札が増えても「赤が出た＝火の何か」がすぐ読める。
   色は盤の色表（PAL）に入っている値だけを使う。表に無い色は丸められて、
   選んだ色と出ている色が食い違う。
   ═══════════════════════════════════════════════════════════════════ */
const ELEM = {
  /* 茶は明るさの差がいちばん大きくなる順に並べる。
     隣どうしの段（#dda06a と #c8874f）を続けて配ると、盤の上で見分けられない。 */
  norm: {nm:"無", cols:["#efbe8b","#a86b3e","#c8874f","#8a5530","#dda06a","#6d3f24"]},
  fire: {nm:"火", cols:["#d94a4a","#b8262c","#8a1a20"]},
  ice:  {nm:"氷", cols:["#c6ccd4","#98a0aa","#6a707a"]},
  poi:  {nm:"毒", cols:["#2fa066","#1a7048","#0b3a24"]},
};

const DECK = [
  {id:"sword",  el:"norm", nm:"錆びたボロ剣",   fx:"最前の敵に5ダメージ",
   n:5, img:CARD_IMG.sword,  act:{tgt:"front", dmg:5}},
  {id:"kunai",  el:"norm", nm:"錆びたクナイ",   fx:"全ての敵に3ダメージ",
   n:4, img:CARD_IMG.kunai,  act:{tgt:"all",   dmg:3}},
  {id:"hammer", el:"norm", nm:"錆びたハンマー", fx:"最前の敵のシールドを破る<br>最前の敵に8ダメージ",
   n:3, img:CARD_IMG.hammer, act:{tgt:"front", dmg:8, brk:true}},
];
/* 同じ属性の中で、上から順に色の帯を配る。札を足すときは el を書くだけでよい */
(function(){
  const seen = {};
  DECK.forEach(c => {
    const e = ELEM[c.el] || ELEM.norm;
    const k = seen[c.el] = (seen[c.el] === undefined ? 0 : seen[c.el] + 1);
    c.col = e.cols[k % e.cols.length];
  });
})();

/** 区画の並び。同じ札を固めると、機械投擲（初期条件が近い）では
    隣どうしに固まって出る。残りがいちばん多い種類から、直前と違うものを置く。 */
function layout(counts){
  const left = counts.slice(), out = [];
  while (left.some(v => v > 0)){
    let pick = -1;
    for (let i=0;i<left.length;i++){
      if (left[i] <= 0) continue;
      if (i === out[out.length-1] && left.filter(v=>v>0).length > 1) continue;
      if (pick < 0 || left[i] > left[pick]) pick = i;
    }
    out.push(pick); left[pick]--;
  }
  return out;
}

const FOE_KINDS = {

/** 盾から先に削る。盾を割る札は盾を 0 にしてから当てる */
function hit(t, n, brk){
  if (brk) t.shield = 0;
  const a = Math.min(t.shield, n);
  t.shield -= a; t.hp = Math.max(0, t.hp - (n - a));
}

/* ── 手札 ────────────────────────────────────────────────────
   扇に「傾けて」持つのはやめた。傾けると札に載せる名前と効果まで傾く。
   文字を絵に焼き込むと 8 ドットに潰れて読めないので、文字は札の上に
   HTML で重ねている。重ねる以上、札は立てておくしかない。
   代わりに、真ん中を少し持ち上げた弧で「持っている」形にする。 */
const CW = 110, CH = 154;
const HAND_X = 436, HAND_STEP = 130, HAND_Y = 344, HAND_LIFT = 6;

function handCard(x, y, c){
  let h = "";
  h += shadowOf(x, y, CW, CH, 3);
  h += box(x, y, CW, CH, "overflow:hidden",
    `<img src="${c.img}" width="${CW}" height="${CH}" alt="${c.nm}">`);
  /* 名前。台紙の帯にぴったり載せる（帯は絵のほうに描いてある） */
  h += box(x+6, y+11, 96, 10, "display:flex;align-items:center;justify-content:center",
    `<span class="t" style="color:#2a2118">${c.nm}</span>`);
  /* 効果。帯の幅で折り返す */
  h += box(x+11, y+109, 88, 34, "display:flex;align-items:center;justify-content:center;text-align:center",
    `<span class="t" style="color:#2a2118;line-height:10px">${c.fx}</span>`);
  return h;
}

function hand(list){
  const n = list.length;
  if (!n) return "";
  let h = "";
  const x0 = HAND_X - ((n-1)*HAND_STEP)/2 - CW/2;
  list.forEach((ci,i)=>{
    const k = i - (n-1)/2;
    const lift = Math.round(HAND_LIFT * (1 - Math.abs(k)/Math.max(1,(n-1)/2 || 1)));
    h += handCard(Math.round(x0 + i*HAND_STEP), HAND_Y - CH - lift, DECK[ci]);
  });
  return h;
}

/* ── 壁の松明 ────────────────────────────────────────────────
   盤を小さくして世界が広がったぶん、壁が空いた。
   ただ模様を足すのではなく、<b>光源そのもの</b>を置く。
   画面じゅうの凹凸を「左上から」の光で作っているので、
   その光がどこから来ているのかが絵の中にあったほうがよい。 */
function torch(x, y){
  let h = "";
  /* 光の粒（ディザの丸い光）は入れない。
     暗い壁の上だと、黄色い点がただの汚れに見えてしまう。 */
  /* 壁に留める板 → 腕木 → 受け皿。面の作り方は筐体と同じ（光は左上） */
  h += plate(x-4, y+14, 16, 12, {fill:C("steel",2), hi:C("steel",4), lo:C("steel",0)});
  h += plate(x+1, y+6,  6, 10, {fill:C("steel",1), hi:C("steel",3), lo:C("steel",0)});
  h += plate(x-6, y-2, 20, 9,  {fill:C("brass",2), hi:C("brass",4), lo:C("brass",0)});
  /* 炎。外は赤、中は真鍮、芯は白。外から順に重ねる。
     左右対称に積むと三角のコーンに見えるので、上へいくほど右に寄せる */
  [[x-4,y-11,15,10,C("red",3)],[x-2,y-18,12,9,C("red",3)],[x+1,y-24,6,8,C("red",2)],
   [x-2,y-10,11,8,C("brass",4)],[x,y-16,8,7,C("brass",4)],[x+2,y-21,4,6,C("brass",3)],
   [x,y-9,7,6,C("bone",4)]].forEach(([bx,by,bw,bh,c])=> h += box(bx,by,bw,bh,`background:${c}`));
  return h;
}

/* ── レバー。丸ボタンではなく、床に立って機械につながる物にする ──
   実行の操作を世界の中の物にすると、UI が世界から浮かない。
   len を外から渡せるようにした（下段の高さが場所によって違うため）。 */
function lever(x, top, len){
  len = len || 80;
  const sw = 11;
  let h = `<div class="throwhit" style="position:absolute;left:${x-12}px;top:${top-16}px;
    width:52px;height:${len+68}px;cursor:pointer;z-index:6"></div>`;
  /* 受け金具。ここから生えていることを見せる */
  h += shadowOf(x, top-14, 28, 24, 3);
  h += plate(x, top-14, 28, 24, {fill:C("steel",2), hi:C("steel",4), lo:C("steel",0)});
  h += plate(x+3, top-11, 22, 18, {fill:C("steel",1), hi:C("steel",0), lo:C("steel",3), sunk:true});
  [[x+5,top-9],[x+19,top-9],[x+5,top+1],[x+19,top+1]].forEach(([bx,by])=>
    h += plate(bx,by,3,3,{fill:C("brass",2), hi:C("brass",4), lo:C("brass",0)}));
  /* 軸。面の作り方は他と同じ（左が明るく右が暗い） */
  h += box(x+8, top, sw, len, `background:${C("steel",2)}`);
  h += box(x+8, top, 2, len, `background:${C("steel",4)}`);
  h += box(x+17, top, 2, len, `background:${C("steel",0)}`);
  for (let i=1; i*18 < len-6; i++)                        // 段。長い棒が板に見えないように
    h += box(x+7, top+i*18, 13, 2, `background:${C("steel",0)}`);
  /* 握り。丸は自動陰影がいちばん効く */
  h += box(x+2, top+len-6, 24, 24, "", sprite("knob"));
  /* 引く向き */
  for (let i=0;i<5;i++)
    h += box(x+11, top+len+21+i, 7-Math.floor(i*1.4), 1, `background:${C("brass",2)};opacity:.75`);
  /* 銘板。操作の名前は握りのすぐ下。床に離して置くと何の名前か分からない */
  h += shadowOf(x-9, top+len+29, 46, 18, 3);
  h += plate(x-9, top+len+29, 46, 18, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});
  h += box(x-9, top+len+29, 46, 18, `display:flex;align-items:center;justify-content:center`,
    `<span class="t sh" style="color:${C("brass",4)}">投げる</span>`);
  return h;
}

/* ── 玉の数。選ばせない。いまは 1 個で、強化で増える想定 ── */
function ballCount(x, y){
  let h = "";
  h += plate(x, y, 104, 24, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});
  h += box(x+8, y+7, 30, 10, "", `<span class="lbl" style="color:${C("steel",5)}">玉</span>`);
  for (let i=0;i<GS.balls;i++)
    h += box(x+34+i*11, y+8, 8, 8, "", sprite("orb"));
  return h;
}

/* ── いま何階か。筐体に彫った札 ── */
function depth(x, y){
  let h = "";
  h += plate(x, y, 108, 20, {fill:C("wood",1), hi:C("wood",3), lo:C("wood",0)});
  h += box(x+7, y+5, 46, 10, "", `<span class="lbl" style="color:${C("bone",2)}">地下</span>`);
  h += box(x+46, y+5, 54, 10, `display:flex;justify-content:flex-end`,
    `<span class="t" style="color:${C("bone",3)}">${GS.self.floor} / ${GS.self.floors}</span>`);
  return h;
}

/* ── 右上。所持金と持ち物だけ。小さく、壁に留めた札のように ──
   上段が 100 ドットしかないので、前より 8 ドット薄くした。
   これ以上厚くすると、いちばん右の敵の「次の一手」とぶつかる。 */
function topRight(){
  const w = 118, x = VW - w - 8, y = 20;
  let h = "";
  h += shadowOf(x, y, w, 18, 2);
  h += plate(x, y, w, 18, {fill:C("wood",1), hi:C("wood",3), lo:C("wood",0)});
  h += box(x+6, y+4, 10, 10, "", glyph("coin", 10));
  h += box(x+18, y+4, 44, 10, `display:flex;justify-content:flex-end`,
    `<span class="t" style="color:${C("brass",4)}">${GS.self.coin}</span>`);
  h += box(x+68, y+2, 1, 14, `background:${C("wood",0)}`);
  /* 持ち物 */
  h += plate(x+74, y+2, 40, 14, {fill:C("wood",2), hi:C("wood",4), lo:C("wood",0)});
  h += box(x+74, y+2, 40, 14,
    `display:flex;align-items:center;justify-content:center;cursor:pointer`,
    `<span class="t" style="color:${C("bone",3)}">持ち物</span>`, "hit open");
  return h;
}

/* ── 役者。足元の線をそろえ、床に硬い接地影を落とす ──
   上段が薄いので、HP の帯を足元から dy だけ下に置けるようにした。 */
function actor(sp, x, foot, d, front, dy){
  dy = dy === undefined ? 9 : dy;
  /* 大きさは必ず spriteW / spriteH から取る。SHAPES の w/h は倍率を掛ける前の値で、
     絵は倍率を掛けた大きさで描かれる。ここを別々に計算すると足元がずれる。
     （描画と配置に位置を別々に計算させない。同じ間違いを何度もしている） */
  const sw = spriteW(sp), sh = spriteH(sp);
  let h = "";
  h += box(x+2, foot-3, sw-2, 5, `background:${INK};opacity:.55`);   // 接地影
  h += box(x, foot-sh, sw, sh, "", sprite(sp));
  const bw = Math.max(sw+6, 50);
  const bx = x + (sw-bw)/2|0;
  /* HP。記号＋数字＋色の 3 つで出す。数字だけにしない */
  h += plate(bx, foot+dy, bw, 9, {fill:C("red",0), hi:C("steel",2), lo:C("steel",0), sunk:true});
  h += box(bx+1, foot+dy+1, Math.round((bw-2)*d.hp/d.max), 7, `background:${C("red",3)}`);
  h += box(bx+1, foot+dy+1, Math.round((bw-2)*d.hp/d.max), 1, `background:${C("red",4)}`);
  h += box(bx, foot+dy, bw, 9, `display:flex;align-items:center;justify-content:center`,
    `<span class="t sh" style="color:${C("bone",4)}">${d.hp}/${d.max}</span>`);
  if (d.shield > 0){
    h += plate(bx-11, foot+dy, 11, 9, {fill:C("blue",2), hi:C("blue",4), lo:C("blue",0)});
    h += box(bx-11, foot+dy, 11, 9, `display:flex;align-items:center;justify-content:center`,
      `<span class="t sh" style="color:${C("bone",4)}">${d.shield}</span>`);
  }
  /* 次の一手。敵だけ、頭の上に */
  if (d.act){
    const aw = d.act.length*22 - 4;
    let ax = x + (sw-aw)/2|0, ay = foot - sh - 15;
    d.act.forEach(([k,n])=>{
      h += box(ax, ay, 10, 10, "", glyph(k,10));
      h += box(ax+11, ay+1, 10, 9, "", `<span class="t sh" style="color:${C("bone",4)}">${n}</span>`);
      ax += 22;
    });
  }
  /* 前の敵に印。いま殴られるのはここ、が一目で分かるように */
  if (front){
    const mx = x + (sw/2|0) - 3;
    for (let i=0;i<4;i++)
      h += box(mx-3+i, foot-sh-24+i, 7-i*2, 1, `background:${C("brass",3)}`);
  }
  return h;
}


/* ── 持ち物。いまはテスト用の組み替え画面 ─────────────────────
   デッキ（どの札を盤に何区画置くか）と玉の数を、その場で変えられる。
   区画の数がそのまま確率なので、ここを触ると盤の色分けも即座に変わる。
   本番では買い物・報酬でしか変えられなくなる予定。 */
function invPanel(){
  if (!GS.inv) return "";
  /* 高さは札の数から出す。札が増えても余白が空いたままにならない */
  const W2 = 552, H2 = 160 + DECK.length*30;
  const X = Math.round((VW - W2)/2), Y = Math.round((VH - H2)/2);
  let h = "";
  h += box(0, 0, VW, VH, `background:${INK};opacity:.72`, "", "hit close");
  h += shadowOf(X, Y, W2, H2, 4);
  h += plate(X, Y, W2, H2, {fill:C("wood",2), hi:C("wood",4), lo:C("wood",0)});
  h += plate(X+4, Y+4, W2-8, H2-8, {fill:C("wood",1), hi:C("wood",0), lo:C("wood",3), sunk:true,
    dither:ditherCSS(C("wood",1), C("wood",0), 3)});
  h += box(X+14, Y+12, 300, 12, "", `<span class="t" style="color:${C("brass",4)}">持ち物（テスト用）</span>`);
  h += box(X+14, Y+26, 400, 10, "",
    `<span class="lbl">区画の数がそのまま出る確率になる</span>`);
  h += plate(X+W2-46, Y+10, 34, 16, {fill:C("wood",3), hi:C("brass",3), lo:C("wood",0)});
  h += box(X+W2-46, Y+10, 34, 16,
    `display:flex;align-items:center;justify-content:center;cursor:pointer`,
    `<span class="t" style="color:${C("bone",4)}">閉じる</span>`, "hit close");
  h += box(X+12, Y+42, W2-24, 1, `background:${C("wood",0)}`);

  /* 見出し */
  const cx0 = X+16;
  h += box(cx0+34, Y+48, 200, 10, "", `<span class="lbl">札</span>`);
  h += box(cx0+250, Y+48, 60, 10, "", `<span class="lbl">属性</span>`);
  h += box(cx0+310, Y+48, 60, 10, `display:flex;justify-content:flex-end`,
    `<span class="lbl">区画</span>`);
  h += box(cx0+400, Y+48, 90, 10, `display:flex;justify-content:flex-end`,
    `<span class="lbl">出る確率</span>`);

  const tot = Math.max(1, deckTotal());
  DECK.forEach((c,i)=>{
    const ry = Y+64 + i*30;
    h += box(cx0, ry, W2-32, 26, `background:${C("wood",2)};opacity:${i%2?0.5:0.25}`);
    /* 属性の色見本。盤に出る色そのもの */
    h += plate(cx0+6, ry+6, 20, 14, {fill:c.col, hi:c.col, lo:C("wood",0)});
    h += box(cx0+34, ry+8, 210, 10, "", `<span class="t" style="color:${C("bone",4)}">${c.nm}</span>`);
    h += box(cx0+250, ry+8, 60, 10, "",
      `<span class="t" style="color:${C("bone",2)}">${(ELEM[c.el]||ELEM.norm).nm}</span>`);
    /* − 区画 ＋ */
    h += stepper(cx0+306, ry+5, GS.deck[i], "d"+i);
    const pct = GS.deck[i] * 100 / tot;
    h += box(cx0+400, ry+8, 90, 10, `display:flex;justify-content:flex-end`,
      `<span class="t" style="color:${GS.deck[i] ? C("brass",4) : C("steel",3)}">${pct.toFixed(1)} %</span>`);
  });

  const ry = Y+64 + DECK.length*30 + 12;
  h += box(cx0, ry, W2-32, 1, `background:${C("wood",0)}`);
  h += box(cx0+34, ry+14, 200, 10, "", `<span class="t" style="color:${C("bone",4)}">区画の合計</span>`);
  const bad = deckTotal() < MIN_N || deckTotal() > MAX_N;
  h += box(cx0+306, ry+14, 84, 10, "",
    `<span class="t" style="color:${bad ? C("red",4) : C("bone",3)}">${deckTotal()} / ${MAX_N}</span>`);

  h += box(cx0+34, ry+38, 200, 10, "", `<span class="t" style="color:${C("bone",4)}">一度に投げる玉</span>`);
  h += stepper(cx0+306, ry+35, GS.balls, "b");
  h += box(cx0+400, ry+38, 90, 10, `display:flex;justify-content:flex-end`,
    `<span class="lbl">最大 ${MAX_BALLS}</span>`);
  h += box(cx0+34, ry+56, 460, 10, "",
    `<span class="lbl">玉は本来 1 個から始まって強化で増える。ここはテスト用</span>`);
  return h;
}

/** − 値 ＋ の 3 つ組。id は押されたときに何を動かすかの目印 */
function stepper(x, y, v, id){
  let h = "";
  const btn = (bx, t, cls) => {
    let g = plate(bx, y, 16, 16, {fill:C("wood",3), hi:C("wood",4), lo:C("wood",0)});
    g += box(bx, y, 16, 16,
      `display:flex;align-items:center;justify-content:center;cursor:pointer`,
      `<span class="t" style="color:${C("bone",4)}">${t}</span>`, "hit " + cls);
    return g;
  };
  h += btn(x, "−", "dec " + id);
  h += box(x+18, y+3, 30, 10, `display:flex;justify-content:center`,
    `<span class="t" style="color:${C("bone",4)}">${v}</span>`);
  h += btn(x+50, "＋", "inc " + id);
  return h;
}

/* ═══════════════════════════════════════════════════════════════════
   E. 画面の部品
   ═══════════════════════════════════════════════════════════════════ */
const box = (x,y,w,h,style,inner,cls) =>
  `<div class="${cls||""}" style="position:absolute;left:${x}px;top:${y}px;
    width:${w}px;height:${h}px;${style||""}">${inner||""}</div>`;

/** 面。光は必ず左上から。上と左が 1 ドット明るく、下と右が 1 ドット暗い。
    へこませたい時は sunk で反転する。全部の凹凸をこの向きにそろえる。 */
function plate(x,y,w,h,o){
  o = o || {};
  const f = o.fill || C("wood",2);
  const hi = o.hi || C("wood",4), lo = o.lo || C("wood",0);
  const a = o.sunk ? lo : hi, b = o.sunk ? hi : lo;
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;
    background:${f};${o.dither||""};${o.z?`z-index:${o.z};`:""}">
    <div style="position:absolute;left:0;top:0;right:1px;height:1px;background:${a}"></div>
    <div style="position:absolute;left:0;top:0;bottom:1px;width:1px;background:${a}"></div>
    <div style="position:absolute;left:1px;right:0;bottom:0;height:1px;background:${b}"></div>
    <div style="position:absolute;top:1px;right:0;bottom:0;width:1px;background:${b}"></div>
    ${o.inner ? `<div style="position:absolute;inset:1px">${o.inner}</div>` : ""}
  </div>`;
}
/** 斜めの線は階段で刻む。回転させるとアンチエイリアスでにじむ */
function stair(x, y, len, dx, thick, col, alpha){
  let h = "";
  for (let i=0;i<len;i++)
    h += `<div style="position:absolute;left:${Math.round(x + i*dx)}px;top:${y+i}px;
      width:${thick}px;height:1px;background:${col};${alpha?`opacity:${alpha};`:""}"></div>`;
  return h;
}
/** 硬い落ち影。ぼかさない。右下へ 3 ドット */
const shadowOf = (x,y,w,h,d) =>
  box(x+(d||3), y+(d||3), w, h, `background:${INK}`);

/* ═══════════════════════════════════════════════════════════════════
   F. 画面を組む —— 案F「手札」

   上段（0..168）＝ 世界。天井・石の壁・松明・木の床。自分と敵が 1 本の線に立つ
   下段（168..360）＝ 筐体。左に盤の窓、右に手札と操作

   下段は「机の上に盤を置いた」ではなく、画面の下半分そのものが筐体の面。
   材質を段ごとに変える。世界＝石と木、筐体＝鉄と真鍮。

   組み方は 3 層に分ける。
     #bg   … 動かないもの（壁・床・筐体・盤の枠）。1 回だけ組む
     #whl  … 盤の canvas。ここだけは組み直さない（組み直すと絵が消える）
     #fg   … 変わるもの（人物・手札・操作・HUD）。手番ごとに組み直す
   ぜんぶ 1 つの文字列で組み直すと、canvas が毎回作り直されて盤が消える。
   ═══════════════════════════════════════════════════════════════════ */
const VW = 640, VH = 360;
const BAND  = 168;          // 上段（世界）と下段（筐体）の境
const WALLH = 96;           // 壁と床の境
const FOOT  = 138;          // 自分も敵も、この線に立つ。手前に床を残す
const GX = 6, GY = 180;     // 盤の窓の左上（大きさは BW × BH ＝ 焼いた裏画面のまま）

function sceneStatic(){
  let h = "";

  /* ══ 上段：世界 ════════════════════════════════════════════════ */

  /* 壁。上ほど明るく、下ほど暗い。段はディザで作る（にじませない） */
  h += box(0,0,VW,WALLH, `background:${C("stone",1)}`);
  [[0,28,4],[28,52,3],[52,76,2],[76,WALLH,1]].forEach(([y0,y1,lv])=>{
    h += box(0,y0,VW,y1-y0, `background:${C("stone",1)};${ditherCSS(C("stone",1),C("stone",2),lv)}`);
  });
  /* 石積み。目地は 1 ドット。奥（上）ほどコントラストを落とす */
  for (let y=2;y<WALLH-6;y+=13){
    const row = Math.round((y-2)/13), near = y > 48;
    for (let x=-16;x<VW;x+=28){
      h += box(x + (row%2 ? 14 : 0), y, 26, 11, `background:${C("stone",near?2:1)};
        border-right:1px solid ${C("stone",0)};border-bottom:1px solid ${C("stone",0)};
        opacity:${near?1:.7}`, "", "bleed");
    }
  }
  /* 天井。上を切っておかないと壁が上へ抜けて、部屋に見えない */
  h += box(0, 0, VW, 12, `background:${C("stone",0)}`);
  h += box(0, 12, VW, 1, `background:${C("stone",3)}`);
  h += box(0, 13, VW, 2, `background:${INK}`);
  for (let x=-8;x<VW;x+=96)
    h += box(x, 0, 14, 13, `background:${C("wood",1)};border-right:1px solid ${INK}`, "", "bleed");

  /* 壁の見切り */
  h += box(0, 64, VW, 3, `background:${C("stone",3)}`);
  h += box(0, 67, VW, 2, `background:${C("stone",0)}`);

  /* 床。壁と material を変える（木）。境に硬い明線を引くと、人物が
     「棚に乗っている」ように見えるので、暗い線 1 本＋ディザで受ける */
  h += box(0,WALLH,VW,BAND-WALLH, `background:${C("wood",1)}`);
  h += box(0,WALLH-1,VW,1, `background:${INK}`);
  h += box(0,WALLH,VW,6, ditherCSS(C("wood",0), C("wood",1), 6));
  h += box(0,WALLH+6,VW,12, ditherCSS(C("wood",1), C("wood",0), 3));
  h += box(0,WALLH+18,VW,14, ditherCSS(C("wood",1), C("wood",2), 2));
  h += box(0,WALLH+32,VW,BAND-WALLH-32, ditherCSS(C("wood",1), C("wood",2), 2));
  for (let x=-20;x<VW;x+=74)
    h += box(x, WALLH+1, 1, BAND-WALLH-1, `background:${C("wood",0)};opacity:.5`, "", "bleed");
  h += box(0, WALLH+22, VW, 1, `background:${C("wood",0)};opacity:.6`);

  /* 松明。光がどこから来ているのかを絵の中に置く。左上からの光にそろえて左に寄せる */
  h += torch(108, 34);
  h += torch(238, 34);

  /* 筐体の明かりが、床と壁の下のほうを照らす */
  h += box(0, WALLH, VW, BAND-WALLH, ditherCSS("transparent", C("brass",1), 1));
  h += box(0, 56, VW, WALLH-56,      ditherCSS("transparent", C("brass",1), 1));

  /* ══ 下段：筐体の面 ════════════════════════════════════════════ */
  h += box(0, BAND-4, VW, 4, `background:${INK};opacity:.45`);   // 床に落ちる硬い影
  h += box(0, BAND, VW, VH-BAND, `background:${C("steel",2)}`);
  h += box(0, BAND, VW, VH-BAND, ditherCSS(C("steel",2), C("steel",1), 3));
  h += box(0, BAND,   VW, 2, `background:${C("brass",3)}`);
  h += box(0, BAND+2, VW, 1, `background:${C("brass",1)}`);
  h += box(0, BAND+3, VW, 3, `background:${C("steel",4)}`);
  h += box(0, BAND+6, VW, 1, `background:${C("steel",0)}`);
  /* 鋲は盤側だけ。右側は実況の行が通るので空けておく */
  for (let x=10;x<226;x+=32)
    h += plate(x, BAND+9, 3, 3, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});
  h += box(0, VH-40, VW, 40, ditherCSS("transparent", C("steel",3), 2));

  return h;
}

/* ── 盤の窓。枠は canvas と同じ入れ物に入れる。
      別々に置くと、拡大したときに枠だけ元の大きさで残る。 ── */
function wheelFrame(){
  let h = "";
  h += plate(0, 0, BW+8, BH+8, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});
  h += plate(3, 3, BW+2, BH+2, {fill:INK, hi:C("steel",0), lo:C("steel",4), sunk:true});
  [[1,1],[BW+3,1],[1,BH+3],[BW+3,BH+3]].forEach(([bx,by])=>
    h += plate(bx,by,4,4,{fill:C("brass",2), hi:C("brass",4), lo:C("brass",0)}));
  return h;
}

/* ── 手番ごとに組み直すほう ── */
function sceneLive(){
  let h = "";
  /* 役者 */
  h += actor("hero", 24, FOOT, GS.self, false, 6);
  const fx = [296, 384, 468];
  GS.foes.forEach((f,i)=>{
    if (f.hp <= 0) return;
    h += actor(f.sp, fx[i], FOOT, f, f === frontFoe(), 6);
  });
  h += topRight();
  h += depth(VW - 116, 42);

  /* 操作 */
  h += ballCount(GX, GY + BH + 6);
  h += lever(192, 200, 56);

  /* 手札。拡大している間は出さない（盤の下に結果を出したいので場所を空ける） */
  const big = GS.phase === "spin" || GS.phase === "deal";
  h += hand(big ? [] : GS.hand);

  /* 実況。何が起きたかを 1 行で出す */
  h += invPanel();
  if (GS.msg && !GS.inv)
    h += box(20, big ? 338 : 172, 600, 11,
      `display:flex;align-items:center;justify-content:${big ? "center" : "flex-start"};
       padding-left:${big ? 0 : 214}px`,
      `<span class="t sh" style="color:${C("brass",4)}">${GS.msg}</span>`);
  return h;
}

/* ═══════════════════════════════════════════════════════════════════
   GS. 進行。投げる → 盤が真ん中に大きくなる → 収まる → 札が手札に来る
      → 札が順に効く → 敵が動く → 次の手番
   ═══════════════════════════════════════════════════════════════════ */
let spin = null;                       // 進行中の spin
const rotor = {t:0, w:0.55};           // 盤は席を立つまで回り続ける
let resting = null;                    // 収まった玉の置き場所（ロータ固定座標）

/** 盤の描画まわりを組み直す。setPockets から呼ばれる */
function rebuild(){ resting = null; paintRotorFace(); }

/* ── 拡大。回した瞬間に真ん中で 2 倍にする ──────────────────────
   倍率は整数だけ。1.5 倍などにすると画素が 2px と 3px に割れる。

   ただの scale(2) だと 168 ドットの絵が太くなるだけで、細かさは増えない。
   そこで<b>寄せ切ったあとに裏画面ごと 336 ドットで焼き直す</b>。
   物理はメートルで解いているので、絵の解像度を変えても出目は変わらない。

   動きは低解像度のまま scale(2) で見せて、止まってから高解像度に差し替える。
   （拡大しながら焼き直すと、動いている最中に絵が飛ぶ） */
const DOTS_SMALL = 168, DOTS_BIG = 336;
let bigWheel = false;

function setDots(w){
  if (DOTS_W === w) return;
  DOTS_W = w;
  sizeWheel();                                   // BW / BH / SCL が決まり直す
  const el = $("whl");
  el.style.width  = (BW+8) + "px";
  el.style.height = (BH+8) + "px";
  $("frm").innerHTML = wheelFrame();
}
const zoomedXY = () => [Math.round((VW - (BW+8))/2), Math.round((VH - (BH+8))/2)];

async function zoom(on){
  const el = $("whl");
  if (on){
    const dx = Math.round((VW - (BW+8)*2)/2) - (GX-4);
    const dy = Math.round((VH - (BH+8)*2)/2) - (GY-4);
    el.style.transform = `translate(${dx}px,${dy}px) scale(2)`;
    el.style.zIndex = 8;
    $("dim").style.opacity = .82;
    await wait(170);
    setDots(DOTS_BIG); bigWheel = true;
    const [zx, zy] = zoomedXY();
    el.style.transition = "none";
    el.style.transform = "";
    el.style.left = zx + "px"; el.style.top = zy + "px";
    el.offsetHeight; el.style.transition = "";
  } else {
    /* 低解像度に戻し、いまと同じ見た目になる transform を当ててから外す */
    const [zx, zy] = zoomedXY();
    setDots(DOTS_SMALL); bigWheel = false;
    const dx = Math.round((VW - (BW+8)*2)/2) - (GX-4);
    const dy = Math.round((VH - (BH+8)*2)/2) - (GY-4);
    el.style.transition = "none";
    el.style.left = (GX-4) + "px"; el.style.top = (GY-4) + "px";
    el.style.transform = `translate(${dx}px,${dy}px) scale(2)`;
    el.offsetHeight;
    el.style.transition = "";
    el.style.transform = "";
    el.style.zIndex = 3;
    $("dim").style.opacity = 0;
  }
}

const wait = ms => new Promise(r => setTimeout(r, ms));
function live(){ $("fg").innerHTML = sceneLive(); }
function say(t){ GS.msg = t; live(); }

/* ── 投げる ── */
async function throwBalls(){
  if (GS.phase !== "idle") return;
  GS.phase = "spin";
  GS.hand = [];
  say("回している");
  await zoom(true);
  spin = newSpin(launch(false, GS.balls), rotor.t);
  spin.wr = Math.max(spin.wr, rotor.w);
  resting = null;
}

/* ── 収まったあと ── */
async function settled(balls){
  GS.hand = balls.map(b => SLOTS[b.pocket]);
  GS.phase = "deal";
  say(GS.hand.map(i => DECK[i].nm).join("・") + " が出た");
  await wait(950);
  await zoom(false);
  await wait(120);

  /* 札は 1 枚ずつ、出た順に効く（杖のように積み上がらない） */
  GS.phase = "resolve";
  for (const ci of GS.hand){
    const c = DECK[ci], a = c.act;
    if (a.tgt === "front"){
      const f = frontFoe();
      if (!f){ break; }
      hit(f, a.dmg, a.brk);
      say(`${c.nm} → ${f.nm}に ${a.dmg}`);
    } else {
      GS.foes.forEach(f => { if (f.hp > 0) hit(f, a.dmg, a.brk); });
      say(`${c.nm} → 全体に ${a.dmg}`);
    }
    await wait(520);
  }

  if (!frontFoe()){
    say("この階は片づいた");
    await wait(900);
    GS.self.floor = Math.min(GS.self.floors, GS.self.floor + 1);
    GS.self.coin += 24;
    GS.foes = newFoes();
    GS.self.shield = 0;
    GS.phase = "idle";
    say("");
    return;
  }

  /* ── 敵の手番。頭の上に出ている印のとおりに動く ── */
  GS.phase = "foes";
  await wait(320);
  for (const f of GS.foes){
    if (f.hp <= 0) continue;
    for (const [k, n] of f.act){
      if (k === "atk"){ hit(GS.self, n); say(`${f.nm} の攻撃 ${n}`); }
      else            { f.shield += n;  say(`${f.nm} が盾 +${n}`); }
      await wait(420);
    }
  }
  if (GS.self.hp <= 0){
    say("倒れた。地下 1 階からやり直し");
    await wait(1200);
    GS.self.hp = GS.self.max; GS.self.shield = 0;
    GS.self.floor = 1; GS.self.coin = 0;
    GS.foes = newFoes();
  }
  GS.phase = "idle";
  say("");
}

/* ── 毎フレーム ── */
function loop(){
  requestAnimationFrame(loop);
  if (spin){
    const sub = Math.round((1/60) / DT);
    for (let i = 0; i < sub && spin.phase !== "done"; i++) step(spin);
    if (spin.phase === "done"){
      if (spin.hold === undefined){ spin.hold = 0; resting = spin.balls.map(restOf); }
      spin.hold += 1/60;
      spin.tr = norm(spin.tr + spin.wr * (1/60));
      const ps = restPositions(resting, spin.tr);
      spin.balls.forEach((b,i)=>{ b.p = ps[i]; });
    }
    rotor.t = spin.tr; rotor.w = spin.wr;
    drawWheel(spin.tr, spin.balls.map(b=>b.p), true);
    if (spin.phase === "done" && spin.hold > 0.8){
      const balls = spin.balls; spin = null;
      settled(balls);
    }
  } else {
    rotor.t = norm(rotor.t + rotor.w / 60);
    rotor.w = Math.max(0.35, rotor.w - 0.006 / 60);
    const bp = (resting !== null && resting.length) ? restPositions(resting, rotor.t) : null;
    drawWheel(rotor.t, bp, bp !== null);
  }
}

/* ═══════════════════════════════════════════════════════════════════
   H. 出す。拡大は整数倍だけ。1.5 倍などにするとドットが割れる
   ═══════════════════════════════════════════════════════════════════ */
function boot(){
  sizeWheel();                                   // BW / BH が決まる
  applyDeck();
  const wb = $("whl");
  wb.style.left = (GX-4) + "px";
  wb.style.top  = (GY-4) + "px";
  wb.style.width = (BW+8) + "px";
  wb.style.height = (BH+8) + "px";
  $("frm").innerHTML = wheelFrame();
  $("wheel").style.left = "4px"; $("wheel").style.top = "4px";
  $("bg").innerHTML = sceneStatic();
  live();
  fit();
  loop();
}

/* 押せるもの。組み直しても効くように、親で受ける */
$("scr").addEventListener("click", e => {
  const t = e.target.closest(".hit");
  if (t){
    const cl = t.classList;
    if (cl.contains("open")){ GS.inv = true; live(); return; }
    if (cl.contains("close")){ GS.inv = false; live(); return; }
    const d = [...cl].find(c => /^d\d+$/.test(c));
    const s2 = cl.contains("dec") ? -1 : 1;
    if (d){
      const i = +d.slice(1);
      GS.deck[i] = Math.max(0, Math.min(20, GS.deck[i] + s2));
      if (deckTotal() < MIN_N || deckTotal() > MAX_N){ GS.deck[i] -= s2; return; }
      applyDeck(); live(); return;
    }
    if (cl.contains("b")){
      GS.balls = Math.max(1, Math.min(MAX_BALLS, GS.balls + s2));
      live(); return;
    }
    return;
  }
  if (GS.inv) return;
  if (e.target.closest(".throwhit")) throwBalls();
});
addEventListener("keydown", e => {
  if (GS.inv){ if (e.key === "Escape"){ GS.inv = false; live(); } return; }
  if (e.key === " " || e.key === "Enter") throwBalls();
});

/** 拡大は整数倍だけ。半端な倍率にするとドットが 2px と 3px に割れて、
    せっかく揃えた格子が壊れる。入りきらないぶんは中央に置いて余白にする。
    画面が 640 より狭いときだけは、やむを得ず端数を許す。 */
function fit(){
  const hold = $("hold"), w = hold.clientWidth;
  const s = w < VW ? w / VW : Math.floor(w / VW);
  const left = Math.floor((w - VW*s) / 2);
  $("scr").style.transform = `translateX(${left}px) scale(${s})`;
  hold.style.height = Math.round(VH*s) + "px";
}
addEventListener("resize", fit);
boot();
</script>
