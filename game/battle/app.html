<title>戦闘画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   射的の杖・試作版 — 戦闘画面（案B「横」で確定した並び）
   見た目だけ。機能は入っていない。

   いちばん大事な決めごと：
   画面ぜんぶを「仮想 640×360 のドット」で組んで、最後に整数倍で拡大する。
   盤の裏画面が 300×250 なので、仮想画面ではそれが等倍で置ける。
   こうすると、盤のドット・人物のドット・枠線・文字が
   <b>ぜんぶ同じ大きさの升目に乗る</b>。素人くさく見える最大の原因は、
   ここが揃っていないこと（＝解像度の違うものを貼り合わせて見える）。
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* 影は下＋右。光は左上から。全部の凹凸をこの向きにそろえる */
  --u: 2px;                       /* 仮想 1 ドットの実寸 */
}
*{box-sizing:border-box}
html,body{margin:0;background:#07090b}
body{color:#d2c8b2;font-family:"DotGothic16",ui-monospace,monospace;
  -webkit-font-smoothing:none;image-rendering:pixelated}

.hold{position:relative;width:100%;overflow:hidden;background:#07090b}
/* 仮想画面。ここに 640×360 で描いて、整数倍で拡大する */
#scr{position:absolute;left:0;top:0;width:640px;height:360px;
  transform-origin:0 0;overflow:hidden;image-rendering:pixelated}
#scr *{image-rendering:pixelated}

/* 文字。DotGothic16 は 16px 設計なので、仮想 8（＝実寸 16）で焼くと崩れない */
.t{font-size:8px;line-height:10px}
/* 絵の上に乗る文字は 1 ドットの硬い影を付ける。ぼかさない */
.t.sh,.lbl.sh{text-shadow:1px 1px 0 #07090b}
.t2{font-size:16px;line-height:18px}

/* 面。光は左上：上と左が明るく、下と右が暗い */
.plate{position:absolute}
.plate>.f{position:absolute;inset:0}
.plate>.hi{position:absolute;left:0;top:0;right:1px;height:1px}
.plate>.hl{position:absolute;left:0;top:0;bottom:1px;width:1px}
.plate>.lo{position:absolute;left:1px;right:0;bottom:0;height:1px}
.plate>.lr{position:absolute;top:1px;right:0;bottom:0;width:1px}
.plate.sunk>.hi,.plate.sunk>.hl{opacity:0}
.plate.sunk>.dk{position:absolute;left:0;top:0;right:1px;height:1px}

.lbl{font-size:8px;line-height:10px;letter-spacing:0;color:#7a7264}
.ivory{color:#f0e8d4}

/* 説明の外枠（ゲーム画面ではない） */
.page{max-width:1400px;margin:0 auto;padding:14px 14px 50px;
  font-family:"DotGothic16",ui-monospace,monospace}
.page h1{margin:0 0 2px;font-size:18px;font-weight:400;color:#f0e8d4}
.page h1 em{font-style:normal;color:#e0b93a}
.page .sub{color:#7a7264;font-size:12px;margin-bottom:10px}
.page .sub b{color:#e0b93a}
.page .note{margin-top:12px;background:#141a18;border:2px solid #2b333b;
  padding:10px 12px;font-size:12.5px;line-height:1.8;color:#a89e8c}
.page .note b{color:#e0b93a}
.page .note h3{margin:0 0 6px;font-size:12px;color:#f0e8d4;font-weight:400}
.page .note ol{margin:4px 0 0;padding-left:1.4em}
.page .note li{margin:3px 0}
</style>

<div class="page">
  <h1>戦闘<em>画面</em></h1>
  <div class="sub">案B「横」で確定した並び / 見た目だけ・機能なし /
    仮想 640×360 を<b>整数倍だけ</b>で拡大（いま <b id="zoom">—</b>）</div>
  <div class="hold" id="hold"><div id="scr"></div></div>
  <div class="note" id="why"></div>
</div>

/* ═══════════════════════════════════════════════════════════════════
   2. ディザ。グラデーションを使わない
   にじんだ階調はドット絵の見た目を一発で壊す。
   2 色を升目で混ぜて、段の途中を作る（順序ディザ・4×4 のベイヤー）。
   ═══════════════════════════════════════════════════════════════════ */
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
/** c0 の上に c1 を level/16 の密度で撒いた 4×4 の模様を返す */
function dither(c0, c1, level){
  let r = `<rect width="4" height="4" fill="${c0}"/>`;
  for (let y=0;y<4;y++) for (let x=0;x<4;x++)
    if (BAYER[y][x] < level) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c1}"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" shape-rendering="crispEdges">${r}</svg>`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}
const ditherCSS = (c0,c1,lv) => `background-image:${dither(c0,c1,lv)};background-size:4px 4px`;

/* ═══════════════════════════════════════════════════════════════════
   3. ドット絵。升目を手で塗らず、形から起こして自動で陰と縁を付ける
   ここが本格的なドット絵との差がいちばん出るところ。
   ・光の向きを 1 つに決める（左上）
   ・当たっている辺は 1 段明るく、影の辺は 1 段暗く
   ・輪郭は黒ではなく、その色の いちばん暗い段（＝色付きの輪郭）
   手で 1 マスずつ塗る代わりに、形を置いてから機械的に付ける。
   ═══════════════════════════════════════════════════════════════════ */
function raster(w, h, ops){
  const g = Array.from({length:h}, ()=>new Array(w).fill(null));
  const put = (x,y,c) => { if (x>=0&&y>=0&&x<w&&y<h) g[y][x] = c; };
  for (const o of ops){
    if (o.k === "r"){
      for (let y=o.y;y<o.y+o.h;y++) for (let x=o.x;x<o.x+o.w;x++) put(x,y,o.c);
    } else if (o.k === "e"){                       // 升目の楕円
      const rx = o.w/2, ry = o.h/2, cx = o.x+rx-0.5, cy = o.y+ry-0.5;
      for (let y=o.y;y<o.y+o.h;y++) for (let x=o.x;x<o.x+o.w;x++){
        const dx = (x-cx)/rx, dy = (y-cy)/ry;
        if (dx*dx + dy*dy <= 1.02) put(x,y,o.c);
      }
    } else if (o.k === "p"){ put(o.x,o.y,o.c); }
    else if (o.k === "l"){                          // 太さ 1 の線
      const n = Math.max(Math.abs(o.x2-o.x), Math.abs(o.y2-o.y));
      for (let i=0;i<=n;i++)
        put(Math.round(o.x + (o.x2-o.x)*i/n), Math.round(o.y + (o.y2-o.y)*i/n), o.c);
    }
  }
  return g;
}
/** 左上から光を当てる。上か左が空いていれば 1 段明るく、下か右が空いていれば 1 段暗く */
function shade(g){
  const h = g.length, w = g[0].length;
  const at = (x,y) => (x<0||y<0||x>=w||y>=h) ? null : g[y][x];
  const out = g.map(r=>r.slice());
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const c = g[y][x]; if (!c || c.fix) continue;
    const lit  = !at(x,y-1) || !at(x-1,y);
    const dark = !at(x,y+1) || !at(x+1,y);
    if (lit && !dark) out[y][x] = {r:c.r, s:c.s+1};
    else if (dark && !lit) out[y][x] = {r:c.r, s:c.s-1};
  }
  return out;
}
/** 輪郭。塗った升目の外側に、その色のいちばん暗い段を置く */
function outline(g){
  const h = g.length, w = g[0].length;
  const at = (x,y) => (x<0||y<0||x>=w||y>=h) ? null : g[y][x];
  const out = g.map(r=>r.slice());
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    if (g[y][x]) continue;
    const n = at(x-1,y) || at(x+1,y) || at(x,y-1) || at(x,y+1);
    if (n) out[y][x] = {r:n.r, s:0, fix:true};
  }
  return out;
}
/** 升目 → SVG。横に同じ色が続くところは 1 本の矩形にまとめる */
function toSVG(g, cls){
  const h = g.length, w = g[0].length;
  let r = "";
  for (let y=0;y<h;y++){
    let x = 0;
    while (x < w){
      const c = g[y][x];
      if (!c){ x++; continue; }
      const col = C(c.r, c.s);
      let n = 1;
      while (x+n < w){ const d = g[y][x+n]; if (!d || C(d.r,d.s) !== col) break; n++; }
      r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${col}"/>`;
      x += n;
    }
  }
  return `<svg class="${cls||""}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
    shape-rendering="crispEdges">${r}</svg>`;
}
/** 形の座標ごと k 倍する。SVG を引き伸ばすと格子が壊れるので、
    升目に起こす前に大きくする。こうすれば 1 マスは画面の 1 ドットのまま。 */
function scaleOps(ops, k){
  const r = v => Math.round(v*k);
  return ops.map(o => o.k === "l"
    ? {...o, x:r(o.x), y:r(o.y), x2:r(o.x2), y2:r(o.y2)}
    : {...o, x:r(o.x), y:r(o.y), w:o.w!==undefined?Math.max(1,r(o.w)):undefined,
             h:o.h!==undefined?Math.max(1,r(o.h)):undefined});
}
const SPRITE_CACHE = {};
const spriteW = n => Math.round(SHAPES[n].w * (SHAPES[n].k||1));
const spriteH = n => Math.round(SHAPES[n].h * (SHAPES[n].k||1));
function sprite(name){
  if (!SPRITE_CACHE[name]){
    const d = SHAPES[name], k = d.k || 1;
    SPRITE_CACHE[name] = toSVG(outline(shade(
      raster(spriteW(name), spriteH(name), k === 1 ? d.ops : scaleOps(d.ops, k)))));
  }
  return SPRITE_CACHE[name];
}
const S = (r,s) => ({r, s});

/* ═══════════════════════════════════════════════════════════════════
   5. 画面の部品
   ═══════════════════════════════════════════════════════════════════ */
const box = (x,y,w,h,style,inner,cls) =>
  `<div class="${cls||""}" style="position:absolute;left:${x}px;top:${y}px;
    width:${w}px;height:${h}px;${style||""}">${inner||""}</div>`;

/** 面。光は必ず左上から。上と左が 1 ドット明るく、下と右が 1 ドット暗い。
    へこませたい時は sunk で反転する。全部の凹凸をこの向きにそろえる。 */
function plate(x,y,w,h,o){
  o = o || {};
  const f = o.fill || C("wood",2);
  const hi = o.hi || C("wood",4), lo = o.lo || C("wood",0);
  const a = o.sunk ? lo : hi, b = o.sunk ? hi : lo;
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;
    background:${f};${o.dither||""};${o.z?`z-index:${o.z};`:""}">
    <div style="position:absolute;left:0;top:0;right:1px;height:1px;background:${a}"></div>
    <div style="position:absolute;left:0;top:0;bottom:1px;width:1px;background:${a}"></div>
    <div style="position:absolute;left:1px;right:0;bottom:0;height:1px;background:${b}"></div>
    <div style="position:absolute;top:1px;right:0;bottom:0;width:1px;background:${b}"></div>
    ${o.inner ? `<div style="position:absolute;inset:1px">${o.inner}</div>` : ""}
  </div>`;
}
/** 斜めの線は階段で刻む。回転させるとアンチエイリアスでにじむ */
function stair(x, y, len, dx, thick, col, alpha){
  let h = "";
  for (let i=0;i<len;i++)
    h += `<div style="position:absolute;left:${Math.round(x + i*dx)}px;top:${y+i}px;
      width:${thick}px;height:1px;background:${col};${alpha?`opacity:${alpha};`:""}"></div>`;
  return h;
}
/** 硬い落ち影。ぼかさない。右下へ 3 ドット */
const shadowOf = (x,y,w,h,d) =>
  box(x+(d||3), y+(d||3), w, h, `background:${INK}`);

/* ═══════════════════════════════════════════════════════════════════

const VW = 640, VH = 360;
const WALLH = 296;                        // 壁と床の境
const MX = 4, MY = 4, MW = 312, MH = 258; // 機械。棚は外に出したので幅が要らない
const GX = 8, GY = 8, GW = 300, GH = 250; // ガラスの中（盤がちょうど入る）
const RKX = 356, RKW = 140, RKY = 34, RKH = 224;  // 壁に掛けた棚
const RAILX = 504, RAILW = VW - RAILX;
const FOOT = 332;                         // 自分も敵も、この線に立つ

function screen(){
  let h = "";

  /* ── 壁。上ほど明るく、下ほど暗い。段はディザで作る（にじませない） ── */
  h += box(0,0,VW,WALLH, `background:${C("stone",1)}`);
  [[0,56,12],[56,116,9],[116,180,6],[180,244,3],[244,WALLH,0]].forEach(([y0,y1,lv])=>{
    h += box(0,y0,VW,y1-y0, `background:${C("stone",1)};${ditherCSS(C("stone",1),C("stone",3),lv)}`);
  });
  /* 石積み。目地は 1 ドット。奥（上）ほどコントラストを落とす */
  for (let y=4;y<WALLH-6;y+=13){
    const row = Math.round((y-4)/13);
    const near = y > 180;
    for (let x=-16;x<VW;x+=28){
      const bx = x + (row%2 ? 14 : 0);
      h += box(bx, y, 26, 11, `background:${C("stone",near?2:1)};
        border-right:1px solid ${C("stone",0)};border-bottom:1px solid ${C("stone",0)};
        opacity:${near?1:.7}`, "", "bleed");
    }
  }
  /* 機械の明かりが壁を照らす。距離で密度を落とす（光も段で作る） */
  h += box(MX-26, MY-16, MW+52, MH+40, ditherCSS("transparent", C("brass",1), 2), "", "bleed");
  h += box(MX-10, MY-6, MW+20, MH+16, ditherCSS("transparent", C("brass",1), 5), "", "bleed");

  /* ── 床。壁より暖かい。機械の手前だけ明るい ── */
  /* 床は石ではなく木。壁と material を変えないと、床が壁の続きに見える */
  h += box(0,WALLH,VW,VH-WALLH, `background:${C("wood",1)}`);
  h += box(0,WALLH,VW,1, `background:${C("wood",3)}`);
  h += box(0,WALLH+1,VW,1, `background:${INK}`);
  /* 手前ほど明るい。奥（壁ぎわ）は暗く落として、床が寝ているように見せる */
  h += box(0,WALLH+2,VW,14, ditherCSS(C("wood",1), C("wood",0), 10));
  h += box(0,WALLH+16,VW,16, ditherCSS(C("wood",1), C("wood",2), 5));
  h += box(0,WALLH+32,VW,VH-WALLH-32, ditherCSS(C("wood",1), C("wood",2), 7));
  /* 板の継ぎ目 */
  for (let x=-20;x<VW;x+=74) h += box(x, WALLH+2, 1, VH-WALLH-2, `background:${C("wood",0)}`, "", "bleed");
  [WALLH+16, WALLH+32].forEach(y => h += box(0,y,VW,1, `background:${C("wood",0)}`));
  h += box(0,WALLH+2,360,VH-WALLH-2, ditherCSS("transparent", C("brass",1), 3), "", "bleed");

  /* ── 機械。壁に硬い影を落として、ボルトで留める ── */
  h += shadowOf(MX, MY, MW, MH, 4);
  h += plate(MX, MY, MW, MH, {fill:C("wood",2), hi:C("wood",4), lo:C("wood",0)});
  [[MX+3,MY+3],[MX+MW-7,MY+3],[MX+3,MY+MH-7],[MX+MW-7,MY+MH-7]].forEach(([bx,by])=>{
    h += plate(bx,by,4,4,{fill:C("brass",2), hi:C("brass",4), lo:C("brass",0)});
  });

  /* ガラスの中に盤。貼った絵ではなく、機械の中身に見せる */
  h += plate(GX-1, GY-1, GW+2, GH+2, {fill:INK, hi:C("wood",0), lo:C("wood",3), sunk:true});
  h += box(GX, GY, GW, GH, `overflow:hidden`,
    `<img src="${WHEEL_IMG}" width="${GW}" height="${GH}" alt="">` +
    box(0,0,GW,GH, ditherCSS("transparent", C("stone",0), 2)) +
    stair(-46, 0, GH, 0.62, 30, C("bone",4), .10) +
    stair(34,  0, GH, 0.62, 12, C("bone",4), .07) +
    box(0,0,GW,1, `background:${C("bone",2)};opacity:.30`));

  /* ── 盤から棚へ、札が通る管。これが無いと札は「どこかから湧いた」ことになる ── */
  const py = RKY + 6;
  h += shadowOf(MX+MW-2, py, RKX-MX-MW+6, 14, 3);
  h += plate(MX+MW-2, py, RKX-MX-MW+6, 14, {fill:C("steel",2), hi:C("steel",4), lo:C("steel",0)});
  h += box(MX+MW, py+4, RKX-MX-MW+2, 6, `background:${INK}`);
  for (let i=0;i<3;i++)                                     // 送りの向き
    h += box(MX+MW+8+i*10, py+5, 4, 4, `background:${C("brass",3)};opacity:${.8-i*.2}`);
  h += plate(RKX-4, RKY, 8, 26, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});

  /* ── 札の棚。機械と同じ木と真鍮。壁に金具で掛ける ── */
  h += shadowOf(RKX, RKY, RKW, RKH, 3);
  h += plate(RKX, RKY, RKW, RKH, {fill:C("wood",1), hi:C("wood",3), lo:C("wood",0)});
  h += plate(RKX+2, RKY+2, RKW-4, RKH-4, {fill:C("wood",0), hi:C("wood",2), lo:C("wood",0), sunk:true});
  [[RKX+4,RKY+4],[RKX+RKW-8,RKY+4],[RKX+4,RKY+RKH-8],[RKX+RKW-8,RKY+RKH-8]].forEach(([bx,by])=>{
    h += plate(bx,by,4,4,{fill:C("brass",2), hi:C("brass",4), lo:C("brass",0)});
  });
  h += rackCards(RKX+8, RKY+10, RKW-16);
  h += box(RKX, RKY-14, RKW, 11, `display:flex;justify-content:center`,
    `<span class="lbl">出た札　上から順に詠唱</span>`);

  /* ── レバー。丸ボタンではなく、機械に生えている物 ── */
  h += lever(150, MY+MH, WALLH+30);

  /* ── 役者。足元の線をそろえる ── */
  h += actor("hero", 78, FOOT, {hp:SELF.hp, max:SELF.max, shield:SELF.shield});
  const fx = [336, 398, 452];
  FOES.forEach((f,i)=> h += actor(f.sp, fx[i], FOOT, f, i===0));

  /* ── 右のレール。機械と同じ木と真鍮で作る ── */
  h += rail();
  return h;
}

/* ── 棚に並ぶ札 ──────────────────────────────────────────────────
   入れ替えは廃止したので、中身が分かるだけの大きさでよい。
   ただし「修飾は次の発射体に乗る」は読めないと困るので、
   乗るかたまりを枠でくくって、1 発ぶんが 1 かたまりに見えるようにする。 */
function rackCards(x, y, w){
  const g = []; let cur = [];
  WAND.forEach((c,i)=>{ cur.push({c,i:i+1}); if (c.t !== "mod"){ g.push(cur); cur = []; } });
  if (cur.length) g.push(cur);

  let h = "", cy = y;
  g.forEach((grp)=>{
    const many = grp.length > 1;
    const gh = grp.length*34 + (grp.length-1)*3 + (many?8:0);
    if (many){
      h += plate(x, cy, w, gh, {fill:C("wood",1), hi:C("wood",2), lo:C("wood",0), sunk:true});
      /* 束ねの棒。修飾が次の発射体に乗る＝この 3 枚で 1 発、を形で示す */
      h += box(x+2, cy+3, 3, gh-6, `background:${C("brass",2)}`);
      h += box(x+2, cy+3, 1, gh-6, `background:${C("brass",4)}`);
      h += box(x+2, cy+3, 3, 1, `background:${C("brass",4)}`);
      h += box(x+2, cy+gh-4, 3, 1, `background:${C("brass",0)}`);
    }
    let iy = cy + (many?4:0);
    grp.forEach(({c,i})=>{
      const t = TONE[c.t];
      h += plate(x+(many?8:0), iy, w-(many?12:0), 34, {fill:C(t,1), hi:C(t,2), lo:C(t,0)});
      h += box(x+(many?8:0)+4, iy+12, 10, 10, "",
        `<span class="lbl" style="color:${C(t,3)}">${i}</span>`);
      h += box(x+(many?8:0)+15, iy+9, 16, 16, "", glyph(c.g, 16));
      h += box(x+(many?8:0)+36, iy+12, 60, 10, "",
        `<span class="t ivory">${c.nm}</span>`);
      iy += 37;
    });
    cy += gh + 6;
  });
  return h;
}

/* ── レバー。丸ボタンではなく、床に立って機械につながる物にする ──
   実行の操作を世界の中の物にすると、UI が世界から浮かない。
   軸を機械の下枠まで通すことで、「これを引くと機械が動く」が絵で分かる。 */
function lever(x, top, floorY){
  const H = floorY - top;
  let h = "";
  /* 台。床に置く */
  h += box(x-8, floorY-3, 30, 4, `background:${INK};opacity:.55`);
  h += plate(x-9, floorY-10, 32, 10, {fill:C("steel",2), hi:C("steel",4), lo:C("steel",0)});
  h += plate(x-5, floorY-13, 24, 4, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});
  /* 軸。機械の下枠まで通す。これで「引くと機械が動く」が絵で分かる */
  h += box(x+1, top, 9, H-12, `background:${C("steel",2)}`);
  h += box(x+1, top, 2, H-12, `background:${C("steel",4)}`);
  h += box(x+8, top, 2, H-12, `background:${C("steel",0)}`);
  h += box(x, top+H-32, 11, 3, `background:${C("brass",2)}`);        // 留め金
  h += box(x, top+H-32, 11, 1, `background:${C("brass",4)}`);
  /* 握り。赤い玉 */
  h += plate(x-4, top+8, 19, 17, {fill:C("red",2), hi:C("red",4), lo:C("red",0)});
  h += box(x-1, top+11, 6, 4, `background:${C("red",4)}`);
  h += box(x-4, top+22, 19, 2, `background:${C("red",0)}`);
  h += box(x-12, floorY+4, 35, 10, `display:flex;justify-content:center`,
    `<span class="t sh" style="color:${C("brass",3)}">投げる</span>`);
  return h;
}

/* ── 役者。足元の線をそろえ、床に硬い接地影を落とす ── */
function actor(sp, x, foot, d, front){
  const S0 = SHAPES[sp], sw = S0.w, sh = S0.h;
  let h = "";
  h += box(x+2, foot-3, sw-2, 5, `background:${INK};opacity:.55`);   // 接地影
  h += box(x, foot-sh, sw, sh, "", sprite(sp));
  const bw = Math.max(sw+6, 50);
  const bx = x + (sw-bw)/2|0;
  /* HP。記号＋数字＋色の 3 つで出す。数字だけにしない */
  h += plate(bx, foot+9, bw, 9, {fill:C("red",0), hi:C("steel",2), lo:C("steel",0), sunk:true});
  h += box(bx+1, foot+10, Math.round((bw-2)*d.hp/d.max), 7, `background:${C("red",3)}`);
  h += box(bx+1, foot+10, Math.round((bw-2)*d.hp/d.max), 1, `background:${C("red",4)}`);
  h += box(bx, foot+9, bw, 9, `display:flex;align-items:center;justify-content:center`,
    `<span class="t sh" style="color:${C("bone",4)}">${d.hp}/${d.max}</span>`);
  if (d.shield){
    h += plate(bx-13, foot+7, 13, 13, {fill:C("blue",2), hi:C("blue",4), lo:C("blue",0)});
    h += box(bx-13, foot+7, 13, 13, `display:flex;align-items:center;justify-content:center`,
      `<span class="t sh" style="color:${C("bone",4)}">${d.shield}</span>`);
  }
  /* 次の一手。敵だけ、頭の上に */
  if (d.act){
    const aw = d.act.length*22 - 4;
    let ax = x + (sw-aw)/2|0, ay = foot - sh - 16;
    d.act.forEach(([k,n])=>{
      h += box(ax, ay, 10, 10, "", glyph(k,10));
      h += box(ax+11, ay+1, 10, 9, "", `<span class="t sh" style="color:${C("bone",4)}">${n}</span>`);
      ax += 22;
    });
  }
  /* 前の敵に印。いま殴られるのはここ、が一目で分かるように */
  if (front){
    const mx = x + (sw/2|0) - 3;
    for (let i=0;i<4;i++)
      h += box(mx-3+i, foot-sh-26+i, 7-i*2, 1, `background:${C("brass",3)}`);
  }
  return h;
}

/* ── 右のレール ────────────────────────────────────────────────── */
function rail(){
  const x = RAILX, w = RAILW;
  let h = "";
  h += shadowOf(x, 0, w, VH, 0);
  h += plate(x, -2, w, VH+4, {fill:C("wood",1), hi:C("wood",3), lo:C("wood",0)});
  h += box(x+3, 0, 1, VH, `background:${C("wood",0)}`);
  const ix = x + 10, iw = w - 20;

  const btn = (y, label, tall) => {
    let s = plate(ix, y, iw, tall||20, {fill:C("wood",2), hi:C("wood",4), lo:C("wood",0)});
    s += box(ix, y, iw, tall||20, `display:flex;align-items:center;justify-content:center`,
      `<span class="t" style="color:${C("bone",3)}">${label}</span>`);
    return s;
  };
  h += btn(10, "ターンをスキップ", 22);
  h += box(ix, 42, iw, 1, `background:${C("wood",0)}`);

  h += box(ix, 48, 20, 10, "", `<span class="lbl">玉</span>`);
  [1,2,3].forEach((n,i)=>{
    const on = n === 2;
    h += plate(ix+22+i*24, 46, 20, 16,
      {fill:on?C("brass",3):C("wood",2), hi:on?C("brass",4):C("wood",4), lo:on?C("brass",1):C("wood",0)});
    h += box(ix+22+i*24, 46, 20, 16, `display:flex;align-items:center;justify-content:center`,
      `<span class="t" style="color:${on?C("wood",0):C("bone",2)}">${n}</span>`);
  });
  h += box(ix, 70, iw, 1, `background:${C("wood",0)}`);

  ["持ち物","図鑑","相棒"].forEach((t,i)=> { h += btn(78+i*26, t); });
  h += box(ix, 158, iw, 1, `background:${C("wood",0)}`);

  /* 読み取り。見出しは左、数字は右にそろえる */
  const read = (y, k, v) =>
    box(ix, y, iw, 10, "", `<span class="lbl">${k}</span>`) +
    box(ix, y, iw, 10, `display:flex;justify-content:flex-end`,
      `<span class="t" style="color:${C("brass",3)}">${v}</span>`);
  h += read(166, "階層", `${SELF.floor} / ${SELF.floors}`);
  h += read(180, "所持金", SELF.coin);
  h += read(194, "残り札", 9);

  /* 次に起きることを 1 か所にまとめる。目の行き先を作らないと、
     プレイヤーは画面を舐めるように探すことになる */
  h += box(ix, 212, iw, 10, "", `<span class="lbl">次の一手</span>`);
  h += plate(ix, 228, iw, 46, {fill:C("wood",0), hi:C("wood",2), lo:C("wood",0), sunk:true});
  const rows = [["atk", 6, "受ける"], ["def", 8, "相手が守る"]];
  rows.forEach(([g,n,t],i)=>{
    const y = 234 + i*18;
    h += box(ix+5, y, 12, 12, "", glyph(g,12));
    h += box(ix+20, y+2, 14, 10, "", `<span class="t" style="color:${C("bone",4)}">${n}</span>`);
    h += box(ix+36, y+2, iw-40, 10, "", `<span class="lbl">${t}</span>`);
  });

  /* 下は空けておく。詰め込むと、どこを見ればいいか分からなくなる */
  return h;
}

/** 拡大は整数倍だけ。半端な倍率にするとドットが 2px と 3px に割れて、
    せっかく揃えた格子が壊れる。入りきらないぶんは中央に置いて余白にする。
    画面が 640 より狭いときだけは、やむを得ず端数を許す。 */
function fit(){
  const hold = $("hold"), w = hold.clientWidth;
  const s = w < VW ? w / VW : Math.floor(w / VW);
  const sc = $("scr");
  const left = Math.floor((w - VW*s) / 2);
  sc.style.transform = `translateX(${left}px) scale(${s})`;
  hold.style.height = Math.round(VH*s) + "px";
  $("zoom").textContent = `×${s}`;
}
