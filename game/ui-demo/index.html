<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戦闘画面のレイアウト案</title>
<meta name="description" content="射的の杖・試作版。横画面の戦闘画面レイアウト案を並べて見比べる。見た目だけで機能は無し。">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f0e">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>戦闘画面のレイアウト案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   射的の杖・試作版 — 戦闘画面のレイアウト案（Dungeon Clawler の骨格）
   骨格は 5 つ。①抽選機が画面の主役　②地面の線に自分と敵が並ぶ
   ③右端に細い操作レール　④敵の意図は頭の上　⑤HP は足元
   違うのは「出た札をどこに出すか」だけ。見た目のみで機能は無い。
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --ink0:#0b0f0e; --ink1:#141a18; --ink2:#1e2724; --ink3:#2b3733;
  --line:#3f514b; --line-hi:#5b736b;
  --wood:#4a2a18; --wood-hi:#6d3f24; --wood-lo:#2c180d;
  --brass:#c9a227; --brass-hi:#f0d878; --brass-lo:#8a6d15;
  --ivory:#f2ece0; --dim:#8a958e;
  --red:#b8262c; --red-hi:#d94a4a;
  --green:#2fa066; --blue:#3f7fa8; --purple:#7a4fa8;
  --dot: "DotGothic16", ui-monospace, monospace;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink0);color:var(--ivory);font-family:var(--dot);
  -webkit-font-smoothing:none}

.page{max-width:1400px;margin:0 auto;padding:14px 14px 60px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.top h1{margin:0;font-size:20px;font-weight:400;letter-spacing:1px}
.top h1 em{font-style:normal;color:var(--brass)}
.top .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
.top .spacer{flex:1 1 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font:inherit;font-size:13px;padding:8px 14px;cursor:pointer;
  background:var(--ink2);color:var(--dim);border:2px solid var(--line);
  box-shadow:3px 3px 0 var(--ink0)}
.tabs button:hover{color:var(--ivory);border-color:var(--line-hi)}
.tabs button.on{background:var(--brass);color:#1a1405;border-color:var(--brass-hi)}
.tabs button small{display:block;font-family:var(--mono);font-size:9.5px;opacity:.75}
.caption{background:var(--ink1);border:2px solid var(--line);padding:10px 12px;
  margin-bottom:12px;font-size:13px;line-height:1.75}
.caption b{color:var(--brass-hi)}
.caption .row{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;
  font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.caption .row span b{color:var(--ivory);font-weight:400}
.caption .ng b{color:var(--red-hi)}
.stagewrap{position:relative;width:100%;overflow:hidden;
  border:2px solid var(--line);background:#000}
.screen{position:absolute;left:0;top:0;width:1280px;height:720px;
  transform-origin:0 0;overflow:hidden;display:none}
.screen.on{display:block}

/* ── 画面の地 ── */
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--dim)}

/* 上の丸札（階層・持ち金） */
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(11,15,14,.86);
  border:2px solid var(--line);padding:3px 10px;font-size:13px}
.pill .co{width:12px;height:12px;background:var(--brass);border:2px solid var(--brass-lo)}

/* 抽選機の筐体 */
.cab{position:absolute;inset:0;background:var(--ink1);
  border:6px solid var(--wood-hi);box-shadow:inset 0 0 0 4px var(--wood-lo),
  0 0 0 3px var(--ink0), 0 10px 40px rgba(0,0,0,.6)}
.glass{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg, rgba(255,255,255,.10) 0 12%, rgba(255,255,255,0) 12.1% 22%,
    rgba(255,255,255,.06) 22.1% 30%, rgba(255,255,255,0) 30.1% 100%)}

/* 地面 */
.ground{position:absolute;left:0;right:0;background:var(--ink2);
  border-top:3px solid var(--line)}

/* 役者 */
.actor{position:absolute;display:flex;flex-direction:column;align-items:center}
.actor .sp{display:block}
.hpbar{position:relative;height:20px;background:#2a1416;border:3px solid var(--ink0);
  box-shadow:0 0 0 2px var(--line)}
.hpbar i{display:block;height:100%;background:linear-gradient(180deg,var(--red-hi),var(--red))}
.hpbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ivory);
  text-shadow:1px 1px 0 #000}
.shbadge{position:absolute;left:-16px;top:-6px;width:30px;height:32px;
  display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:#fff;
  background:var(--blue);border:3px solid var(--ink0);
  clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
/* 敵の意図 */
.intents{display:flex;gap:11px;justify-content:center;margin-bottom:6px}
.intent{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);
  font-size:13px;color:var(--ivory);text-shadow:1px 1px 0 #000}
.marker{width:0;height:0;margin:0 auto 2px;
  border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:10px solid var(--brass)}

/* 右のレール */
.rail{position:absolute;top:0;bottom:0;background:var(--ink1);
  border-left:4px solid var(--line)}
.railbtn{display:block;width:100%;font:inherit;font-size:15px;padding:10px 0;
  text-align:center;background:var(--ink2);color:var(--ivory);
  border:3px solid var(--line);box-shadow:3px 3px 0 var(--ink0)}
.burger{width:52px;height:52px;display:grid;place-content:center;gap:6px;
  background:var(--ink2);border:3px solid var(--line);box-shadow:3px 3px 0 var(--ink0)}
.burger i{display:block;width:26px;height:4px;background:var(--ivory)}
.round{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 32%, var(--brass-hi), var(--brass) 46%, var(--brass-lo));
  border:5px solid var(--ink0);box-shadow:0 0 0 4px var(--brass-lo), 0 0 34px rgba(240,216,120,.35)}
.round span{font-size:19px;color:#231a02}
.iconbtn{width:56px;height:56px;display:grid;place-items:center;background:var(--ink2);
  border:3px solid var(--line);box-shadow:3px 3px 0 var(--ink0)}

/* 出た札。中身が分かる最小限の大きさ */
.dchip{position:relative;width:62px;height:70px;background:var(--ink2);
  border:3px solid var(--line);box-shadow:3px 3px 0 var(--ink0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dchip .nm{font-size:11px;line-height:1;white-space:nowrap}
.dchip .ord{position:absolute;left:2px;top:1px;font-family:var(--mono);font-size:9px;
  color:var(--dim)}
.dchip.proj{border-color:var(--red);background:#2a1416}
.dchip.mod{border-color:var(--blue);background:#132029}
.dchip.util{border-color:var(--brass-lo);background:#26200a}
/* 小さめ／横長。置き場所に合わせて 3 つの大きさを使う */
.dchip.m{height:56px}
.dchip.h{width:96px;height:36px;flex-direction:row;gap:5px;justify-content:flex-start;
  padding-left:19px}
.dchip.h .ord{left:5px;top:11px}
/* 修飾は、次の発射体に乗る。ひと続きに見せる */
.dgroup{display:flex;align-items:center;gap:4px;padding:5px;
  border:2px dashed rgba(240,216,120,.35)}
</style>

<div class="page">
  <div class="top">
    <h1>戦闘画面の<em>レイアウト案</em>（Dungeon Clawler 型）</h1>
    <div class="sub">見た目だけ・機能なし / 1280×720</div>
    <div class="spacer"></div>
    <div class="sub" id="scale">—</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="caption" id="caption"></div>
  <div class="stagewrap" id="stagewrap"></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════════════════════
   1. 中身。4 案とも同じ盤面。違うのは「出た札をどこに出すか」だけ
   ═══════════════════════════════════════════════════════════════════ */
const FOES = [
  {nm:"どぶ鼠", sp:"rat",  hp:11, max:18, intent:[["atk",2],["atk",2],["atk",2]]},
  {nm:"苔の塊", sp:"blob", hp:22, max:22, intent:[["def",8]]},
  {nm:"骨兵",   sp:"bone", hp:9,  max:30, intent:[["atk",6]]},
];
const WAND = [
  {t:"mod",  nm:"倍加", ico:"mul"},
  {t:"mod",  nm:"貫通", ico:"pier"},
  {t:"proj", nm:"火球", ico:"fire"},
  {t:"util", nm:"構え", ico:"gard"},
  {t:"proj", nm:"氷矢", ico:"ice"},
];
const SELF = {hp:110, max:110, shield:5, floor:"1/20 階", coin:0};

/* ═══════════════════════════════════════════════════════════════════
   2. ドット絵
   ═══════════════════════════════════════════════════════════════════ */
const SPRITES = {
  rat: {key:{b:"#6d5a4a", d:"#4a3c31", w:"#f2ece0"}, rows:[
    "..............","..............",".b..........b.",".bb........bb.",
    "..bbbbbbbbbb..",".bbbbbbbbbbbbd",".bbwbbbbbbwbbd","bbbbbbbbbbbbb.",
    "bbbbbbbbbbbbb.",".bbbbbbbbbbbb.","..dd..dd..dd..","..dd..dd..dd..",
    "..............","..............",
  ]},
  blob: {key:{g:"#2fa066", d:"#1a6b45", w:"#f2ece0", h:"#8ee0b0"}, rows:[
    "..............","..............",".....hhhh.....","...hhgggghh...",
    "..gggggggggg..",".gggwggggwggg.",".gggwggggwggg.",".gggggggggggg.",
    "gggggggggggggg","gggggggggggggg",".dddggggggddd.","..dddddddddd..",
    "..............","..............",
  ]},
  bone: {key:{i:"#d8d2c2", d:"#8a8474", e:"#0b0f0e"}, rows:[
    ".....iiii.....","....iiiiii....","....ideedi....","....iiiiii....",
    ".....iddi.....","...iiiiiiii...","..iiiiiiiiii..","..i.iiiiii.i..",
    "..i.iiiiii.i..","....ii..ii....","....ii..ii....","...ddd..ddd...",
    "..............","..............",
  ]},
  hero: {key:{p:"#c9a227", c:"#3f7fa8", d:"#28556f", s:"#e8c9a0", y:"#f0d878", e:"#0b0f0e"}, rows:[
    ".....pppp.....","....pppppp....","....psseps....","....pssssp....",
    "...cccccccc.y.","..cccccccccy..","..ddccccccy...","..ddcccccy....",
    "..ddcccccc....","...cc..cc.....","...cc..cc.....","..ddd..ddd....",
    "..............","..............",
  ]},
};
function sprite(name, px){
  const s = SPRITES[name], w = s.rows[0].length, h = s.rows.length;
  let r = "";
  for (let y=0;y<h;y++){
    const row = s.rows[y]; let x = 0;
    while (x < row.length){
      const ch = row[x];
      if (ch === "."){ x++; continue; }
      let n = 1;
      while (x+n < row.length && row[x+n] === ch) n++;
      r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${s.key[ch]}"/>`;
      x += n;
    }
  }
  return `<svg class="sp px" width="${w*px}" height="${h*px}" viewBox="0 0 ${w} ${h}"
    shape-rendering="crispEdges">${r}</svg>`;
}

const ICONS = {

    <rect x="2" y="2" width="4" height="3" fill="#d94a4a"/>

  ice:`<rect x="3" y="0" width="2" height="8" fill="#9ccfe8"/>
    <rect x="0" y="3" width="8" height="2" fill="#9ccfe8"/>
    <rect x="1" y="1" width="2" height="2" fill="#3f7fa8"/>
    <rect x="5" y="5" width="2" height="2" fill="#3f7fa8"/>`,
  mul:`<rect x="1" y="1" width="2" height="2" fill="#f0d878"/>
    <rect x="5" y="1" width="2" height="2" fill="#f0d878"/>
    <rect x="3" y="3" width="2" height="2" fill="#c9a227"/>
    <rect x="1" y="5" width="2" height="2" fill="#f0d878"/>
    <rect x="5" y="5" width="2" height="2" fill="#f0d878"/>`,
  pier:`<rect x="0" y="3" width="6" height="2" fill="#9ccfe8"/>
    <rect x="5" y="2" width="2" height="4" fill="#3f7fa8"/>
    <rect x="6" y="1" width="2" height="6" fill="#3f7fa8"/>`,
  gard:`<rect x="1" y="0" width="6" height="5" fill="#c9a227"/>
    <rect x="2" y="5" width="4" height="2" fill="#c9a227"/>
    <rect x="3" y="7" width="2" height="1" fill="#8a6d15"/>`,
  atk:`<rect x="5" y="0" width="3" height="3" fill="#d94a4a"/>
    <rect x="3" y="2" width="3" height="3" fill="#d94a4a"/>
    <rect x="1" y="4" width="3" height="3" fill="#b8262c"/>
    <rect x="0" y="6" width="2" height="2" fill="#8a8474"/>`,
  def:`<rect x="1" y="0" width="6" height="4" fill="#3f7fa8"/>
    <rect x="2" y="4" width="4" height="2" fill="#3f7fa8"/>
    <rect x="3" y="6" width="2" height="2" fill="#28556f"/>`,
};
const icon = (k, px) => `<svg class="px" width="${px}" height="${px}" viewBox="0 0 8 8"
  shape-rendering="crispEdges">${ICONS[k]}</svg>`;

/* ═══════════════════════════════════════════════════════════════════
   3. 共通の部品
   ═══════════════════════════════════════════════════════════════════ */
const abs = (x,y,w,h,cls,html) =>
  `<div class="${cls||""}" style="position:absolute;left:${x}px;top:${y}px;`+

/** 盤。裏画面 300 ドットのちょうど 2 倍で焼いてあるので、598×498 が等倍 */
const wheel = w => `<img class="px" src="${WHEEL_IMG}" alt=""
  style="display:block;width:${w}px;height:${Math.round(w*498/598)}px">`;

/** 盤の右の空きを埋める。鎖と松明と樽で、地下の部屋らしくする。
    地面には何も置かない。そこは敵の立ち位置なので、必ずぶつかる。 */
function atmosphere(x0, x1){
  const cx = Math.round((x0+x1)/2);
  let h = "";
  // 天井から下がった鎖と鉤
  h += abs(cx-5, 0, 10, 152, "", `<div style="position:absolute;inset:0;
    background:repeating-linear-gradient(180deg,#5b736b 0 7px,#222c28 7px 14px)"></div>`);
  h += abs(cx-25, 152, 50, 44, "", `
    <div style="position:absolute;left:0;top:0;width:50px;height:12px;background:#98a0aa"></div>
    <div style="position:absolute;left:2px;top:12px;width:9px;height:30px;background:#6a707a"></div>
    <div style="position:absolute;left:39px;top:12px;width:9px;height:30px;background:#6a707a"></div>`);
  // 松明。炎は台のまっすぐ上に置く
  [[x0+34, 250],[x1-72, 318]].forEach(([tx,ty])=>{
    h += abs(tx, ty, 12, 32, "", `<div style="position:absolute;inset:0;background:var(--wood-hi);
      border:2px solid var(--wood-lo)"></div>`);
    h += abs(tx-2, ty-16, 16, 16, "", `<div style="position:absolute;inset:0;
      background:var(--brass-hi);box-shadow:0 0 26px 10px rgba(240,216,120,.18)"></div>`);
    h += abs(tx+1, ty-24, 10, 8, "", `<div style="position:absolute;inset:0;
      background:var(--brass)"></div>`);
  });
  // 樽を置いていたが、敵の立ち位置とちょうど重なったのでやめた。
  // 地面には物を置かない。ここは敵の場所。
  return h;
}

/** 壁のドット模様。地の面が広いので、これが無いと寒々しい */
function bricks(x0,y0,x1,y1){
  let h = "";
  for (let y=y0;y<y1;y+=18) for (let x=x0;x<x1;x+=30){
    const bx = x + (Math.round((y-y0)/18)%2 ? 15 : 0);
    if (bx + 24 > x1) continue;
    h += `<div style="position:absolute;left:${bx}px;top:${y}px;width:24px;height:9px;
      background:#121a18"></div>`;
  }
  return h;
}

/** 自分。左端に立つ */
function hero(x, footY, px){
  const sh = 14*px;
  return abs(x, footY-sh, 0, 0, "", sprite("hero", px)) +
    abs(x-14, footY+10, 148, 0, "", `
      <div class="hpbar"><i style="width:${Math.round(SELF.hp/SELF.max*100)}%"></i>
        <b>${SELF.hp}/${SELF.max}</b>
        <span class="shbadge">${SELF.shield}</span></div>`);
}

/** 敵 1 体。意図は頭の上（above）か、HP の右（side） */
function foe(f, x, footY, px, front, mode){
  const sh = 14*px, w = 14*px;
  const ints = f.intent.map(([k,n])=>
    `<span class="intent">${icon(k,18)}${n}</span>`).join("");
  let h = "";
  if (mode !== "side")
    h += abs(x, footY-sh-46, w, 0, "", `<div class="intents">${ints}</div>` +
      (front ? `<div class="marker"></div>` : ""));
  else if (front)
    h += abs(x, footY-sh-22, w, 0, "", `<div class="marker"></div>`);
  h += abs(x, footY-sh, 0, 0, "", sprite(f.sp, px));
  h += abs(x-8, footY+10, w+16, 0, "", `
    <div class="hpbar"><i style="width:${Math.round(f.hp/f.max*100)}%"></i>
      <b>${f.hp}/${f.max}</b></div>` +
    (mode === "side" ? `<div class="intents" style="margin:6px 0 0">${ints}</div>` : ""));
  return h;
}

/** 出た札 1 枚。中身が分かるだけの大きさ。sz: ""=大 / m=中 / h=横長 */
const dchip = (c, ord, sz) => `<div class="dchip ${c.t} ${sz||""}">
  <span class="ord">${ord}</span>${icon(c.ico, sz==="h" ? 18 : 22)}<span class="nm">${c.nm}</span></div>`;

/** 修飾は次の発射体に乗るので、ひとかたまりに見せる */
function groups(){
  const g = []; let cur = [];
  WAND.forEach((c,i)=>{ cur.push({c, i:i+1}); if (c.t !== "mod"){ g.push(cur); cur = []; } });
  if (cur.length) g.push(cur);
  return g;
}
/** 横一列。sz は dchip と同じ */
const resultRow = (sz) => `<div style="display:flex;align-items:center;gap:12px">
  ${groups().map(g => g.length > 1
    ? `<div class="dgroup">${g.map(o=>dchip(o.c,o.i,sz)).join("")}</div>`
    : `<div style="padding:5px">${dchip(g[0].c, g[0].i, sz)}</div>`).join("")}</div>`;
/** 縦一列 */
const resultCol = (sz) => `<div style="display:flex;flex-direction:column;align-items:stretch;gap:8px">
  ${groups().map(g => g.length > 1
    ? `<div class="dgroup" style="flex-direction:column;gap:6px">${g.map(o=>dchip(o.c,o.i,sz)).join("")}</div>`
    : `<div style="padding:5px">${dchip(g[0].c, g[0].i, sz)}</div>`).join("")}</div>`;

/** 右のレール。上のボタン・丸ボタン・小さい四角の並び */
function rail(x, w, opt){
  const o = opt || {};
  const cx = x + w/2;
  let h = abs(x, 0, w, 720, "rail", "");
  h += abs(x+14, 14, w-84, 0, "", `<button class="railbtn">ターンをスキップ</button>`);
  h += abs(x+w-66, 14, 0, 0, "", `<div class="burger"><i></i><i></i><i></i></div>`);
  const by = o.roundY === undefined ? 106 : o.roundY;
  h += abs(cx-66, by, 0, 0, "", `<div class="round"><span>投げる</span></div>`);
  h += abs(x+14, by+146, w-28, 0, "", `
    <div style="display:flex;gap:6px;align-items:center;justify-content:center">
      <span class="lbl">玉</span>
      ${[1,2,3].map(n=>`<span style="width:26px;height:26px;display:grid;place-items:center;
        font-family:var(--mono);font-size:12px;background:${n===2?"var(--brass)":"var(--ink2)"};
        color:${n===2?"#1a1405":"var(--dim)"};border:2px solid var(--line)">${n}</span>`).join("")}
    </div>`);
  if (o.icons !== false){
    const iy = o.iconY === undefined ? 560 : o.iconY;
    h += abs(x+14, iy, w-28, 0, "", `
      <div style="display:flex;gap:8px;justify-content:center">
        ${["持ち物","図鑑","相棒"].map(t=>`<div class="iconbtn" title="${t}">
          <span style="font-size:10px;color:var(--dim)">${t}</span></div>`).join("")}
      </div>`);
  }
  return h;
}

/** 上のほうに出す階層と持ち金 */
const pills = (cx) => abs(cx-110, 12, 220, 0, "", `
  <div style="display:flex;gap:10px;justify-content:center">
    <span class="pill">${SELF.floor}</span>
    <span class="pill"><i class="co"></i>${SELF.coin}</span>
  </div>`);

/* ═══════════════════════════════════════════════════════════════════
   4. 案。骨格は 4 つとも同じで、「出た札をどこに出すか」だけ違う
      盤：598×498（裏画面 300 ドットのちょうど 2 倍）＝ 画面の横幅の 47%
      レール：x 1010〜1280　地面：足元 660
   ═══════════════════════════════════════════════════════════════════ */
const RAILX = 1010, RAILW = 270, MAINW = RAILX;
const FOOT = 668;                     // 自分も敵も、この線に立つ
const WX = 20, WY = 8, WW = 598;      // 盤の左上と幅（598 = 裏画面 300 ドットの 2 倍）
const WBOT = 518;                     // 筐体の下端
const COLX = 640, COLR = 1000;        // 盤の右にできる縦の空き

/** 4 案に共通の下地：壁・地面・自分・敵 */
function base(opt){
  const o = opt || {};
  const foot = o.foot === undefined ? FOOT : o.foot;
  let h = "";
  h += abs(0,0,1280,720,"", `<div style="position:absolute;inset:0;
    background:linear-gradient(180deg,#151d1a 0%,#0e1513 62%,#0b0f0e 100%)"></div>`);
  h += bricks(12, 30, RAILX-12, foot-30);
  h += abs(0, foot+2, 1280, 720-foot-2, "ground", "");
  h += pills(MAINW/2);
  // 自分は盤の下、敵は盤の右下。Dungeon Clawler と同じ置き方
  h += hero(o.heroX === undefined ? 92 : o.heroX, foot, o.heroPx || 7);
  const ex = o.foeX || [636, 762, 888];
  FOES.forEach((f,i)=> h += foe(f, ex[i], foot, o.foePx || 7, i===0, o.intentMode));
  return h;
}

/** 筐体に入った盤。h に足して使う */
const cabinet = (y, ht) => abs(WX, y, WW+12, ht, "", `<div class="cab"></div>
  <div style="position:absolute;inset:6px;overflow:hidden">${wheel(WW)}
  <div class="glass"></div></div>`);

const LAYOUTS = {};

/* ── 案A レール ─────────────────────────────────────────────────
   出た札は右のレールに縦一列。主画面は盤と戦闘だけになる。 */
LAYOUTS.rail = {
  name:"レール", en:"RAIL",
  lead:"出た札は<b>右のレールに縦一列</b>。主画面は盤と戦闘だけになるので、盤をいちばん大きく取れる。",
  pro:"主画面が札に一切邪魔されない。順番が上から下で読める。札が増えても縦に伸ばすだけ",
  con:"視線が左（盤）と右端（札）を往復する。レールが札で埋まるので操作の余地が減る",
  build(){
    let h = base();
    h += cabinet(WY, WBOT-WY);
    h += atmosphere(COLX, COLR);
    h += rail(RAILX, RAILW, {roundY:84, icons:false});
    h += abs(RAILX+14, 262, RAILW-28, 0, "", `<span class="lbl">出た札 — 上から順に詠唱</span>`);
    h += abs(RAILX+14, 282, RAILW-28, 0, "", resultCol("h"));
    h += abs(RAILX+14, 656, RAILW-28, 0, "", `
      <div style="display:flex;gap:8px;justify-content:center">
        ${["持ち物","図鑑","相棒"].map(t=>`<div class="iconbtn">
          <span style="font-size:10px;color:var(--dim)">${t}</span></div>`).join("")}
      </div>`);
    return h;
  }
};

/* ── 案B 横 ────────────────────────────────────────────────────
   盤の右にできる縦の空きを、そのまま出た札の置き場にする。
   盤と札が横に並ぶので、両方を一度に見られる。 */
LAYOUTS.side = {
  name:"横", en:"SIDE",
  lead:"盤の右にできる縦の空きを、そのまま<b>出た札の置き場</b>にする。盤と札が横に並ぶ。",
  pro:"盤と札が同時に目に入る。ほかの案で余っていた場所をそのまま使えるので、どこも詰まらない",
  con:"敵の頭上と場所を取り合う。札が 6 枚を超えると縦に入りきらない",
  build(){
    let h = base({foeX:[648, 762, 876]});
    h += cabinet(WY, WBOT-WY);
    h += abs(COLX+8, 16, 0, 0, "", `<span class="lbl">出た札 — 上から順に詠唱</span>`);
    h += abs(COLX+8, 36, COLR-COLX-16, 0, "", resultCol("h"));
    h += rail(RAILX, RAILW, {roundY:150});
    return h;
  }
};

/* ── 案C ガラスの中 ─────────────────────────────────────────────
   Dungeon Clawler のコンベアと同じ場所。筐体を縦に伸ばし、
   ガラスの下に受け皿を作って、そこに出た札を積む。 */
LAYOUTS.tray = {
  name:"受け皿", en:"TRAY",
  lead:"筐体を縦に伸ばし、<b>ガラスの中の受け皿</b>に出た札が溜まる。Dungeon Clawler のコンベアと同じ位置。",
  pro:"抽選機と結果が 1 つの箱に収まる。「この機械が札を出している」がいちばん強く出る",
  con:"箱が縦に大きくなるので、自分と敵の居場所が下に押し込まれる",
  build(){
    let h = base({foot:668, heroX:56, heroPx:6, foePx:6, foeX:[648, 762, 876]});
    h += atmosphere(COLX, COLR);
    h += abs(WX, 4, WW+12, 574, "", `<div class="cab"></div>
      <div style="position:absolute;inset:6px;overflow:hidden">
        ${wheel(WW)}
        <div style="position:absolute;left:0;right:0;bottom:0;height:60px;
          background:linear-gradient(180deg,#1a2320,#0e1513);
          border-top:3px solid var(--line)"></div>
        <div style="position:absolute;left:8px;right:8px;bottom:10px;
          display:flex;align-items:center;gap:8px">
          <span class="lbl" style="writing-mode:vertical-rl;letter-spacing:0">受け皿</span>
          ${resultRow("h")}
        </div>
        <div class="glass"></div>
      </div>`);
    h += rail(RAILX, RAILW, {roundY:150});
    return h;
  }
};

/* ── 案D 下帯 ──────────────────────────────────────────────────
   画面のいちばん下に全幅の帯。札の置き場がいちばん広い。 */
LAYOUTS.band = {
  name:"下帯", en:"BAND",
  lead:"画面のいちばん下に<b>全幅の帯</b>。札の置き場がいちばん広く取れて、盤も大きいまま。",
  pro:"札が大きく出せる。手前に置くので、いま何が出たかが目に入りやすい",
  con:"帯が常時場所を取るので、人物を小さくして上に詰めることになる。札が少ない時は間延びする",
  build(){
    // 札をいちばん大きく見せるぶん、人物は小さくして上に詰める
    let h = base({foot:586, heroPx:5, foePx:5, foeX:[648, 758, 868]});
    h += cabinet(4, 502);
    h += atmosphere(COLX, COLR);
    // 見出しは札の左に置く。上に重ねると、囲みの破線と文字がぶつかる
    h += abs(0, 620, RAILX, 100, "", `
      <div style="position:absolute;inset:0;background:var(--ink1);
        border-top:4px solid var(--line)"></div>
      <div style="position:absolute;left:14px;top:14px;right:14px;
        display:flex;align-items:center;gap:12px">
        <span class="lbl" style="writing-mode:vertical-rl;letter-spacing:0">出た札</span>
        ${resultRow("m")}
        <span class="lbl" style="margin-left:6px">左から順に詠唱</span>
      </div>`);
    h += rail(RAILX, RAILW, {roundY:150, iconY:470});
    return h;
  }
};

/* ═══════════════════════════════════════════════════════════════════
   5. 並べて、入る大きさに縮める
   ═══════════════════════════════════════════════════════════════════ */
const ORDER = ["rail","side","tray","band"];
let current = ORDER[0];

function build(){
  const wrap = $("stagewrap");
  wrap.innerHTML = "";
  for (const k of ORDER){
    const d = document.createElement("div");
    d.className = "screen" + (k === current ? " on" : "");
    d.id = "sc-" + k;
    d.innerHTML = LAYOUTS[k].build();
    wrap.appendChild(d);
  }
  const tabs = $("tabs");
  tabs.innerHTML = "";
  ORDER.forEach((k,i)=>{
    const b = document.createElement("button");
    b.className = k === current ? "on" : "";
    b.innerHTML = `案${"ABCD"[i]}　${LAYOUTS[k].name}<small>${LAYOUTS[k].en}</small>`;
    b.onclick = () => { current = k; build(); };
    tabs.appendChild(b);
  });
  const L = LAYOUTS[current];
  $("caption").innerHTML = `${L.lead}
    <div class="row"><span><b>効くところ</b>　${L.pro}</span></div>
    <div class="row ng"><span><b>弱いところ</b>　${L.con}</span></div>`;
  fit();
}

function fit(){
  const wrap = $("stagewrap");
  const s = Math.min(1, wrap.clientWidth / 1280);
  for (const k of ORDER){
    const el = $("sc-"+k);
    if (el) el.style.transform = `scale(${s})`;
  }
  wrap.style.height = Math.round(720*s) + "px";
  $("scale").textContent = `表示 ${Math.round(s*100)}%`;
}
addEventListener("resize", fit);
build();
</script>
