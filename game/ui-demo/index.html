<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戦闘画面のレイアウト案</title>
<meta name="description" content="射的の杖・試作版。横画面の戦闘画面レイアウト案を並べて見比べる。見た目だけで機能は無し。">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f0e">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>戦闘画面のレイアウト案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   射的の杖・試作版 — 戦闘画面のレイアウト案
   見た目だけ。機能は一切入れていない。数字も文言も仮。
   ルーレットは、いまある wheel/ を写した静止画を貼ってあるだけ。
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* 色は 16 だけ。ルーレットと同じ系統にして、ひと続きの世界に見せる */
  --ink0:#0b0f0e; --ink1:#141a18; --ink2:#1e2724; --ink3:#2b3733;
  --line:#3f514b; --line-hi:#5b736b;
  --wood:#4a2a18; --wood-hi:#6d3f24; --wood-lo:#2c180d;
  --brass:#c9a227; --brass-hi:#f0d878; --brass-lo:#8a6d15;
  --ivory:#f2ece0; --dim:#8a958e;
  --red:#b8262c; --red-hi:#d94a4a;
  --green:#2fa066; --blue:#3f7fa8; --purple:#7a4fa8;
  --felt:#0d5132; --felt-lo:#093a24;

  --dot: "DotGothic16", ui-monospace, monospace;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink0);color:var(--ivory);font-family:var(--dot);
  -webkit-font-smoothing:none}

/* ── 外枠（案を選ぶところ。ゲーム画面ではない） ── */
.page{max-width:1400px;margin:0 auto;padding:14px 14px 60px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.top h1{margin:0;font-size:20px;font-weight:400;letter-spacing:1px}
.top h1 em{font-style:normal;color:var(--brass)}
.top .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
.top .spacer{flex:1 1 auto}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font:inherit;font-size:13px;padding:8px 14px;cursor:pointer;
  background:var(--ink2);color:var(--dim);border:2px solid var(--line);
  box-shadow:3px 3px 0 var(--ink0)}
.tabs button:hover{color:var(--ivory);border-color:var(--line-hi)}
.tabs button.on{background:var(--brass);color:#1a1405;border-color:var(--brass-hi);
  font-weight:400}
.tabs button small{display:block;font-family:var(--mono);font-size:9.5px;opacity:.75}

.caption{background:var(--ink1);border:2px solid var(--line);padding:10px 12px;
  margin-bottom:12px;font-size:13px;line-height:1.75}
.caption b{color:var(--brass-hi)}
.caption .ng{color:var(--red-hi)}
.caption .row{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;
  font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.caption .row span b{color:var(--ivory);font-weight:400}

/* ── ゲーム画面。1280×720 で組んで、入る大きさに縮める ── */
.stagewrap{position:relative;width:100%;overflow:hidden;
  border:2px solid var(--line);background:#000}
.screen{position:absolute;left:0;top:0;width:1280px;height:720px;
  transform-origin:0 0;background:var(--ink0);overflow:hidden;
  display:none}
.screen.on{display:block}

/* ── 共通の部品 ── */
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--dim)}
.hr{height:2px;background:var(--line)}

/* ルーレット */
.wheelimg{display:block;width:100%;height:auto}
.bezel{background:var(--wood-lo);border:3px solid var(--wood-hi);
  box-shadow:inset 0 0 0 3px var(--wood), 0 0 0 2px var(--ink0)}

/* 敵 */
.foe{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.foe .sp{display:block}
/* 名前と数字は同じ行に並べる。重ねると必ずどちらかが読めなくなる */
.foe .nmrow{display:flex;align-items:baseline;gap:6px;line-height:1}
.foe .nmrow .nm{font-size:12px;color:var(--ivory)}
.foe .nmrow .num{font-family:var(--mono);font-size:10px;color:var(--red-hi)}
.foe .hp{width:100%;height:8px;background:var(--ink3);border:2px solid var(--ink0);
  box-shadow:0 0 0 1px var(--line)}
.foe .hp i{display:block;height:100%;background:var(--red)}
.foe.front::after{content:"";position:absolute;left:50%;top:-16px;
  width:0;height:0;margin-left:-7px;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:9px solid var(--brass)}
/* 「次の一手」の札。.foe の中でも外でも使う */
.intent{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--brass);
  background:var(--ink1);border:2px solid var(--line);padding:1px 5px;line-height:1.5}

/* 札（杖の 1 枚） */
.card{position:relative;flex:0 0 auto;background:var(--ink2);
  border:2px solid var(--line);box-shadow:3px 3px 0 var(--ink0);
  display:flex;flex-direction:column;overflow:hidden}
.card .top{display:flex;align-items:center;gap:4px;padding:3px 4px 2px;
  border:0;margin:0;background:var(--ink3)}
.card .ico{width:14px;height:14px;flex:0 0 auto}
.card .nm{font-size:11px;line-height:1.1;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .body{flex:1 1 auto;padding:4px;font-size:10px;line-height:1.35;color:var(--dim)}
.card .body em{font-style:normal;color:var(--ivory)}
.card.proj{border-color:var(--red)}
.card.proj .top{background:#3a1416}
.card.mod{border-color:var(--blue)}
.card.mod .top{background:#132a38}
.card.util{border-color:var(--brass-lo)}
.card.util .top{background:#332a0c}
.card .ord{position:absolute;right:2px;top:2px;font-family:var(--mono);font-size:9px;
  color:var(--dim)}

/* 矢印 */
.arrow{flex:0 0 auto;color:var(--line-hi);font-family:var(--mono);font-size:14px}

/* メーター */
.meter{position:relative;background:var(--ink3);border:2px solid var(--ink0);
  box-shadow:0 0 0 2px var(--line)}
.meter i{display:block;height:100%}
.meter .txt{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ivory);
  text-shadow:1px 1px 0 #000}

/* バフの粒 */
.chip{display:inline-flex;align-items:center;gap:3px;padding:1px 5px;
  background:var(--ink2);border:2px solid var(--line);font-size:10px;
  font-family:var(--mono)}
.chip.sh{border-color:var(--blue);color:#9ccfe8}
.chip.mi{border-color:var(--brass-lo);color:var(--brass-hi)}
.chip.po{border-color:var(--purple);color:#c9a8e8}

/* 押せそうに見えるボタン（押せない） */
.btn{font:inherit;font-size:13px;padding:7px 14px;background:var(--ink2);
  color:var(--ivory);border:2px solid var(--line);box-shadow:3px 3px 0 var(--ink0)}
.btn.go{background:var(--brass);color:#1a1405;border-color:var(--brass-hi)}
</style>

<div class="page">
  <div class="top">
    <h1>戦闘画面の<em>レイアウト案</em></h1>
    <div class="sub">射的の杖・試作版 / 見た目だけ・機能なし / 1280×720</div>
    <div class="spacer"></div>
    <div class="sub" id="scale">—</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="caption" id="caption"></div>
  <div class="stagewrap" id="stagewrap"></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════════════════════
   1. 中身。4 案とも同じ盤面を出す。違うのは並べ方だけ
   ═══════════════════════════════════════════════════════════════════ */
const FOES = [
  {nm:"どぶ鼠", sp:"rat",  hp:11, max:18, intent:"6 ダメージ"},
  {nm:"苔の塊", sp:"blob", hp:22, max:22, intent:"守る +8"},
  {nm:"骨兵",   sp:"bone", hp:9,  max:30, intent:"力 +3"},
];
const WAND = [
  {t:"mod",  nm:"倍加", ico:"mul",  body:"次の発射体の威力 <em>×2</em>"},
  {t:"mod",  nm:"貫通", ico:"pier", body:"奥へ <em>2 体</em>まで通す"},
  {t:"proj", nm:"火球", ico:"fire", body:"<em>9</em> ダメージ"},
  {t:"util", nm:"構え", ico:"gard", body:"盾 <em>+6</em>"},
  {t:"proj", nm:"氷矢", ico:"ice",  body:"<em>5</em> ダメージ・鈍化"},
];
const SELF = {nm:"あなた", hp:34, max:50, shield:6, might:3, poison:2, deck:9, used:5};

/* ═══════════════════════════════════════════════════════════════════
   2. ドット絵。文字列の格子から <svg> の矩形を起こす
   ═══════════════════════════════════════════════════════════════════ */
const SPRITES = {
  rat: {key:{b:"#6d5a4a", d:"#4a3c31", w:"#f2ece0", e:"#0b0f0e"}, rows:[
    "..............",
    "..............",
    ".b..........b.",
    ".bb........bb.",
    "..bbbbbbbbbb..",
    ".bbbbbbbbbbbbd",
    ".bbwbbbbbbwbbd",
    "bbbbbbbbbbbbb.",
    "bbbbbbbbbbbbb.",
    ".bbbbbbbbbbbb.",
    "..dd..dd..dd..",
    "..dd..dd..dd..",
    "..............",
    "..............",
  ]},
  blob: {key:{g:"#2fa066", d:"#1a6b45", w:"#f2ece0", h:"#8ee0b0"}, rows:[
    "..............",
    "..............",
    ".....hhhh.....",
    "...hhgggghh...",
    "..gggggggggg..",
    ".gggwggggwggg.",
    ".gggwggggwggg.",
    ".gggggggggggg.",
    "gggggggggggggg",
    "gggggggggggggg",
    ".dddggggggddd.",
    "..dddddddddd..",
    "..............",
    "..............",
  ]},
  bone: {key:{i:"#d8d2c2", d:"#8a8474", e:"#0b0f0e"}, rows:[
    ".....iiii.....",
    "....iiiiii....",
    "....ideedi....",
    "....iiiiii....",
    ".....iddi.....",
    "...iiiiiiii...",
    "..iiiiiiiiii..",
    "..i.iiiiii.i..",
    "..i.iiiiii.i..",
    "....ii..ii....",
    "....ii..ii....",
    "...ddd..ddd...",
    "..............",
    "..............",
  ]},
  hero: {key:{p:"#c9a227", c:"#3f7fa8", d:"#28556f", s:"#e8c9a0", y:"#f0d878", e:"#0b0f0e"}, rows:[
    ".....pppp.....",
    "....pppppp....",
    "....psseps....",
    "....pssssp....",
    "...cccccccc.y.",
    "..cccccccccy..",
    "..ddccccccy...",
    "..ddcccccy....",
    "..ddcccccc....",
    "...cc..cc.....",
    "...cc..cc.....",
    "..ddd..ddd....",
    "..............",
    "..............",
  ]},
};

/** 格子 → SVG。px は 1 マスの大きさ */
function sprite(name, px){
  const s = SPRITES[name];
  const w = s.rows[0].length, h = s.rows.length;
  let r = "";
  for (let y=0;y<h;y++){
    const row = s.rows[y];
    let x = 0;
    while (x < row.length){
      const ch = row[x];
      if (ch === "."){ x++; continue; }
      let n = 1;
      while (x+n < row.length && row[x+n] === ch) n++;   // 同じ色は横につなげる
      r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${s.key[ch]}"/>`;
      x += n;
    }
  }
  return `<svg class="sp px" width="${w*px}" height="${h*px}" viewBox="0 0 ${w} ${h}"
    shape-rendering="crispEdges">${r}</svg>`;
}

/* 札の小さな記号 */
const ICONS = {

    <rect x="3" y="0" width="2" height="2" fill="#f0d878"/>
    <rect x="2" y="2" width="4" height="3" fill="#d94a4a"/>
    <rect x="1" y="4" width="6" height="3" fill="#b8262c"/></svg>`,
  ice: `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" width="14" height="14">
    <rect x="3" y="0" width="2" height="8" fill="#9ccfe8"/>
    <rect x="0" y="3" width="8" height="2" fill="#9ccfe8"/>
    <rect x="1" y="1" width="2" height="2" fill="#3f7fa8"/>
    <rect x="5" y="5" width="2" height="2" fill="#3f7fa8"/></svg>`,
  mul: `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" width="14" height="14">
    <rect x="1" y="1" width="2" height="2" fill="#f0d878"/>
    <rect x="5" y="1" width="2" height="2" fill="#f0d878"/>
    <rect x="3" y="3" width="2" height="2" fill="#c9a227"/>
    <rect x="1" y="5" width="2" height="2" fill="#f0d878"/>
    <rect x="5" y="5" width="2" height="2" fill="#f0d878"/></svg>`,
  pier: `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" width="14" height="14">
    <rect x="0" y="3" width="6" height="2" fill="#9ccfe8"/>
    <rect x="5" y="2" width="2" height="4" fill="#3f7fa8"/>
    <rect x="6" y="1" width="2" height="6" fill="#3f7fa8"/></svg>`,
  gard: `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" width="14" height="14">
    <rect x="1" y="0" width="6" height="5" fill="#c9a227"/>
    <rect x="2" y="5" width="4" height="2" fill="#c9a227"/>
    <rect x="3" y="7" width="2" height="1" fill="#8a6d15"/></svg>`,
};

/* ═══════════════════════════════════════════════════════════════════
   3. 共通の部品
   ═══════════════════════════════════════════════════════════════════ */
const abs = (x,y,w,h,cls,html) =>
  `<div class="${cls||""}" style="position:absolute;left:${x}px;top:${y}px;`+
  (w?`width:${w}px;`:"")+(h?`height:${h}px;`:"")+`">${html||""}</div>`;

function foeBlock(f, px, front, opt){
  const o = opt || {};
  const pct = Math.round(f.hp / f.max * 100);
  return `<div class="foe${front ? " front" : ""}">
    ${o.intent !== false ? `<span class="intent">${f.intent}</span>` : ""}
    ${sprite(f.sp, px)}
    ${o.name !== false
      ? `<div class="nmrow"><span class="nm">${f.nm}</span>
           <span class="num">${f.hp}/${f.max}</span></div>` : ""}
    <div class="hp" style="width:${o.hpw || 84}px"><i style="width:${pct}%"></i></div>
  </div>`;
}

function cardBlock(c, w, h, ord){
  return `<div class="card ${c.t}" style="width:${w}px;height:${h}px">
    ${ord ? `<span class="ord">${ord}</span>` : ""}
    <div class="top"><span class="ico">${ICONS[c.ico]}</span><span class="nm">${c.nm}</span></div>
    <div class="body">${c.body}</div>
  </div>`;
}

function selfBar(w){
  const pct = Math.round(SELF.hp / SELF.max * 100);
  return `<div style="display:flex;align-items:center;gap:10px">
    ${sprite("hero", 3)}
    <div style="flex:1 1 auto;min-width:0">
      <div class="meter" style="height:18px;width:${w}px">
        <i style="width:${pct}%;background:var(--red)"></i>
        <span class="txt">${SELF.hp} / ${SELF.max}</span>
      </div>
      <div style="margin-top:6px;display:flex;gap:6px">
        <span class="chip sh">盾 ${SELF.shield}</span>
        <span class="chip mi">力 ${SELF.might}</span>
        <span class="chip po">毒 ${SELF.poison}</span>
      </div>
    </div>
  </div>`;

/* ═══════════════════════════════════════════════════════════════════
   4. 案。1280×720 の中に、座標で置いていく
   ═══════════════════════════════════════════════════════════════════ */
const LAYOUTS = {};

/* ── 案A 卓 ───────────────────────────────────────────────────────
   ルーレットと戦闘を「同じ台の上」に置く。盤は台に嵌まった装置で、
   敵も札も同じフェルトの上にある。世界がひと続きに見える。 */
LAYOUTS.table = {
  name:"卓", en:"TABLE",
  lead:"ルーレットと戦闘を<b>同じ台の上</b>に置く。盤は卓に嵌まった装置で、敵も札も同じフェルトの上にいる。",
  pro:"世界がひと続きに見える。盤が「別画面の抽選機」ではなく卓の一部になる",
  con:"フェルトの緑が画面の大半を占めるので、札や敵の色が沈みやすい",
  build(){
    const felt = 400;
    let h = "";
    // 台
    h += abs(0,0,1280,720,"", `<div style="position:absolute;inset:0;
      background:radial-gradient(120% 90% at 62% 10%, #12653f 0%, var(--felt) 45%, var(--felt-lo) 100%)"></div>`);
    // 左：木の張り出しと盤
    h += abs(0,0,felt,720,"", `<div style="position:absolute;inset:0;
      background:linear-gradient(90deg, var(--wood-lo), var(--wood) 60%, var(--wood-hi));
      border-right:4px solid var(--wood-lo)"></div>`);
    h += abs(24,84,352,0,"bezel", wheel(346));
    h += abs(24,44,352,0,"", `<div class="lbl" style="color:#e0c9a8">Wheel — 抽選</div>`);
    h += abs(24,520,352,0,"", `
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
        <span class="lbl" style="color:#e0c9a8">玉</span>
        ${[1,2,3].map(n=>`<span class="chip" style="border-color:#8a6d15;color:#f0d878">${n}</span>`).join("")}
      </div>
      <button class="btn go" style="width:100%;font-size:16px;padding:12px">投 げ る</button>
      <div class="lbl" style="margin-top:10px;color:#c9b89a">残り札 ${SELF.deck} / 使用済 ${SELF.used}</div>`);
    // 上の帯
    h += abs(felt+28,18,0,0,"", `<span class="lbl">地下 3 階 — 戦闘 2 / 3</span>`);
    // 敵の列（手前が左）
    const xs = [felt+50, felt+290, felt+520];
    const ys = [96, 74, 56];
    FOES.forEach((f,i)=>{ h += abs(xs[i], ys[i], 0, 0, "", foeBlock(f, i===0?7:6, i===0)); });
    h += abs(felt+28, 62, 0, 0, "", `<span class="lbl">← 前</span>`);
    // 杖
    h += abs(felt+28, 306, 824, 2, "hr");
    h += abs(felt+28, 318, 0, 0, "", `<span class="lbl">Wand — 落ちた順が詠唱の順</span>`);
    h += abs(felt+28, 340, 824, 124, "", `<div style="display:flex;align-items:stretch;gap:0">
      ${WAND.map((c,i)=> cardBlock(c,146,124,i+1) + (i<WAND.length-1
        ? `<div class="arrow" style="display:flex;align-items:center;padding:0 6px">▶</div>` : "")).join("")}
    </div>`);
    // 自分と、直前の出目
    h += abs(felt+28, 492, 824, 2, "hr");
    h += abs(felt+28, 510, 0, 0, "", `<span class="lbl">Self</span>`);
    h += abs(felt+28, 534, 520, 0, "", selfBar(500));
    h += abs(felt+600, 510, 0, 0, "", `<span class="lbl">直前の出目</span>`);
    h += abs(felt+600, 532, 252, 0, "", `
      <div style="background:rgba(9,58,36,.75);border:2px solid var(--line);padding:8px 10px">
        ${["火球 → 倍加 → 構え","氷矢 → 貫通","倍加 → 火球"].map((t,i)=>`
          <div style="font-size:12px;color:${i?"var(--dim)":"var(--ivory)"};
            padding:2px 0">${t}</div>`).join("")}
      </div>`);
    h += abs(felt+28, 646, 824, 2, "hr");
    h += abs(felt+28, 662, 0, 0, "", `<span class="lbl">
      落ちた札が左から順に杖へ入る　—　修飾は次の発射体に乗る</span>`);
    return h;
  }
};

/* ── 案B 機械 ─────────────────────────────────────────────────────
   盤を機械に嵌め、右を計器盤にする。区画がはっきり分かれていて、
   どこに何が出るかが決まっている。Into the Breach 的な硬さ。 */
LAYOUTS.console = {
  name:"機械", en:"CONSOLE",
  lead:"盤を機械に嵌めて、右を<b>計器盤</b>にする。枠がはっきり分かれていて、どこに何が出るかが固定される。",
  pro:"情報が探しやすい。札が増えても枠が崩れない。Into the Breach 的な硬さ",
  con:"戦っている感じは薄い。枠線が多いぶん画面が忙しく見えることがある",
  build(){
    const L = 420;
    let h = "";
    h += abs(0,0,1280,720,"", `<div style="position:absolute;inset:0;background:var(--ink0)"></div>`);
    // 左の機械
    h += abs(0,0,L,720,"", `<div style="position:absolute;inset:0;background:var(--ink1);
      border-right:4px solid var(--line)"></div>`);
    // リベット
    let riv = "";
    for (let y=24;y<720;y+=64) riv += `<div style="position:absolute;left:${L-18}px;top:${y}px;
      width:8px;height:8px;background:var(--line-hi);box-shadow:1px 1px 0 var(--ink0)"></div>`;
    h += riv;
    h += abs(30,26,0,0,"", `<span class="lbl">Wheel — 抽選装置</span>`);
    h += abs(30,50,360,0,"bezel", wheel(354));
    h += abs(30,376,360,0,"", `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${[["区画","5"],["玉","2"],["残り札",SELF.deck],["使用済",SELF.used]].map(([k,v])=>`
          <div style="background:var(--ink2);border:2px solid var(--line);padding:6px 8px">
            <div class="lbl">${k}</div>
            <div style="font-family:var(--mono);font-size:20px;color:var(--brass-hi)">${v}</div>
          </div>`).join("")}
      </div>
      <button class="btn go" style="width:100%;margin-top:12px;font-size:16px;padding:12px">投 げ る</button>`);
    // 右の 3 枚の板
    const panel = (x,y,w,ht,label,inner) =>
      abs(x,y,w,ht,"", `<div style="position:absolute;inset:0;background:var(--ink1);
        border:2px solid var(--line)"></div>
        <div style="position:absolute;left:10px;top:-9px;background:var(--ink0);padding:0 6px">
          <span class="lbl">${label}</span></div>
        <div style="position:absolute;left:14px;top:18px;right:14px;bottom:12px">${inner}</div>`);
    const RX = L+24, RW = 1280-L-48;
    h += panel(RX, 26, RW, 232, "Enemy line — 前から当たる", `
      <div style="display:flex;align-items:flex-end;gap:34px;height:100%">
        ${FOES.map((f,i)=> foeBlock(f, 6, i===0)).join(
          `<div class="arrow" style="align-self:center">◀</div>`)}
        <div style="flex:1 1 auto"></div>
        <div style="align-self:flex-start;text-align:right">
          <div class="lbl">次の一手</div>
          <div style="font-size:12px;color:var(--brass-hi);margin-top:4px">合計 6 ダメージ</div>
        </div>
      </div>`);
    h += panel(RX, 288, RW, 236, "Wand — 落ちた順が詠唱の順", `
      <div style="display:flex;align-items:stretch;gap:0;height:100%">
        ${WAND.map((c,i)=> cardBlock(c,146,192,i+1) + (i<WAND.length-1
          ? `<div class="arrow" style="display:flex;align-items:center;padding:0 5px">▶</div>` : "")).join("")}
      </div>`);
    h += panel(RX, 556, RW, 148, "Self", `
      <div style="display:flex;align-items:center;gap:18px;height:100%">
        ${sprite("hero",4)}
        <div style="flex:1 1 auto">
          <div class="meter" style="height:22px">
            <i style="width:${Math.round(SELF.hp/SELF.max*100)}%;background:var(--red)"></i>
            <span class="txt">${SELF.hp} / ${SELF.max}</span>
          </div>
          <div style="margin-top:8px;display:flex;gap:8px">
            <span class="chip sh">盾 ${SELF.shield}</span>
            <span class="chip mi">力 ${SELF.might}</span>
            <span class="chip po">毒 ${SELF.poison}</span>
          </div>
        </div>
      </div>`);
    return h;
  }
};

/* ── 案C 舞台 ─────────────────────────────────────────────────────
   右を横から見た舞台にする。奥へ行くほど上に小さく並ぶ。
   手前に細い帯を置いて、そこに杖と自分をまとめる。 */
LAYOUTS.stage = {
  name:"舞台", en:"STAGE",
  lead:"右を<b>横から見た舞台</b>にする。奥へ行くほど上に並び、手前の帯に杖と自分をまとめる。",
  pro:"戦っている感じがいちばん強い。敵の「列」が絵として分かる",
  con:"札の置き場が細い帯だけなので、詳細を書ききれない。札が増えると横に溢れる",
  build(){
    const L = 340, SX = L;
    let h = "";
    h += abs(0,0,1280,720,"", `<div style="position:absolute;inset:0;background:var(--ink0)"></div>`);
    // 舞台：壁と床の帯
    h += abs(SX,0,1280-SX,300,"", `<div style="position:absolute;inset:0;
      background:linear-gradient(180deg,#0e1614,#18211e)"></div>`);
    /* 帯の境目が、そのまま「その列の足元の線」になるように置く。
       奥の敵ほど上の帯に立つ。ここを合わせないと、敵が床から浮いて見える。 */
    const bands = [["#212c28",300,112],["#1a2420",412,43],["#141d1a",455,37],["#101816",492,64]];
    bands.forEach(([c,y,ht])=> h += abs(SX,y,1280-SX,ht,"",
      `<div style="position:absolute;inset:0;background:${c};border-top:2px solid #2f3d38"></div>`));
    // 壁のドット模様
    let brick = "";
    for (let y=18;y<292;y+=16) for (let x=SX+8;x<1268;x+=26){
      const bx = x + (y/16%2 ? 13 : 0);
      if (bx + 22 > 1274) continue;              // 枠の外へ出さない
      brick += `<div style="position:absolute;left:${bx}px;top:${y}px;
        width:22px;height:8px;background:#131b19"></div>`;
    }
    h += brick;
    // 松明。壁が広いので、明かりで奥行きを出す
    [SX+180, SX+520, SX+860].forEach(x=>{
      h += abs(x, 74, 0, 0, "", `<div style="width:10px;height:26px;background:var(--wood-hi)"></div>
        <div style="width:14px;height:14px;margin-left:-2px;margin-top:-30px;
          background:var(--brass-hi);box-shadow:0 0 24px 10px rgba(240,216,120,.22)"></div>`);
    });
    // 自分（手前・左）
    h += abs(SX+44, 394, 0, 0, "", sprite("hero", 7));   // 足元 = 492
    h += abs(SX+44, 500, 0, 0, "", `<span class="lbl">あなた</span>`);
    /* 足元 = y + 25 + 14×px。手前 492 / 中 455 / 奥 412 の線に合わせる */
    const ex = [SX+286, SX+528, SX+742], ey = [369, 346, 317], ep = [7,6,5];
    FOES.forEach((f,i)=>{ h += abs(ex[i], ey[i], 0, 0, "", foeBlock(f, ep[i], i===0, {hpw:68})); });
    h += abs(1088, 526, 0, 0, "", `<span class="lbl">← 前　　奥 →</span>`);
    // 手前の帯
    h += abs(0,556,1280,164,"", `<div style="position:absolute;inset:0;background:var(--ink1);
      border-top:4px solid var(--line)"></div>`);
    h += abs(20,572,0,0,"", `<span class="lbl">Wand</span>`);
    h += abs(20,592,760,112,"", `<div style="display:flex;align-items:stretch;gap:0">
      ${WAND.map((c,i)=> cardBlock(c,138,112,i+1) + (i<WAND.length-1
        ? `<div class="arrow" style="display:flex;align-items:center;padding:0 4px">▶</div>` : "")).join("")}
    </div>`);
    h += abs(812,572,0,0,"", `<span class="lbl">Self</span>`);
    h += abs(812,592,288,0,"", selfBar(288));
    h += abs(1130,572,0,0,"", `<span class="lbl">直前の出目</span>`);
    h += abs(1130,592,130,0,"", `
      <div style="background:var(--ink2);border:2px solid var(--line);padding:6px 8px;
        font-size:11px;line-height:1.6">火球 → 倍加<br><span style="color:var(--dim)">氷矢 → 貫通</span></div>`);
    h += abs(1130,660,130,0,"", `<button class="btn go" style="width:100%;padding:10px 0">投げる</button>`);
    // 左：盤
    h += abs(0,0,L,556,"", `<div style="position:absolute;inset:0;background:var(--ink1);
      border-right:4px solid var(--line)"></div>`);
    h += abs(18,20,0,0,"", `<span class="lbl">Wheel</span>`);
    h += abs(18,42,304,0,"bezel", wheel(298));
    h += abs(18,340,304,0,"", `
      <div style="display:flex;gap:6px;align-items:center">
        <span class="lbl">玉</span>
        ${[1,2,3].map(n=>`<span class="chip" style="border-color:var(--brass-lo);color:var(--brass-hi)">${n}</span>`).join("")}
      </div>
      <div style="margin-top:14px;background:var(--ink2);border:2px solid var(--line);padding:8px 10px">
        <div class="lbl">直前の出目</div>
        <div style="font-size:15px;margin-top:4px">火球 → 倍加 → 構え</div>
      </div>`);
    h += abs(0,502,L,2,"hr");
    h += abs(18,516,0,0,"", `<span class="lbl">地下 3 階 — 戦闘 2 / 3</span>`);
    return h;
  }
};

/* ── 案D 巻物 ─────────────────────────────────────────────────────
   杖を縦に置く。上から下へ読む順がそのまま詠唱の順になる。
   この作品の核（落ちた順が呪文）を、いちばんはっきり見せる並べ方。 */
LAYOUTS.scroll = {
  name:"巻物", en:"SCROLL",
  lead:"杖を<b>縦</b>に置く。上から下へ読む順が、そのまま詠唱の順。この作品の核をいちばんはっきり見せる並べ方。",
  pro:"「順番が呪文」が一目で伝わる。札 1 枚あたりの面積が広く、長い説明も書ける",
  con:"敵に使える幅が狭い。札が 7 枚を超えると縦に入りきらない",
  build(){
    const L = 336, R = 300, CX = L, CW = 1280 - L - R;
    let h = "";
    h += abs(0,0,1280,720,"", `<div style="position:absolute;inset:0;background:var(--ink0)"></div>`);
    // 左：盤
    h += abs(0,0,L,720,"", `<div style="position:absolute;inset:0;background:var(--ink1);
      border-right:4px solid var(--line)"></div>`);
    h += abs(18,22,0,0,"", `<span class="lbl">Wheel — 抽選</span>`);
    h += abs(18,46,300,0,"bezel", wheel(294));
    h += abs(18,306,300,0,"", `
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:12px">
        <span class="lbl">玉</span>
        ${[1,2,3].map(n=>`<span class="chip" style="border-color:var(--brass-lo);color:var(--brass-hi)">${n}</span>`).join("")}
      </div>
      <button class="btn go" style="width:100%;font-size:16px;padding:12px">投 げ る</button>`);
    h += abs(18,410,300,2,"hr");
    h += abs(18,428,300,0,"", `<span class="lbl">Self</span>`);
    h += abs(18,452,300,0,"", selfBar(230));
    h += abs(18,566,300,2,"hr");
    h += abs(18,584,300,0,"", `
      <div class="lbl">山札</div>
      <div style="font-family:var(--mono);font-size:26px;color:var(--brass-hi);margin-top:4px">
        ${SELF.deck}<span style="font-size:13px;color:var(--dim)"> / 使用済 ${SELF.used}</span></div>
      <div class="lbl" style="margin-top:18px">地下 3 階 — 戦闘 2 / 3</div>`);
    // 中：敵
    h += abs(CX+24,24,0,0,"", `<span class="lbl">Enemy line — 攻撃は前から当たる</span>`);
    const ys = [70, 268, 466];
    FOES.forEach((f,i)=>{
      h += abs(CX+24, ys[i], CW-48, 178, "", `
        <div style="position:absolute;inset:0;background:${i===0?"#1a2320":"var(--ink1)"};
          border:2px solid ${i===0?"var(--brass-lo)":"var(--line)"}"></div>
        <div style="position:absolute;left:16px;top:14px;bottom:14px;right:16px;
          display:flex;align-items:center;gap:20px">
          ${sprite(f.sp, i===0?8:7)}
          <div style="flex:1 1 auto">
            <div style="font-size:16px;margin-bottom:2px">${f.nm}
              ${i===0?`<span class="lbl" style="color:var(--brass)">　前</span>`:""}</div>
            <div class="meter" style="height:16px;max-width:260px">
              <i style="width:${Math.round(f.hp/f.max*100)}%;background:var(--red)"></i>
              <span class="txt">${f.hp} / ${f.max}</span>
            </div>
            <div style="margin-top:8px"><span class="intent">${f.intent}</span></div>
          </div>
        </div>`);
    });
    // 右：杖（縦）
    h += abs(1280-R,0,R,720,"", `<div style="position:absolute;inset:0;background:var(--ink1);
      border-left:4px solid var(--line)"></div>`);
    h += abs(1280-R+18,22,0,0,"", `<span class="lbl">Wand — 上から順に詠唱</span>`);
    const cy = 48, ch = 116, gap = 14;
    WAND.forEach((c,i)=>{
      const y = cy + i*(ch+gap);
      h += abs(1280-R+18, y, R-36, ch, "", cardBlock(c, R-36, ch, i+1));
      if (i < WAND.length-1)
        h += abs(1280-R+18+(R-36)/2-6, y+ch+1, 0, 0, "arrow", "▼");
    });
    return h;
  }
};

/* ═══════════════════════════════════════════════════════════════════
   5. 案を並べて、入る大きさに縮める
   ═══════════════════════════════════════════════════════════════════ */
const ORDER = ["table","console","stage","scroll"];
let current = ORDER[0];

function build(){
  const wrap = $("stagewrap");
  wrap.innerHTML = "";
  for (const k of ORDER){
    const d = document.createElement("div");
    d.className = "screen" + (k === current ? " on" : "");
    d.id = "sc-" + k;
    d.innerHTML = LAYOUTS[k].build();
    wrap.appendChild(d);
  }
  const tabs = $("tabs");
  tabs.innerHTML = "";
  ORDER.forEach((k,i)=>{
    const b = document.createElement("button");
    b.className = k === current ? "on" : "";
    b.innerHTML = `案${"ABCD"[i]}　${LAYOUTS[k].name}<small>${LAYOUTS[k].en}</small>`;
    b.onclick = () => { current = k; build(); };
    tabs.appendChild(b);
  });
  const L = LAYOUTS[current];
  $("caption").innerHTML = `${L.lead}
    <div class="row">
      <span><b>効くところ</b>　${L.pro}</span>
    </div>
    <div class="row">
      <span class="ng"><b>弱いところ</b>　${L.con}</span>
    </div>`;
  fit();
}

/** 1280×720 を、入る幅に合わせて縮める。伸ばしはしない */
function fit(){
  const wrap = $("stagewrap");
  const s = Math.min(1, wrap.clientWidth / 1280);
  for (const k of ORDER){
    const el = $("sc-"+k);
    if (el) el.style.transform = `scale(${s})`;
  }
  wrap.style.height = Math.round(720*s) + "px";
  $("scale").textContent = `表示 ${Math.round(s*100)}%`;
}
addEventListener("resize", fit);
build();
</script>
