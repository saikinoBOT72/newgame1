<title>戦闘画面</title>
<meta name="description" content="射的の杖・試作版の戦闘画面。仮想 640×360 の単一のドット格子で組み、整数倍で拡大する。">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090b">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>戦闘画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   射的の杖・試作版 — 戦闘画面（案E「二段」）
   見た目だけ。機能は入っていない。

   いちばん大事な決めごと：
   画面ぜんぶを「仮想 640×360 のドット」で組んで、最後に整数倍で拡大する。
   盤の裏画面が 300×250 なので、仮想画面ではそれが等倍で置ける。
   こうすると、盤のドット・人物のドット・枠線・文字が
   <b>ぜんぶ同じ大きさの升目に乗る</b>。素人くさく見える最大の原因は、
   ここが揃っていないこと（＝解像度の違うものを貼り合わせて見える）。
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* 影は下＋右。光は左上から。全部の凹凸をこの向きにそろえる */
  --u: 2px;                       /* 仮想 1 ドットの実寸 */
}
*{box-sizing:border-box}
html,body{margin:0;background:#07090b}
body{color:#d2c8b2;font-family:"DotGothic16",ui-monospace,monospace;
  -webkit-font-smoothing:none;image-rendering:pixelated}

.hold{position:relative;width:100%;overflow:hidden;background:#07090b}
/* 仮想画面。ここに 640×360 で描いて、整数倍で拡大する */
#scr{position:absolute;left:0;top:0;width:640px;height:360px;
  transform-origin:0 0;overflow:hidden;image-rendering:pixelated}
#scr *{image-rendering:pixelated}

/* 文字。DotGothic16 は 16px 設計なので、仮想 8（＝実寸 16）で焼くと崩れない */
.t{font-size:8px;line-height:10px}
/* 絵の上に乗る文字は 1 ドットの硬い影を付ける。ぼかさない */
.t.sh,.lbl.sh{text-shadow:1px 1px 0 #07090b}
.t2{font-size:16px;line-height:18px}

/* 面。光は左上：上と左が明るく、下と右が暗い */
.plate{position:absolute}
.plate>.f{position:absolute;inset:0}
.plate>.hi{position:absolute;left:0;top:0;right:1px;height:1px}
.plate>.hl{position:absolute;left:0;top:0;bottom:1px;width:1px}
.plate>.lo{position:absolute;left:1px;right:0;bottom:0;height:1px}
.plate>.lr{position:absolute;top:1px;right:0;bottom:0;width:1px}
.plate.sunk>.hi,.plate.sunk>.hl{opacity:0}
.plate.sunk>.dk{position:absolute;left:0;top:0;right:1px;height:1px}

.lbl{font-size:8px;line-height:10px;letter-spacing:0;color:#7a7264}

/* 画面は縦横とも真ん中に置く。まわりは余白（整数倍で入りきらないぶん） */
#wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
</style>


<div id="wrap"><div class="hold" id="hold"><div id="scr"></div></div></div>

/* ═══════════════════════════════════════════════════════════════════
   2. ディザ。グラデーションを使わない
   にじんだ階調はドット絵の見た目を一発で壊す。
   2 色を升目で混ぜて、段の途中を作る（順序ディザ・4×4 のベイヤー）。
   ═══════════════════════════════════════════════════════════════════ */
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
/** c0 の上に c1 を level/16 の密度で撒いた 4×4 の模様を返す */
function dither(c0, c1, level){
  let r = `<rect width="4" height="4" fill="${c0}"/>`;
  for (let y=0;y<4;y++) for (let x=0;x<4;x++)
    if (BAYER[y][x] < level) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c1}"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4" shape-rendering="crispEdges">${r}</svg>`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}
const ditherCSS = (c0,c1,lv) => `background-image:${dither(c0,c1,lv)};background-size:4px 4px`;

/* ═══════════════════════════════════════════════════════════════════
   3. ドット絵。升目を手で塗らず、形から起こして自動で陰と縁を付ける
   ここが本格的なドット絵との差がいちばん出るところ。
   ・光の向きを 1 つに決める（左上）
   ・当たっている辺は 1 段明るく、影の辺は 1 段暗く
   ・輪郭は黒ではなく、その色の いちばん暗い段（＝色付きの輪郭）
   手で 1 マスずつ塗る代わりに、形を置いてから機械的に付ける。
   ═══════════════════════════════════════════════════════════════════ */
function raster(w, h, ops){
  const g = Array.from({length:h}, ()=>new Array(w).fill(null));
  const put = (x,y,c) => { if (x>=0&&y>=0&&x<w&&y<h) g[y][x] = c; };
  for (const o of ops){
    if (o.k === "r"){
      for (let y=o.y;y<o.y+o.h;y++) for (let x=o.x;x<o.x+o.w;x++) put(x,y,o.c);
    } else if (o.k === "e"){                       // 升目の楕円
      const rx = o.w/2, ry = o.h/2, cx = o.x+rx-0.5, cy = o.y+ry-0.5;
      for (let y=o.y;y<o.y+o.h;y++) for (let x=o.x;x<o.x+o.w;x++){
        const dx = (x-cx)/rx, dy = (y-cy)/ry;
        if (dx*dx + dy*dy <= 1.02) put(x,y,o.c);
      }
    } else if (o.k === "p"){ put(o.x,o.y,o.c); }
    else if (o.k === "l"){                          // 太さ 1 の線
      const n = Math.max(Math.abs(o.x2-o.x), Math.abs(o.y2-o.y));
      for (let i=0;i<=n;i++)
        put(Math.round(o.x + (o.x2-o.x)*i/n), Math.round(o.y + (o.y2-o.y)*i/n), o.c);
    }
  }
  return g;
}
/** 左上から光を当てる。上か左が空いていれば 1 段明るく、下か右が空いていれば 1 段暗く */
function shade(g){
  const h = g.length, w = g[0].length;
  const at = (x,y) => (x<0||y<0||x>=w||y>=h) ? null : g[y][x];
  const out = g.map(r=>r.slice());
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const c = g[y][x]; if (!c || c.fix) continue;
    const lit  = !at(x,y-1) || !at(x-1,y);
    const dark = !at(x,y+1) || !at(x+1,y);
    if (lit && !dark) out[y][x] = {r:c.r, s:c.s+1};
    else if (dark && !lit) out[y][x] = {r:c.r, s:c.s-1};
  }
  return out;
}
/** 輪郭。塗った升目の外側に、その色のいちばん暗い段を置く */
function outline(g){
  const h = g.length, w = g[0].length;
  const at = (x,y) => (x<0||y<0||x>=w||y>=h) ? null : g[y][x];
  const out = g.map(r=>r.slice());
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    if (g[y][x]) continue;
    const n = at(x-1,y) || at(x+1,y) || at(x,y-1) || at(x,y+1);
    if (n) out[y][x] = {r:n.r, s:0, fix:true};
  }
  return out;
}
/** 升目 → SVG。横に同じ色が続くところは 1 本の矩形にまとめる */
function toSVG(g, cls){
  const h = g.length, w = g[0].length;
  let r = "";
  for (let y=0;y<h;y++){
    let x = 0;
    while (x < w){
      const c = g[y][x];
      if (!c){ x++; continue; }
      const col = C(c.r, c.s);
      let n = 1;
      while (x+n < w){ const d = g[y][x+n]; if (!d || C(d.r,d.s) !== col) break; n++; }
      r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${col}"/>`;
      x += n;
    }
  }
  return `<svg class="${cls||""}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
    shape-rendering="crispEdges">${r}</svg>`;
}
/** 形の座標ごと k 倍する。SVG を引き伸ばすと格子が壊れるので、
    升目に起こす前に大きくする。こうすれば 1 マスは画面の 1 ドットのまま。 */
function scaleOps(ops, k){
  const r = v => Math.round(v*k);
  return ops.map(o => o.k === "l"
    ? {...o, x:r(o.x), y:r(o.y), x2:r(o.x2), y2:r(o.y2)}
    : {...o, x:r(o.x), y:r(o.y), w:o.w!==undefined?Math.max(1,r(o.w)):undefined,
             h:o.h!==undefined?Math.max(1,r(o.h)):undefined});
}
const SPRITE_CACHE = {};
const kOf = (n,k) => k === undefined ? (SHAPES[n].k || 1) : k;
const spriteW = (n,k) => Math.round(SHAPES[n].w * kOf(n,k));
const spriteH = (n,k) => Math.round(SHAPES[n].h * kOf(n,k));
/** 同じ絵を大きさ違いで使う。SVG を引き伸ばさず、升目に起こす段階で倍率を変える */
function sprite(name, k){
  const kk = kOf(name, k), key = name + "@" + kk;
  if (!SPRITE_CACHE[key]){
    const d = SHAPES[name];
    SPRITE_CACHE[key] = toSVG(outline(shade(
      raster(spriteW(name,kk), spriteH(name,kk), kk === 1 ? d.ops : scaleOps(d.ops, kk)))));
  }
  return SPRITE_CACHE[key];
}
const S = (r,s) => ({r, s});

/* ═══════════════════════════════════════════════════════════════════
   5. カードの規格。縦横比 7:5（縦長）

   大事なのは「1 枚の枠を縮小して使い回さない」こと。
   縮小すると細部が潰れて、ただの汚い模様になる。
   本物のドット絵は<b>大きさごとに枠を描き直す</b>。

     小 45×63   … 一覧・持ち物など、種類が分かればいい所
     中 60×84   … 盤面に並ぶ「出た札」
     大 120×168 … 手に取って読む所（デッキ・図鑑・買い物）

   <b>大は中のちょうど 2 倍</b>にしてある。
   絵を 120×168 で 1 枚描けば、中は 2 で割るだけで格子が壊れない。
   絵の窓も 2 倍関係（中 50×46 / 大 100×92）。

   ルーン帯と費用の丸は「大」だけ。中と小では描かない。
   ═══════════════════════════════════════════════════════════════════ */
const CARD = {
  s: {w:45,  h:63,  fr:2, k:1,
      name:[2,2,41,11],     art:[2,15,41,46],  stat:null},
  m: {w:60,  h:84,  fr:3, k:1,
      name:[5,5,50,12],     art:[5,21,50,46],  stat:[5,70,50,11]},
  l: {w:120, h:168, fr:7, k:1.5, rune:true, cost:true,
      name:[40,12,70,22],   art:[10,42,100,92], stat:[10,140,100,22]},
};
const KIND = {proj:"red", util:"brass", foe:"green", self:"blue"};

/* ルーン。3×5 の升目に 1 ドットで刻む。
   最初は適当な記号を並べたらラテン文字に見えてしまったので、
   実際の古ノルド文字（フサルク）の形を写した。縦の幹に斜めの枝、が特徴。 */
const RUNES = [
  ["1..","11.","1..","11.","1.."],   // ᚠ
  ["1.1","1.1","1.1","1.1","111"],   // ᚢ（上下反転）
  ["1..","11.","1.1","11.","1.."],   // ᚦ
  ["1..","11.","11.","1..","1.."],   // ᚨ
  ["11.","1.1","11.","1.1","1.1"],   // ᚱ
  ["..1",".1.","1..",".1.","..1"],   // ᚲ
  ["1.1",".1.",".1.",".1.","1.1"],   // ᚷ
  ["1.1","1.1",".1.",".1.",".1."],   // ᛉ
  [".1.",".1.",".1.",".1.",".1."],   // ᛁ
  ["1.1","11.","1.1","1..","1.."],   // ᛇ
];
function rune(i, col){
  const g = RUNES[i % RUNES.length];
  let r = "";
  g.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if (ch === "1") r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${col}"/>`;
  }));
  return `<svg width="3" height="5" viewBox="0 0 3 5" shape-rendering="crispEdges">${r}</svg>`;
}

/** 丸い盤。四角い板だと費用が「押せる物」に見えないので、丸で作る */
function disc(d, ramp){
  const g = raster(d, d, [{k:"e", x:0, y:0, w:d, h:d, c:{r:ramp, s:3}}]);
  return toSVG(outline(shade(g)));
}

/** カード 1 枚。t は "s"/"m"/"l"

    絵は 3 通りの渡し方ができる。
      d.face  … 札まるごとの絵（枠まで自分で描いたもの）。ここで作る枠は描かない
      d.img   … 絵の窓に入れる絵。枠はこちらで描く
      d.art / d.glyph … 仮の中身（コードで起こしたドット絵・記号）

    face と img は<b>この寸法ちょうどか、その整数倍</b>で描いて渡すこと。
    半端な大きさを縮めると、せっかく揃えた格子が壊れる。
      face 中 60×84 / 大 120×168（大で 1 枚描けば中は 2 で割れる）
      img  中 50×46 / 大 100×92 */
function cardEl(x, y, t, d){
  const c = CARD[t], tone = KIND[d.kind] || "steel";
  const F = c.fr;
  let h = "";
  h += shadowOf(x, y, c.w, c.h, t === "l" ? 4 : 3);
  /* 札まるごとの絵を渡された時は、枠を描かずにそれだけを置く */
  if (d.face)
    return h + box(x, y, c.w, c.h, "overflow:hidden",
      `<img src="${d.face}" width="${c.w}" height="${c.h}" alt="${d.nm||""}">`);
  /* 枠。面の作り方は画面のほかの物と同じ（光は左上） */
  h += plate(x, y, c.w, c.h, {fill:C("steel",1), hi:C("steel",3), lo:C("steel",0)});
  h += plate(x+F-1, y+F-1, c.w-(F-1)*2, c.h-(F-1)*2,
    {fill:C("steel",1), hi:C("steel",0), lo:C("steel",2), sunk:true});
  /* 種類の色は、枠の内側に 1 ドットの線で入れる。塗り分けると絵が負ける */
  h += box(x+F, y+F, c.w-F*2, 1, `background:${C(tone,2)}`);
  h += box(x+F, y+c.h-F-1, c.w-F*2, 1, `background:${C(tone,1)}`);

  /* ルーン帯。大きいときだけ。小さい枠に入れると潰れて汚い模様になる */
  if (c.rune){
    const col = C("steel",3);
    for (let i=0;i<10;i++) h += box(x+12+i*10, y+1,       3, 5, "", rune(i*3,   col));
    for (let i=0;i<10;i++) h += box(x+12+i*10, y+c.h-6,   3, 5, "", rune(i*3+1, col));
    for (let i=0;i<11;i++) h += box(x+2,       y+18+i*12, 3, 5, "", rune(i*3+2, col));
    for (let i=0;i<11;i++) h += box(x+c.w-5,   y+18+i*12, 3, 5, "", rune(i*3+4, col));
  }
  /* 費用の丸。大きいときだけ */
  if (c.cost && d.cost !== undefined){
    h += box(x+10, y+11, 22, 22, "", disc(22, "bone"));
    h += box(x+10, y+11, 22, 22, `display:flex;align-items:center;justify-content:center`,
      `<span class="t" style="color:${C("steel",0)}">${d.cost}</span>`);
  }
  /* 名前の帯 */
  if (c.name && d.nm){
    const [nx,ny,nw,nh] = c.name;
    h += plate(x+nx, y+ny, nw, nh, {fill:C("bone",1), hi:C("bone",2), lo:C("bone",0)});
    h += box(x+nx, y+ny, nw, nh, `display:flex;align-items:center;justify-content:center`,
      `<span class="t" style="color:${C("steel",0)}">${d.nm}</span>`);
  }
  /* 絵の窓。奥に沈める */
  const [ax,ay,aw,ah] = c.art;
  h += plate(x+ax, y+ay, aw, ah, {fill:C(tone,0), hi:C("steel",0), lo:C("steel",2), sunk:true});
  if (d.img){
    h += box(x+ax, y+ay, aw, ah, "overflow:hidden",
      `<img src="${d.img}" width="${aw}" height="${ah}" alt="">`);
  } else if (d.art){
    const sw = spriteW(d.art, c.k), sh = spriteH(d.art, c.k);
    h += box(x+ax+((aw-sw)>>1), y+ay+ah-2-sh, sw, sh, "", sprite(d.art, c.k));
    /* 窓の中の床。絵が宙に浮かないように */
    h += box(x+ax+1, y+ay+ah-2, aw-2, 1, `background:${C(tone,2)}`);
  }
  if (d.glyph)
    h += box(x+ax+((aw-24)>>1), y+ay+((ah-24)>>1), 24, 24, "", glyph(d.glyph, 24));

  /* 下の欄。中＝HP か効果、大＝説明文。小は名前だけなので下の欄を持たない */
  if (c.stat){
  const [sx,sy,sw2,sh2] = c.stat;
  {
    h += plate(x+sx, y+sy, sw2, sh2, {fill:C("bone",1), hi:C("bone",2), lo:C("bone",0)});
    if (d.hp !== undefined){
      /* HP は棒と数字と色の 3 つで出す */
      const bw = sw2-6, bh = t === "l" ? 12 : 7;
      h += plate(x+sx+3, y+sy+3, bw, bh, {fill:C("red",0), hi:C("steel",1), lo:C("steel",0), sunk:true});
      h += box(x+sx+4, y+sy+4, Math.round((bw-2)*d.hp/d.max), bh-2, `background:${C("red",3)}`);
      h += box(x+sx+4, y+sy+4, Math.round((bw-2)*d.hp/d.max), 1, `background:${C("red",4)}`);
      h += box(x+sx+3, y+sy+3, bw, bh, `display:flex;align-items:center;justify-content:center`,
        `<span class="t sh" style="color:${C("bone",4)}">${d.hp}/${d.max}</span>`);
      if (t === "l" && d.text)
        h += box(x+sx+4, y+sy+18, sw2-8, 12, "", `<span class="t" style="color:${C("steel",0)}">${d.text}</span>`);
    } else if (d.text){
      h += box(x+sx+3, y+sy+2, sw2-6, sh2-4, "",
        `<span class="t" style="color:${C("steel",0)};line-height:11px">${d.text}</span>`);
    }
  }
  }
  /* 盾は名前の帯の左に紋章で出す（数字だけにしない） */
  if (d.shield){
    h += plate(x-3, y+(c.name?c.name[1]:2)-2, 15, 15,
      {fill:C("blue",2), hi:C("blue",4), lo:C("blue",0)});
    h += box(x-3, y+(c.name?c.name[1]:2)-2, 15, 15,
      `display:flex;align-items:center;justify-content:center`,
      `<span class="t sh" style="color:${C("bone",4)}">${d.shield}</span>`);
  }
  return h;
}

/* ── 出た札。溝に立てて横一列に並べる ──────────────────────────
   修飾（次の札に乗るもの）と、並びの順番は廃止した。
   1 枚ずつが独立して効くので、束ねる棒も順番の数字も要らない。 */
function drawnRow(x, y, step){
  let h = "";
  DRAWN.forEach((c,i)=>{ h += cardEl(x + i*step, y, "m", c); });
  return h;
}

/* ── 札が立つ溝。カウンターに彫った 1 本の筋 ────────────────────
   機械の出口からそのまま右へ通す。これが「札は機械から出てきた」の説明になる。
   前は管を引いて説明していたが、盤と札が同じ段に並んだので、
   溝が 1 本つながっていれば足りる。 */
function groove(x, y, w){
  let h = "";
  h += box(x, y,   w, 1,  `background:${C("steel",0)}`);      // 彫りの上端は暗い
  h += box(x, y+1, w, 13, `background:${C("steel",1)};${ditherCSS(C("steel",1),C("steel",0),6)}`);
  h += box(x, y+14, w, 1, `background:${C("steel",4)}`);      // 手前の角は明るい
  return h;
}

/* ── 機械の札の出口。右の枠に開いた口 ── */
function outlet(x, y, h0){
  let h = "";
  h += plate(x-4, y-3, 10, h0+6, {fill:C("brass",2), hi:C("brass",4), lo:C("brass",0)});
  h += box(x-1, y, 7, h0, `background:${INK}`);
  h += box(x-1, y, 7, 1, `background:${C("brass",0)}`);
  return h;
}

/* ── レバー。丸ボタンではなく、床に立って機械につながる物にする ──
   実行の操作を世界の中の物にすると、UI が世界から浮かない。
   len を外から渡せるようにした（下段の高さが場所によって違うため）。 */
function lever(x, top, len){
  len = len || 80;
  const sw = 11;
  let h = "";
  /* 受け金具。ここから生えていることを見せる */
  h += shadowOf(x, top-14, 28, 24, 3);
  h += plate(x, top-14, 28, 24, {fill:C("steel",2), hi:C("steel",4), lo:C("steel",0)});
  h += plate(x+3, top-11, 22, 18, {fill:C("steel",1), hi:C("steel",0), lo:C("steel",3), sunk:true});
  [[x+5,top-9],[x+19,top-9],[x+5,top+1],[x+19,top+1]].forEach(([bx,by])=>
    h += plate(bx,by,3,3,{fill:C("brass",2), hi:C("brass",4), lo:C("brass",0)}));
  /* 軸。面の作り方は他と同じ（左が明るく右が暗い） */
  h += box(x+8, top, sw, len, `background:${C("steel",2)}`);
  h += box(x+8, top, 2, len, `background:${C("steel",4)}`);
  h += box(x+17, top, 2, len, `background:${C("steel",0)}`);
  for (let i=1; i*18 < len-6; i++)                        // 段。長い棒が板に見えないように
    h += box(x+7, top+i*18, 13, 2, `background:${C("steel",0)}`);
  /* 握り。丸は自動陰影がいちばん効く */
  h += box(x+2, top+len-6, 24, 24, "", sprite("knob"));
  /* 引く向き */
  for (let i=0;i<5;i++)
    h += box(x+11, top+len+21+i, 7-Math.floor(i*1.4), 1, `background:${C("brass",2)};opacity:.75`);
  /* 銘板。操作の名前は握りのすぐ下。床に離して置くと何の名前か分からない */
  h += shadowOf(x-9, top+len+29, 46, 18, 3);
  h += plate(x-9, top+len+29, 46, 18, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});
  h += box(x-9, top+len+29, 46, 18, `display:flex;align-items:center;justify-content:center`,
    `<span class="t sh" style="color:${C("brass",4)}">投げる</span>`);
  return h;
}

/* ── 玉の数。カウンターに埋めた小さな盤 ── */
function ballKeys(x, y){
  let h = "";
  h += plate(x, y, 104, 24, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});
  h += box(x+6, y+7, 16, 10, "", `<span class="lbl" style="color:${C("steel",5)}">玉</span>`);
  [1,2,3].forEach((n,i)=>{
    const on = n === 2, kx = x + 24 + i*26;
    h += plate(kx, y+4, 22, 16,
      {fill:on?C("brass",3):C("steel",2), hi:on?C("brass",4):C("steel",4), lo:on?C("brass",1):C("steel",0)});
    h += box(kx, y+4, 22, 16, `display:flex;align-items:center;justify-content:center`,
      `<span class="t" style="color:${on?C("wood",0):C("bone",2)}">${n}</span>`);
  });
  return h;
}

/* ── いま何階か。筐体に彫った札 ── */
function depth(x, y){
  let h = "";
  h += plate(x, y, 108, 24, {fill:C("steel",2), hi:C("steel",4), lo:C("steel",0)});
  h += box(x+7, y+7, 46, 10, "", `<span class="lbl" style="color:${C("steel",5)}">地下</span>`);
  h += box(x+46, y+7, 54, 10, `display:flex;justify-content:flex-end`,
    `<span class="t" style="color:${C("bone",3)}">${SELF.floor} / ${SELF.floors}</span>`);
  return h;
}

/* ── 右上。所持金と持ち物だけ。小さく、壁に留めた札のように ──
   上段が 100 ドットしかないので、前より 8 ドット薄くした。
   これ以上厚くすると、いちばん右の敵の「次の一手」とぶつかる。 */
function topRight(){
  const w = 118, x = VW - w - 8, y = 4;
  let h = "";
  h += shadowOf(x, y, w, 18, 2);
  h += plate(x, y, w, 18, {fill:C("wood",1), hi:C("wood",3), lo:C("wood",0)});
  h += box(x+6, y+4, 10, 10, "", glyph("coin", 10));
  h += box(x+18, y+4, 44, 10, `display:flex;justify-content:flex-end`,
    `<span class="t" style="color:${C("brass",4)}">${SELF.coin}</span>`);
  h += box(x+68, y+2, 1, 14, `background:${C("wood",0)}`);
  /* 持ち物 */
  h += plate(x+74, y+2, 40, 14, {fill:C("wood",2), hi:C("wood",4), lo:C("wood",0)});
  h += box(x+74, y+2, 40, 14, `display:flex;align-items:center;justify-content:center`,
    `<span class="t" style="color:${C("bone",3)}">持ち物</span>`);
  return h;
}

/* ── 役者。足元の線をそろえ、床に硬い接地影を落とす ──
   上段が薄いので、HP の帯を足元から dy だけ下に置けるようにした。 */
function actor(sp, x, foot, d, front, dy){
  dy = dy === undefined ? 9 : dy;
  const S0 = SHAPES[sp], sw = S0.w, sh = S0.h;
  let h = "";
  h += box(x+2, foot-3, sw-2, 5, `background:${INK};opacity:.55`);   // 接地影
  h += box(x, foot-sh, sw, sh, "", sprite(sp));
  const bw = Math.max(sw+6, 50);
  const bx = x + (sw-bw)/2|0;
  /* HP。記号＋数字＋色の 3 つで出す。数字だけにしない */
  h += plate(bx, foot+dy, bw, 9, {fill:C("red",0), hi:C("steel",2), lo:C("steel",0), sunk:true});
  h += box(bx+1, foot+dy+1, Math.round((bw-2)*d.hp/d.max), 7, `background:${C("red",3)}`);
  h += box(bx+1, foot+dy+1, Math.round((bw-2)*d.hp/d.max), 1, `background:${C("red",4)}`);
  h += box(bx, foot+dy, bw, 9, `display:flex;align-items:center;justify-content:center`,
    `<span class="t sh" style="color:${C("bone",4)}">${d.hp}/${d.max}</span>`);
  if (d.shield){
    h += plate(bx-11, foot+dy, 11, 9, {fill:C("blue",2), hi:C("blue",4), lo:C("blue",0)});
    h += box(bx-11, foot+dy, 11, 9, `display:flex;align-items:center;justify-content:center`,
      `<span class="t sh" style="color:${C("bone",4)}">${d.shield}</span>`);
  }
  /* 次の一手。敵だけ、頭の上に */
  if (d.act){
    const aw = d.act.length*22 - 4;
    let ax = x + (sw-aw)/2|0, ay = foot - sh - 15;
    d.act.forEach(([k,n])=>{
      h += box(ax, ay, 10, 10, "", glyph(k,10));
      h += box(ax+11, ay+1, 10, 9, "", `<span class="t sh" style="color:${C("bone",4)}">${n}</span>`);
      ax += 22;
    });
  }
  /* 前の敵に印。いま殴られるのはここ、が一目で分かるように */
  if (front){
    const mx = x + (sw/2|0) - 3;
    for (let i=0;i<4;i++)
      h += box(mx-3+i, foot-sh-24+i, 7-i*2, 1, `background:${C("brass",3)}`);
  }
  return h;
}


/* ═══════════════════════════════════════════════════════════════════
   5. 画面の部品
   ═══════════════════════════════════════════════════════════════════ */
const box = (x,y,w,h,style,inner,cls) =>
  `<div class="${cls||""}" style="position:absolute;left:${x}px;top:${y}px;
    width:${w}px;height:${h}px;${style||""}">${inner||""}</div>`;

/** 面。光は必ず左上から。上と左が 1 ドット明るく、下と右が 1 ドット暗い。
    へこませたい時は sunk で反転する。全部の凹凸をこの向きにそろえる。 */
function plate(x,y,w,h,o){
  o = o || {};
  const f = o.fill || C("wood",2);
  const hi = o.hi || C("wood",4), lo = o.lo || C("wood",0);
  const a = o.sunk ? lo : hi, b = o.sunk ? hi : lo;
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;
    background:${f};${o.dither||""};${o.z?`z-index:${o.z};`:""}">
    <div style="position:absolute;left:0;top:0;right:1px;height:1px;background:${a}"></div>
    <div style="position:absolute;left:0;top:0;bottom:1px;width:1px;background:${a}"></div>
    <div style="position:absolute;left:1px;right:0;bottom:0;height:1px;background:${b}"></div>
    <div style="position:absolute;top:1px;right:0;bottom:0;width:1px;background:${b}"></div>
    ${o.inner ? `<div style="position:absolute;inset:1px">${o.inner}</div>` : ""}
  </div>`;
}
/** 斜めの線は階段で刻む。回転させるとアンチエイリアスでにじむ */
function stair(x, y, len, dx, thick, col, alpha){
  let h = "";
  for (let i=0;i<len;i++)
    h += `<div style="position:absolute;left:${Math.round(x + i*dx)}px;top:${y+i}px;
      width:${thick}px;height:1px;background:${col};${alpha?`opacity:${alpha};`:""}"></div>`;
  return h;
}
/** 硬い落ち影。ぼかさない。右下へ 3 ドット */
const shadowOf = (x,y,w,h,d) =>
  box(x+(d||3), y+(d||3), w, h, `background:${INK}`);

/* ═══════════════════════════════════════════════════════════════════
   6. 中身
   ═══════════════════════════════════════════════════════════════════ */
const FOES = [
  {nm:"どぶ鼠", sp:"rat",  hp:11, max:18, act:[["atk",2],["atk",2],["atk",2]]},
  {nm:"苔の塊", sp:"blob", hp:22, max:22, act:[["def",8]]},
  {nm:"骨兵",   sp:"bone", hp:9,  max:30, act:[["atk",6]]},
];
/* 出た札。いまは仮の札（自分で描いた 1 枚）を並べているだけ。
   修飾（次の札に乗るもの）と、引いた順番の意味は廃止した。 */
const DRAWN = [0,1,2,3,4].map(()=>({face:FACE_M, nm:"仮"}));
const SELF = {hp:34, max:50, shield:6, floor:3, floors:20, coin:128};

/* ═══════════════════════════════════════════════════════════════════
   7. 画面を組む —— 案E「二段」

   上段（0..100）＝ 世界。石の壁・木の床・自分と敵が 1 本の線に立つ
   下段（100..360）＝ 装置。左に盤、右に出た札と操作

   下段は「机の上に盤を置いた」ではなく、<b>画面の下半分そのものが筐体の面</b>。
   盤はその面に開いた窓で、札はその面に彫った溝を滑ってくる。
   こうすると盤は世界に貼り付けた絵ではなくなる。

   材質を段ごとに変える。世界＝石と木、筐体＝鉄と真鍮。
   同じ木で作ると、床と筐体がつながって見えて段の境が消える。

   縦の割り算が厳しいことは承知の上：
   盤が 250 ドット（VH の 69%）を持っていくので、世界に残るのは 100 ドットしかない。
   骨兵 54 ＋ 頭上の印 15 ＋ HP 帯 11 ＝ 80。壁と床の奥行きに使えるのは残り 20。
   ═══════════════════════════════════════════════════════════════════ */
const VW = 640, VH = 360;
const BAND  = 100;          // 上段（世界）と下段（筐体）の境
const WALLH = 76;           // 壁と床の境
const FOOT  = 86;           // 自分も敵も、この線に立つ
const GX = 5, GY = 105, GW = 300, GH = 250;   // 盤の窓（等倍でちょうど入る）
const CHX = 318, CHW = VW - CHX - 4;          // 札の溝
const GRY = 235;                              // 溝の上端。札はここに立つ
const CDX = 319, CDS = 64;                    // 札の左端と間隔（60 + 4）

function screen(){
  let h = "";

  /* ══ 上段：世界 ════════════════════════════════════════════════ */

  /* 壁。上ほど明るく、下ほど暗い。段はディザで作る（にじませない） */
  h += box(0,0,VW,WALLH, `background:${C("stone",1)}`);
  [[0,22,10],[22,42,7],[42,60,4],[60,WALLH,1]].forEach(([y0,y1,lv])=>{
    h += box(0,y0,VW,y1-y0, `background:${C("stone",1)};${ditherCSS(C("stone",1),C("stone",3),lv)}`);
  });
  /* 石積み。目地は 1 ドット。奥（上）ほどコントラストを落とす */
  for (let y=2;y<WALLH-6;y+=13){
    const row = Math.round((y-2)/13), near = y > 40;
    for (let x=-16;x<VW;x+=28){
      h += box(x + (row%2 ? 14 : 0), y, 26, 11, `background:${C("stone",near?2:1)};
        border-right:1px solid ${C("stone",0)};border-bottom:1px solid ${C("stone",0)};
        opacity:${near?1:.7}`, "", "bleed");
    }
  }

  /* 壁の見切り。上段が薄いので、くぼみを彫ると穴が主役になってしまう。
     横に 1 本通すだけにする（壁が「板」に見えない程度の凹凸）。 */
  h += box(0, 50, VW, 3, `background:${C("stone",3)}`);
  h += box(0, 53, VW, 2, `background:${C("stone",0)}`);

  /* 床。壁と material を変える（木）。奥は暗く、手前ほど明るい。
     境に硬い明線を引くと、人物が「棚に乗っている」ように見える。
     暗い線 1 本＋ディザで受けて、床が奥へ寝ているようにする。 */
  h += box(0,WALLH,VW,BAND-WALLH, `background:${C("wood",1)}`);
  h += box(0,WALLH-1,VW,1, `background:${INK}`);
  h += box(0,WALLH,VW,4, ditherCSS(C("wood",0), C("wood",1), 7));
  h += box(0,WALLH+2,VW,8,  ditherCSS(C("wood",1), C("wood",0), 10));
  h += box(0,WALLH+10,VW,7, ditherCSS(C("wood",1), C("wood",2), 5));
  h += box(0,WALLH+17,VW,BAND-WALLH-17, ditherCSS(C("wood",1), C("wood",2), 7));
  for (let x=-20;x<VW;x+=74)                                   // 板の継ぎ目
    h += box(x, WALLH+2, 1, BAND-WALLH-2, `background:${C("wood",0)}`, "", "bleed");
  h += box(0,WALLH+10,VW,1, `background:${C("wood",0)}`);

  /* 筐体の明かりが、床と壁の下のほうを照らす（これもディザ） */
  h += box(0, WALLH, VW, BAND-WALLH, ditherCSS("transparent", C("brass",1), 4));
  h += box(0, 44, VW, WALLH-44,      ditherCSS("transparent", C("brass",1), 2));

  /* ══ 役者。上段の中で足元をそろえる ════════════════════════════ */
  h += actor("hero", 24, FOOT, {hp:SELF.hp, max:SELF.max, shield:SELF.shield}, false, 2);
  const fx = [300, 378, 452];
  FOES.forEach((f,i)=> h += actor(f.sp, fx[i], FOOT, f, i===0, 2));

  /* 右上に小さく。所持金と持ち物だけ */
  h += topRight();

  /* ══ 下段：筐体の面 ════════════════════════════════════════════ */

  /* 筐体が床に落とす硬い影。これが無いと下段が「帯」に見える */
  h += box(0, BAND-4, VW, 4, `background:${INK};opacity:.45`);

  /* 面。鉄。ディザで肌を作る */
  h += box(0, BAND, VW, VH-BAND, `background:${C("steel",2)}`);
  h += box(0, BAND, VW, VH-BAND, ditherCSS(C("steel",2), C("steel",1), 6));
  h += box(0, BAND,   VW, 2, `background:${C("brass",3)}`);     // 上端の真鍮
  h += box(0, BAND+2, VW, 1, `background:${C("brass",1)}`);
  h += box(0, BAND+3, VW, 3, `background:${C("steel",4)}`);     // 面取り（左上が明るい）
  h += box(0, BAND+6, VW, 1, `background:${C("steel",0)}`);
  for (let x=10;x<VW;x+=32)                                     // 鋲
    h += plate(x, BAND+9, 3, 3, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});
  /* 手前ほど明るい。面が寝ているように見せる */
  h += box(0, VH-40, VW, 40, ditherCSS("transparent", C("steel",3), 4));

  /* ── 盤の窓。筐体の面に開いた穴。ガラスの奥に盤がある ── */
  h += plate(1, 101, 308, 258, {fill:C("steel",3), hi:C("steel",5), lo:C("steel",1)});
  h += plate(GX-1, GY-1, GW+2, GH+2, {fill:INK, hi:C("steel",0), lo:C("steel",4), sunk:true});
  h += box(GX, GY, GW, GH, `overflow:hidden`,
    `<img src="${WHEEL_IMG}" width="${GW}" height="${GH}" alt="">` +
    box(0,0,GW,GH, ditherCSS("transparent", C("stone",0), 2)) +
    stair(-46, 0, GH, 0.62, 30, C("bone",4), .10) +
    stair(34,  0, GH, 0.62, 12, C("bone",4), .07) +
    box(0,0,GW,1, `background:${C("bone",2)};opacity:.30`));
  [[4,104],[302,104],[4,352],[302,352]].forEach(([bx,by])=>
    h += plate(bx,by,4,4,{fill:C("brass",2), hi:C("brass",4), lo:C("brass",0)}));

  /* ── 出た札 ──
     札の枠が鉄の筐体と同じ暗さなので、そのまま置くと溶ける。
     札の立つ所だけ 1 段くぼませて、明るい底を作る。 */
  h += box(CHX+2, 110, 60, 10, "", `<span class="lbl" style="color:${C("bone",4)}">出た札</span>`);
  h += box(CHX+52, 110, 240, 10, "",
    `<span class="lbl" style="color:${C("steel",5)}">1 枚ずつ、そのまま効く</span>`);
  h += box(CHX+2, 124, CHW-4, 1, `background:${C("steel",1)}`);
  h += plate(CHX, 132, CHW, 120, {fill:C("steel",1), hi:C("steel",0), lo:C("steel",4), sunk:true,
    dither:ditherCSS(C("steel",1), C("steel",2), 6)});

  h += outlet(312, GRY-7, 28);          // 窓の右枠に開いた札の出口
  h += groove(CHX, GRY, CHW);           // 出口からそのまま右へ通る溝
  h += drawnRow(CDX, GRY - CARD.m.h, CDS);

  /* ── 操作。溝の下に横一列。投げるは右端（親指の来る所） ── */
  h += ballKeys(334, 296);
  h += depth(452, 296);
  h += lever(596, 270, 36);
  return h;
}


/* ═══════════════════════════════════════════════════════════════════
   8. 出す。拡大は整数倍だけ。1.5 倍などにするとドットが割れる
   ═══════════════════════════════════════════════════════════════════ */
function boot(){
  $("scr").innerHTML = screen();
  fit();
}

/** 拡大は整数倍だけ。半端な倍率にするとドットが 2px と 3px に割れて、
    せっかく揃えた格子が壊れる。入りきらないぶんは中央に置いて余白にする。
    画面が 640 より狭いときだけは、やむを得ず端数を許す。 */
function fit(){
  const hold = $("hold"), w = hold.clientWidth;
  const s = w < VW ? w / VW : Math.floor(w / VW);
  const left = Math.floor((w - VW*s) / 2);
  $("scr").style.transform = `translateX(${left}px) scale(${s})`;
  hold.style.height = Math.round(VH*s) + "px";
}
addEventListener("resize", fit);
boot();
</script>
